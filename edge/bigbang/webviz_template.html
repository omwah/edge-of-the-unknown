<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge of the Unknown — Big Bang topology</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: #0b0f14; color: #cdd6e0;
    font-family: "DejaVu Sans", "Segoe UI", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh;
    cursor: grab; touch-action: none; background: radial-gradient(circle at 50% 45%, #101822, #0b0f14 70%); }
  #stage.grabbing { cursor: grabbing; }

  .overlay { position: fixed; z-index: 10; background: rgba(14,20,28,0.86);
    border: 1px solid #26323f; border-radius: 8px;
    backdrop-filter: blur(3px); }

  #title { top: 10px; left: 50%; transform: translateX(-50%);
    padding: 8px 18px; text-align: center; pointer-events: none; }
  #title .t-main { font-size: 16px; font-weight: 600; letter-spacing: .3px; }
  #title .t-sub  { font-size: 12px; color: #8695a6; margin-top: 2px; }

  #controls { top: 10px; left: 10px; padding: 10px 12px; font-size: 12.5px;
    max-width: 220px; }
  #controls h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .6px; color: #8695a6; font-weight: 600; }
  #controls label { display: flex; align-items: center; gap: 7px; margin: 5px 0;
    cursor: pointer; }
  #controls .btnrow { display: flex; gap: 6px; margin-top: 10px; }
  #controls button { flex: 1; padding: 6px 8px; font-size: 12px; cursor: pointer;
    color: #cdd6e0; background: #1a2430; border: 1px solid #2f3d4c;
    border-radius: 5px; }
  #controls button:hover { background: #223041; border-color: #3d5061; }
  #controls .hint { margin-top: 8px; font-size: 11px; color: #6f7f90;
    line-height: 1.4; }
  #controls .band-h { margin-top: 11px; }
  #controls .band-head { display: flex; gap: 6px; font-size: 10px; color: #6f7f90;
    margin: 0 0 3px; }
  #controls .band-head span.c { width: 14px; text-align: center; }
  #controls .band-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #controls .band-row input { width: 14px; margin: 0; cursor: pointer; }
  #controls.edit { border-color: #b8892f; box-shadow: 0 0 0 1px #b8892f55; }

  #legend { bottom: 10px; right: 10px; padding: 10px 12px; font-size: 12px;
    max-height: 78vh; overflow: auto; }
  #legend h3 { margin: 10px 0 5px; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .6px; color: #8695a6; font-weight: 600; }
  #legend h3:first-child { margin-top: 0; }
  #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #legend .sym { width: 16px; text-align: center; font-size: 14px; }
  #legend .swatch { width: 22px; height: 0; border-top-width: 3px;
    border-top-style: solid; }
  #legend .swatch.ring { border-radius: 50%; height: 12px; width: 12px;
    border: 2px dotted; border-top: none; }
  .badge { padding: 1px 6px; border-radius: 4px; background: #b8892f;
    color: #1a1206; font-size: 10px; font-weight: 700; }
  .outline-vis { transition: opacity 0.15s, stroke-width 0.15s; }
  .outline-group:hover .outline-vis, .outline-vis.dragging {
    opacity: 1 !important;
    stroke-width: 3.2px !important;
  }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0a060"></path>
    </marker>
  </defs>
  <g id="viewport"></g>
</svg>

<div id="title" class="overlay">
  <div class="t-main" id="title-main">Big Bang topology</div>
  <div class="t-sub" id="title-sub"></div>
</div>

<div id="controls" class="overlay">
  <h3>View</h3>
  <label><input type="checkbox" id="tg-id"> Show internal ids</label>
  <label><input type="checkbox" id="tg-core" checked> Core outline</label>
  <label><input type="checkbox" id="tg-cluster" checked> Cluster outlines</label>
  <label><input type="checkbox" id="tg-band" checked> Band rings</label>
  <h3 class="band-h">Bands</h3>
  <div class="band-head"><span class="c" title="nodes">N</span><span class="c" title="edges">E</span><span>band</span></div>
  <div id="band-toggles"></div>
  <label><input type="checkbox" id="tg-edit"> <b>Edit edges</b></label>
  <div class="btnrow">
    <button id="btn-save">Save edits</button>
    <button id="btn-reset">Reset layout</button>
  </div>
  <div class="hint" id="edit-hint"></div>
</div>

<div id="legend" class="overlay"></div>

<script>
"use strict";
const UNIVERSE = "__UNIVERSE_DATA__";

// ---- symbol + colour vocabulary (mirrored in the legend) --------------------
const PORT_SYMS = {
  STARDOCK: { g: "★", c: "#ffd54f", t: "StarDock" },
  PORT:     { g: "◆", c: "#c792ea", t: "Trade port" },
};
const PLANET_SYMS = {
  owned: { g: "●", c: "#66d38a", t: "Planet (owned)" },
  none:  { g: "○", c: "#9fb0a6", t: "Planet (unowned)" },
};
const DISC_SYMS = {
  NEBULA:       { g: "≋", c: "#7fd1ff", t: "Nebula" },
  BLACK_HOLE:   { g: "◉", c: "#b28bff", t: "Black hole" },
  WORMHOLE:     { g: "◎", c: "#7fd1ff", t: "Wormhole (one-way anchor)" },
  WRECK:        { g: "✕", c: "#ff9e64", t: "Shipwreck" },
  ENTITY:       { g: "Ψ", c: "#ff6b9d", t: "The Entity" },
  RUINS:        { g: "⌂", c: "#e0af68", t: "Ruins" },
  ARTIFACT:     { g: "❖", c: "#e0af68", t: "Artifact" },
  ANCIENT_TECH: { g: "✧", c: "#e0af68", t: "Ancient tech" },
  CRASHED_SHIP: { g: "⌖", c: "#ff9e64", t: "Crashed ship" },
};
const SPECIES_SYM = { g: "⬢", c: "#89ddff" };
const BAND_COLORS = { Hub: "#4fc3f7", Frontier: "#81c784", Deep: "#ba68c8", Void: "#ff8a65" };
const BAND_FALLBACK = "#8899aa";
const bandColor = (b) => BAND_COLORS[b] || BAND_FALLBACK;

const CORE_COLOR = "#ffd54f";
const EDGE_TWO = "#5a6b7a";
const EDGE_ONE = "#e0a060";
const SELECT = "#ff2a85";

const NODE_R = 24;
const SVGNS = "http://www.w3.org/2000/svg";

// ---- tiny SVG helper --------------------------------------------------------
function el(tag, attrs) {
  const node = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) node.setAttribute(k, attrs[k]);
  return node;
}

// ---- state ------------------------------------------------------------------
const svg = document.getElementById("stage");
const viewport = document.getElementById("viewport");
const sectors = UNIVERSE.sectors;
const meta = UNIVERSE.meta;
const byId = new Map(sectors.map((s) => [s.id, s]));

let nodePos = new Map();   // id -> {x,y} in world coords (mutated by drag)
let basePos = new Map();   // pristine copy for "reset layout"
let scale = 1;
let center = { x: 0, y: 0 };  // ring centre = Core anchor world pos

let currentEdges = UNIVERSE.edges.map((e) => ({ a: e.a, b: e.b, one_way: e.one_way }));
const baseEdges = UNIVERSE.edges.map((e) => ({ a: e.a, b: e.b, one_way: e.one_way }));

const T = { k: 1, tx: 0, ty: 0 };
let editMode = false, idMode = "spatial";
let pendingNode = null, selectedEdge = null, highlightedNode = null, highlightedEdgeKey = null;

// per-band visibility (nodes and edges independently); an edge is classed by its
// outer (deeper) endpoint's band.
const nodeBandOn = {}, edgeBandOn = {};
for (const b of meta.bands) { nodeBandOn[b.name] = true; edgeBandOn[b.name] = true; }

// layer groups (bottom -> top)
const gBands = el("g"), gClusters = el("g"), gCore = el("g"), gEdges = el("g"), gNodes = el("g");
viewport.append(gBands, gClusters, gCore, gEdges, gNodes);

// ---- layout -----------------------------------------------------------------
function median(arr) {
  if (!arr.length) return 1;
  const s = arr.slice().sort((a, b) => a - b);
  return s[s.length >> 1] || 1;
}
// Nudge overlapping nodes apart while preserving the radial structure: a few
// grid-bucketed passes that only push pairs closer than one node diameter. Cheap
// (near O(n) per pass via the spatial hash) and deterministic (id-based tie-break).
function relaxOverlaps(iterations = 200) {
  const sameTarget = 2 * NODE_R + 8;
  const maxTarget = 2 * NODE_R + 40; // 80 when NODE_R = 20
  const cell = maxTarget;
  const key = (cx, cy) => cx + "," + cy;
  for (let it = 0; it < iterations; it++) {
    const grid = new Map();
    for (const [id, p] of nodePos) {
      const k = key(Math.floor(p.x / cell), Math.floor(p.y / cell));
      (grid.get(k) || grid.set(k, []).get(k)).push(id);
    }
    let moved = false;
    for (const [id, p] of nodePos) {
      const s1 = byId.get(id);
      if (!s1) continue;
      const cx = Math.floor(p.x / cell), cy = Math.floor(p.y / cell);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const arr = grid.get(key(cx + dx, cy + dy));
        if (!arr) continue;
        for (const oid of arr) {
          if (oid <= id) continue;                 // handle each pair once
          const s2 = byId.get(oid);
          if (!s2) continue;

          const isSameCluster = (s1.is_core && s2.is_core) || (s1.region_id === s2.region_id);
          const pad1 = s1.is_core ? (NODE_R + 16) : (NODE_R + 8);
          const pad2 = s2.is_core ? (NODE_R + 16) : (NODE_R + 8);
          const target = isSameCluster ? sameTarget : (pad1 + pad2 + 16);

          const q = nodePos.get(oid);
          let ddx = q.x - p.x, ddy = q.y - p.y, d = Math.hypot(ddx, ddy);
          if (d >= target) continue;
          if (d < 1e-6) { ddx = ((id % 7) - 3) || 1; ddy = ((oid % 5) - 2) || 1; d = Math.hypot(ddx, ddy); }
          const push = (target - d) / 2, ux = ddx / d, uy = ddy / d;
          p.x -= ux * push; p.y -= uy * push;
          q.x += ux * push; q.y += uy * push;
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
}
function arrangeClusterRadial() {
  const sameTarget = 2 * NODE_R + 8;
  const gridSpacing = sameTarget + 8; // 56px between nodes

  function getNeighbors(id) {
    const neighbors = [];
    for (const e of currentEdges) {
      if (e.a === id) neighbors.push(e.b);
      else if (e.b === id) neighbors.push(e.a);
    }
    return neighbors;
  }

  function inSameCluster(id1, id2) {
    const s1 = byId.get(id1);
    const s2 = byId.get(id2);
    if (!s1 || !s2) return false;
    return (s1.is_core && s2.is_core) || (s1.region_id === s2.region_id);
  }

  // Group sector IDs by region_id
  const regionSectors = new Map();
  for (const s of sectors) {
    if (!regionSectors.has(s.region_id)) regionSectors.set(s.region_id, []);
    regionSectors.get(s.region_id).push(s.id);
  }

  for (const [regionId, ids] of regionSectors) {
    const pts = ids.map((id) => nodePos.get(id)).filter(Boolean);
    if (pts.length < 2) continue;

    // Centroid of the cluster
    const cx = pts.reduce((sum, p) => sum + p.x, 0) / pts.length;
    const cy = pts.reduce((sum, p) => sum + p.y, 0) / pts.length;

    // Classify nodes into external-facing and internal-only
    const externalNodes = [];
    const internalNodes = [];
    for (const id of ids) {
      const neighbors = getNeighbors(id);
      const isExternal = neighbors.some((nbrId) => !inSameCluster(id, nbrId));
      if (isExternal) {
        externalNodes.push(id);
      } else {
        internalNodes.push(id);
      }
    }

    const nOut = externalNodes.length;
    const nIn = internalNodes.length;

    // Calculate radii
    let rOut = 45;
    if (nOut > 1) {
      rOut = Math.max(rOut, gridSpacing / (2 * Math.sin(Math.PI / nOut)));
    }
    let rIn = 0;
    if (nIn > 1) {
      rIn = Math.max(30, gridSpacing / (2 * Math.sin(Math.PI / nIn)));
    }
    if (nIn > 0 && rOut - rIn < gridSpacing) {
      rOut = rIn + gridSpacing;
    }

    // Position outer (external-facing) nodes
    if (nOut > 0) {
      const extWithAngles = externalNodes.map((id) => {
        const extNbrs = getNeighbors(id).filter((nbr) => !inSameCluster(id, nbr));
        let sx = 0, sy = 0;
        for (const nbrId of extNbrs) {
          const np = nodePos.get(nbrId);
          if (np) { sx += np.x - cx; sy += np.y - cy; }
        }
        if (sx === 0 && sy === 0) {
          const p = nodePos.get(id);
          sx = p.x - cx; sy = p.y - cy;
        }
        return { id, angle: Math.atan2(sy, sx) };
      });
      extWithAngles.sort((a, b) => a.angle - b.angle);

      const baseAngle = extWithAngles[0].angle;
      for (let i = 0; i < nOut; i++) {
        const theta = baseAngle + (i / nOut) * 2 * Math.PI;
        const p = nodePos.get(extWithAngles[i].id);
        p.x = cx + Math.cos(theta) * rOut;
        p.y = cy + Math.sin(theta) * rOut;
      }
    }

    // Position inner (internal-only) nodes
    if (nIn > 0) {
      const intWithAngles = internalNodes.map((id) => {
        const p = nodePos.get(id);
        return { id, angle: Math.atan2(p.y - cy, p.x - cx) };
      });
      intWithAngles.sort((a, b) => a.angle - b.angle);

      for (let i = 0; i < nIn; i++) {
        const theta = (i / nIn) * 2 * Math.PI;
        const p = nodePos.get(intWithAngles[i].id);
        p.x = cx + Math.cos(theta) * rIn;
        p.y = cy + Math.sin(theta) * rIn;
      }
    }
  }
}
function relaxClusters(iterations = 80) {
  const clusters = [];
  if (UNIVERSE.hub_sector_ids.length > 0) {
    clusters.push({
      id: "core",
      sectorIds: UNIVERSE.hub_sector_ids,
      pad: NODE_R + 16
    });
  }
  const coreSet = new Set(UNIVERSE.hub_sector_ids);
  for (const reg of UNIVERSE.regions) {
    const nonCoreSectors = reg.sector_ids.filter((id) => !coreSet.has(id));
    if (nonCoreSectors.length > 0) {
      clusters.push({
        id: reg.id,
        sectorIds: reg.sector_ids,
        pad: NODE_R + 8
      });
    }
  }

  for (let it = 0; it < iterations; it++) {
    const forces = new Map(clusters.map((c, idx) => [idx, { x: 0, y: 0, count: 0 }]));
    let moved = false;
    for (let i = 0; i < clusters.length; i++) {
      const c1 = clusters[i];
      for (let j = i + 1; j < clusters.length; j++) {
        const c2 = clusters[j];
        let pushX = 0, pushY = 0, overlapCount = 0;
        const target = c1.pad + c2.pad + 16;
        for (const id1 of c1.sectorIds) {
          const p1 = nodePos.get(id1);
          if (!p1) continue;
          for (const id2 of c2.sectorIds) {
            const p2 = nodePos.get(id2);
            if (!p2) continue;
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dist = Math.hypot(dx, dy);
            if (dist < target) {
              const d = dist || 1e-3;
              const pushForce = target - d;
              pushX += (dx / d) * pushForce;
              pushY += (dy / d) * pushForce;
              overlapCount++;
            }
          }
        }
        if (overlapCount > 0) {
          const avgPushX = pushX / overlapCount;
          const avgPushY = pushY / overlapCount;
          const f1 = forces.get(i);
          f1.x -= avgPushX;
          f1.y -= avgPushY;
          f1.count++;
          const f2 = forces.get(j);
          f2.x += avgPushX;
          f2.y += avgPushY;
          f2.count++;
        }
      }
    }
    for (let i = 0; i < clusters.length; i++) {
      const f = forces.get(i);
      if (f.count > 0) {
        const dx = (f.x / f.count) * 0.4;
        const dy = (f.y / f.count) * 0.4;
        if (Math.hypot(dx, dy) > 0.05) {
          moved = true;
          const c = clusters[i];
          for (const id of c.sectorIds) {
            const p = nodePos.get(id);
            if (p) {
              p.x += dx;
              p.y += dy;
            }
          }
        }
      }
    }
    if (!moved) break;
  }
}
function buildLayout() {
  const lens = [];
  for (const e of currentEdges) {
    const a = byId.get(e.a), b = byId.get(e.b);
    if (a && b) lens.push(Math.hypot(a.x - b.x, a.y - b.y));
  }
  const med = median(lens.filter((v) => v > 0));
  scale = med > 0 ? 110 / med : 60;
  nodePos = new Map();
  for (const s of sectors) nodePos.set(s.id, { x: s.x * scale, y: s.y * scale });
  arrangeClusterRadial();
  relaxClusters();
  relaxOverlaps();
  // pristine copy (post-relaxation) so "reset layout" restores the de-overlapped view
  basePos = new Map();
  for (const [id, p] of nodePos) basePos.set(id, { x: p.x, y: p.y });
  // ring centre: the innermost sector (Core anchor, embedding origin)
  let anchor = sectors[0];
  for (const s of sectors) if (s.core_hops < anchor.core_hops) anchor = s;
  const ap = nodePos.get(anchor.id);
  center = { x: ap.x, y: ap.y };
}

function fitView() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of nodePos.values()) {
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }
  const w = Math.max(maxX - minX, 1), h = Math.max(maxY - minY, 1);
  const vw = svg.clientWidth, vh = svg.clientHeight;
  T.k = Math.max(0.05, Math.min(vw * 0.86 / w, vh * 0.86 / h, 3));
  T.tx = vw / 2 - (minX + w / 2) * T.k;
  T.ty = vh / 2 - (minY + h / 2) * T.k;
  applyTransform();
}
function applyTransform() {
  viewport.setAttribute("transform", `translate(${T.tx},${T.ty}) scale(${T.k})`);
}

// ---- geometry for outlines --------------------------------------------------
function convexHull(pts) {
  if (pts.length < 3) return pts.slice();
  const p = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [];
  for (const q of p) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop();
    lower.push(q);
  }
  const upper = [];
  for (let i = p.length - 1; i >= 0; i--) {
    const q = p[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop();
    upper.push(q);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}
function centroid(pts) {
  let x = 0, y = 0;
  for (const p of pts) { x += p.x; y += p.y; }
  return { x: x / pts.length, y: y / pts.length };
}
function inflate(hull, pad) {
  const c = centroid(hull);
  return hull.map((p) => {
    const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy) || 1;
    return { x: p.x + (dx / d) * pad, y: p.y + (dy / d) * pad };
  });
}
// An outline element around a set of sector ids: a rounded hull, or a circle for
// degenerate (1-2 point) clusters. Returns a <g> group with a pointer-events grab-target.
function outlineFor(ids, pad, stroke, dash, width) {
  const pts = ids.map((id) => nodePos.get(id)).filter(Boolean);
  if (!pts.length) return null;
  const g = el("g", { class: "outline-group" });
  
  const visAttrs = { class: "outline-vis", fill: "none", stroke, "stroke-width": width, "stroke-dasharray": dash,
    "stroke-linejoin": "round", "stroke-linecap": "round", opacity: 0.9 };
  const hitAttrs = { class: "outline-hit", fill: "none", stroke: "transparent", "stroke-width": width + 14,
    "stroke-linejoin": "round", "stroke-linecap": "round", style: "cursor: grab; pointer-events: stroke;" };

  if (pts.length < 3) {
    const c = centroid(pts);
    let r = NODE_R + pad;
    for (const p of pts) r = Math.max(r, Math.hypot(p.x - c.x, p.y - c.y) + NODE_R + pad);
    const hit = el("circle", Object.assign({ cx: c.x, cy: c.y, r }, hitAttrs));
    const vis = el("circle", Object.assign({ cx: c.x, cy: c.y, r }, visAttrs));
    g.append(hit, vis);
    return g;
  }
  const hull = inflate(convexHull(pts), pad);
  const d = "M" + hull.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" L") + " Z";
  const hit = el("path", Object.assign({ d }, hitAttrs));
  const vis = el("path", Object.assign({ d }, visAttrs));
  g.append(hit, vis);
  return g;
}

// ---- draw: band rings -------------------------------------------------------
let bandEls = [];   // { el, band } for each ring circle + label (for per-band gating)
function drawBands() {
  gBands.textContent = "";
  bandEls = [];

  // Recalculate center based on current anchor position
  let anchor = sectors[0];
  for (const s of sectors) if (s.core_hops < anchor.core_hops) anchor = s;
  const ap = nodePos.get(anchor.id);
  if (ap) center = { x: ap.x, y: ap.y };

  const membersByBand = new Map();
  for (const s of sectors) {
    if (!membersByBand.has(s.band)) membersByBand.set(s.band, []);
    membersByBand.get(s.band).push(s.id);
  }
  // order rings by radius so labels don't collide; draw a dotted ring at each
  // band's outer extent (empirical max distance from the Core anchor).
  const rings = [];
  for (const band of meta.bands.map((b) => b.name)) {
    const ids = membersByBand.get(band);
    if (!ids || !ids.length) continue;
    let r = 0;
    for (const id of ids) {
      const p = nodePos.get(id);
      r = Math.max(r, Math.hypot(p.x - center.x, p.y - center.y));
    }
    rings.push({ band, r: r + NODE_R + 14 });
  }
  rings.sort((a, b) => a.r - b.r);
  for (const ring of rings) {
    const circle = el("circle", {
      cx: center.x, cy: center.y, r: ring.r, fill: "none",
      stroke: bandColor(ring.band), "stroke-width": 2, "stroke-dasharray": "1 7",
      opacity: 0.75,
    });
    gBands.appendChild(circle);
    const label = el("text", {
      x: center.x, y: center.y - ring.r + 16, "text-anchor": "middle",
      fill: bandColor(ring.band), "font-size": 13, "font-weight": 600, opacity: 0.85,
    });
    label.textContent = ring.band;
    gBands.appendChild(label);
    bandEls.push({ el: circle, band: ring.band }, { el: label, band: ring.band });
  }
}

// ---- draw: cluster + core outlines ------------------------------------------
let clusterEls = [];        // { el, band } per region outline (for per-band gating)
let coreEl = null, coreBand = "";
function drawClusters() {
  gClusters.textContent = "";
  clusterEls = [];
  const coreSet = new Set(UNIVERSE.hub_sector_ids);
  for (const reg of UNIVERSE.regions) {
    if (reg.sector_ids.some((id) => coreSet.has(id))) continue;
    const o = outlineFor(reg.sector_ids, NODE_R + 8, bandColor(reg.band), "7 5", 1.6);
    if (o) {
      attachOutlineInteraction(o, reg.sector_ids, false);
      gClusters.appendChild(o);
      clusterEls.push({ el: o, band: reg.band });
    }
  }
}
function drawCore() {
  gCore.textContent = "";
  coreEl = outlineFor(UNIVERSE.hub_sector_ids, NODE_R + 16, CORE_COLOR, "2 6", 2.4);
  if (coreEl) {
    attachOutlineInteraction(coreEl, UNIVERSE.hub_sector_ids, true);
    gCore.appendChild(coreEl);
  }
  // Core Space sits in the innermost band, so it follows that band's node toggle.
  const first = UNIVERSE.hub_sector_ids[0];
  coreBand = (first != null && byId.get(first)) ? byId.get(first).band
    : (meta.bands[0] ? meta.bands[0].name : "");
}

// ---- draw: edges ------------------------------------------------------------
let edgeEls = [];
function edgeKey(e) {
  return e.one_way ? `o:${e.a}>${e.b}` : `t:${Math.min(e.a, e.b)}-${Math.max(e.a, e.b)}`;
}
function edgePath(e) {
  const a = nodePos.get(e.a), b = nodePos.get(e.b);
  if (!a || !b) return "";
  let dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.hypot(dx, dy) || 1;
  const ux = dx / dist, uy = dy / dist;
  const sx = a.x + ux * NODE_R, sy = a.y + uy * NODE_R;
  const ex = b.x - ux * NODE_R, ey = b.y - uy * NODE_R;
  const off = Math.min(dist * 0.06, 26);       // gentle bow so parallels separate
  const cx = (sx + ex) / 2 - uy * off, cy = (sy + ey) / 2 + ux * off;
  return `M${sx.toFixed(1)},${sy.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`;
}
function drawEdges() {
  gEdges.textContent = "";
  edgeEls = [];
  for (const e of currentEdges) {
    const d = edgePath(e);
    const g = el("g", { "data-key": edgeKey(e) });
    const hit = el("path", { d, fill: "none", stroke: "transparent", "stroke-width": 14,
      style: "cursor:pointer" });
    const vis = el("path", { d, fill: "none",
      stroke: e.one_way ? EDGE_ONE : EDGE_TWO,
      "stroke-width": 1.6, opacity: 0.85 });
    if (e.one_way) vis.setAttribute("marker-end", "url(#arrow)");
    g.append(hit, vis);
    const rec = { e, g, vis };
    g.addEventListener("click", (ev) => {
      if (ev.button !== 0) return;
      ev.stopPropagation();
      onEdgeClick(rec);
    });
    gEdges.appendChild(g);
    edgeEls.push(rec);
  }
  if (selectedEdge) {
    const rec = edgeEls.find((r) => edgeKey(r.e) === selectedEdge);
    if (rec) highlightEdge(rec, true); else selectedEdge = null;
  }
  applyBandVisibility();
}
function refreshIncidentEdges(id) {
  for (const rec of edgeEls) {
    if (rec.e.a === id || rec.e.b === id) {
      const d = edgePath(rec.e);
      rec.g.children[0].setAttribute("d", d);
      rec.g.children[1].setAttribute("d", d);
    }
  }
}

// ---- per-band visibility ----------------------------------------------------
function edgeBand(e) {
  const a = byId.get(e.a), b = byId.get(e.b);
  if (!a) return b ? b.band : "";
  if (!b) return a.band;
  return a.core_hops >= b.core_hops ? a.band : b.band;   // classed by outer endpoint
}
// A node hides with its band; an edge hides with its own band's edge-toggle OR when
// either endpoint's nodes are hidden (so no edge dangles into an empty band).
function applyBandVisibility() {
  let edgeNodes = null;
  if (highlightedEdgeKey !== null) {
    const found = edgeEls.find((r) => edgeKey(r.e) === highlightedEdgeKey);
    if (found) edgeNodes = [found.e.a, found.e.b];
  }

  for (const [id, rec] of nodeEls) {
    const isSelected = (id === highlightedNode) || 
                       (edgeNodes !== null && edgeNodes.includes(id)) ||
                       (highlightedNode !== null && currentEdges.some(e => (e.a === id && e.b === highlightedNode) || (e.b === id && e.a === highlightedNode)));
    rec.g.style.display = (nodeBandOn[byId.get(id).band] || isSelected) ? "" : "none";
  }

  for (const rec of edgeEls) {
    const a = byId.get(rec.e.a), b = byId.get(rec.e.b);
    const isIncident = (highlightedNode !== null && (rec.e.a === highlightedNode || rec.e.b === highlightedNode)) ||
                       (highlightedEdgeKey !== null && edgeKey(rec.e) === highlightedEdgeKey);
    const vis = (edgeBandOn[edgeBand(rec.e)] && nodeBandOn[a.band] && nodeBandOn[b.band]) || isIncident;
    rec.g.style.display = vis ? "" : "none";
  }
  // A disabled band hides its outlines too, over-riding the master outline toggles
  // (a still-enabled master group can't show an outline for a hidden band).
  for (const c of clusterEls) c.el.style.display = nodeBandOn[c.band] ? "" : "none";
  for (const bE of bandEls) bE.el.style.display = nodeBandOn[bE.band] ? "" : "none";
  if (coreEl) coreEl.style.display = nodeBandOn[coreBand] ? "" : "none";
}

// ---- draw: nodes ------------------------------------------------------------
const nodeEls = new Map();  // id -> { g, idText }
function captionTspans(s) {
  const out = [];
  for (const p of s.ports) {
    const sym = p.klass === "STARDOCK" ? PORT_SYMS.STARDOCK : PORT_SYMS.PORT;
    out.push(sym);
  }
  for (const pl of s.planets) out.push(pl.owner === "none" ? PLANET_SYMS.none : PLANET_SYMS.owned);
  for (const d of s.discoveries) { const sym = DISC_SYMS[d.kind]; if (sym) out.push(sym); }
  return out;
}
function idLabel(s) { return String(idMode === "internal" ? s.id : s.spatial_id); }
function drawNodes() {
  gNodes.textContent = "";
  nodeEls.clear();
  for (const s of sectors) {
    const p = nodePos.get(s.id);
    const g = el("g", { transform: `translate(${p.x},${p.y})`, style: "cursor:grab" });
    g.dataset.id = s.id;

    const hasDock = s.ports.some((x) => x.klass === "STARDOCK");
    const circle = el("circle", {
      r: NODE_R, fill: hasDock ? "#37300f" : "#141b24",
      stroke: s.is_core ? CORE_COLOR : bandColor(s.band),
      "stroke-width": s.is_core ? 2.2 : 1.4, opacity: 0.98,
    });
    g.appendChild(circle);

    const idText = el("text", { y: -3, "text-anchor": "middle", fill: "#e8eef5",
      "font-size": 11, "font-weight": 600, style: "pointer-events:none" });
    idText.textContent = idLabel(s);
    g.appendChild(idText);

    const caption = captionTspans(s);
    if (caption.length) {
      const cap = el("text", { y: 12, "text-anchor": "middle", "font-size": 11,
        style: "pointer-events:none" });
      for (const sym of caption) {
        const ts = el("tspan", { fill: sym.c });
        ts.textContent = sym.g;
        cap.appendChild(ts);
      }
      g.appendChild(cap);
    }

    // species badges arranged around the perimeter
    s.species.forEach((sp, i) => {
      const ang = -Math.PI / 2 + (i * 2 * Math.PI) / Math.max(s.species.length, 1);
      const rx = Math.cos(ang) * (NODE_R + 9), ry = Math.sin(ang) * (NODE_R + 9);
      const anchor = rx > 3 ? "start" : rx < -3 ? "end" : "middle";
      const label = el("text", { x: rx, y: ry, "text-anchor": anchor,
        "dominant-baseline": "middle", "font-size": 8.5, fill: SPECIES_SYM.c,
        style: "pointer-events:none" });
      label.textContent = `${SPECIES_SYM.g} ${sp.name}`;
      g.appendChild(label);
    });

    attachNodeInteraction(g, s);
    gNodes.appendChild(g);
    nodeEls.set(s.id, { g, idText, circle });
  }
  applyBandVisibility();
}

// ---- interaction: node drag / click -----------------------------------------
function attachNodeInteraction(g, s) {
  let downX = 0, downY = 0, moved = false, dragging = false;
  g.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0) return;
    ev.stopPropagation();
    downX = ev.clientX; downY = ev.clientY; moved = false; dragging = true;
    g.setPointerCapture(ev.pointerId);
    g.style.cursor = "grabbing";
  });
  g.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) + Math.abs(ev.clientY - downY) > 3) moved = true;
    if (!moved) return;
    const p = nodePos.get(s.id);
    p.x += (ev.movementX) / T.k;
    p.y += (ev.movementY) / T.k;
    g.setAttribute("transform", `translate(${p.x},${p.y})`);
    refreshIncidentEdges(s.id);
    drawClusters();
    drawCore();
    drawBands();
  });
  g.addEventListener("pointerup", (ev) => {
    if (ev.button !== 0) return;
    dragging = false; g.style.cursor = "grab";
    try { g.releasePointerCapture(ev.pointerId); } catch (_) {}
    if (!moved) onNodeClick(s);
  });
}
function attachOutlineInteraction(g, ids, isCore) {
  let downX = 0, downY = 0, moved = false, dragging = false;
  g.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0) return;
    ev.stopPropagation();
    downX = ev.clientX; downY = ev.clientY; moved = false; dragging = true;
    g.setPointerCapture(ev.pointerId);
    g.style.cursor = "grabbing";
    const vis = g.querySelector(".outline-vis");
    if (vis) vis.classList.add("dragging");
  });
  g.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) + Math.abs(ev.clientY - downY) > 3) moved = true;
    if (!moved) return;
    const dx = ev.movementX / T.k;
    const dy = ev.movementY / T.k;

    let tx = parseFloat(g.getAttribute("data-tx") || 0) + dx;
    let ty = parseFloat(g.getAttribute("data-ty") || 0) + dy;
    g.setAttribute("data-tx", tx);
    g.setAttribute("data-ty", ty);
    g.setAttribute("transform", `translate(${tx},${ty})`);

    if (isCore) {
      let btx = parseFloat(gBands.getAttribute("data-tx") || 0) + dx;
      let bty = parseFloat(gBands.getAttribute("data-ty") || 0) + dy;
      gBands.setAttribute("data-tx", btx);
      gBands.setAttribute("data-ty", bty);
      gBands.setAttribute("transform", `translate(${btx},${bty})`);
    }

    for (const id of ids) {
      const p = nodePos.get(id);
      if (p) {
        p.x += dx;
        p.y += dy;
        const nodeEl = nodeEls.get(id);
        if (nodeEl) nodeEl.g.setAttribute("transform", `translate(${p.x},${p.y})`);
      }
    }
    for (const id of ids) {
      refreshIncidentEdges(id);
    }
  });
  g.addEventListener("pointerup", (ev) => {
    if (ev.button !== 0) return;
    if (!dragging) return;
    dragging = false; g.style.cursor = "grab";
    try { g.releasePointerCapture(ev.pointerId); } catch (_) {}
    const vis = g.querySelector(".outline-vis");
    if (vis) vis.classList.remove("dragging");

    g.removeAttribute("transform");
    g.removeAttribute("data-tx");
    g.removeAttribute("data-ty");
    gBands.removeAttribute("transform");
    gBands.removeAttribute("data-tx");
    gBands.removeAttribute("data-ty");

    drawClusters();
    drawCore();
    drawBands();
  });
}
function onNodeClick(s) {
  if (editMode) {
    if (pendingNode === null) { pendingNode = s.id; markPending(); return; }
    if (pendingNode === s.id) { pendingNode = null; markPending(); return; }
    addEdge(pendingNode, s.id);
    pendingNode = null; markPending();
  } else {
    if (highlightedNode === s.id) {
      highlightedNode = null;
    } else {
      highlightedNode = s.id;
      highlightedEdgeKey = null;
    }
    applyIncidentHighlight();
  }
}
function markPending() {
  for (const [id, rec] of nodeEls) {
    rec.circle.setAttribute("stroke", id === pendingNode ? SELECT
      : (byId.get(id).is_core ? CORE_COLOR : bandColor(byId.get(id).band)));
    rec.circle.setAttribute("stroke-width", id === pendingNode ? 3.4
      : (byId.get(id).is_core ? 2.2 : 1.4));
  }
}
function applyIncidentHighlight() {
  let edgeNodes = null;
  if (highlightedEdgeKey !== null) {
    const found = edgeEls.find((r) => edgeKey(r.e) === highlightedEdgeKey);
    if (found) edgeNodes = [found.e.a, found.e.b];
  }

  for (const rec of edgeEls) {
    const isIncident = (highlightedNode !== null && (rec.e.a === highlightedNode || rec.e.b === highlightedNode)) ||
                       (highlightedEdgeKey !== null && edgeKey(rec.e) === highlightedEdgeKey);
    rec.vis.setAttribute("stroke", isIncident ? SELECT : (rec.e.one_way ? EDGE_ONE : EDGE_TWO));
    rec.vis.setAttribute("stroke-width", isIncident ? 3 : 1.6);
    rec.vis.setAttribute("opacity", isIncident ? 1 : 0.85);
  }
  for (const [id, rec] of nodeEls) {
    const isSelected = (id === highlightedNode) || (edgeNodes !== null && edgeNodes.includes(id));
    rec.circle.setAttribute("stroke", isSelected ? SELECT 
      : (byId.get(id).is_core ? CORE_COLOR : bandColor(byId.get(id).band)));
    rec.circle.setAttribute("stroke-width", isSelected ? 3.4 
      : (byId.get(id).is_core ? 2.2 : 1.4));
  }
  applyBandVisibility();
}

// ---- edge editing -----------------------------------------------------------
function findEdge(a, b) {
  return currentEdges.find((e) =>
    (e.a === a && e.b === b) || (e.a === b && e.b === a));
}
function addEdge(a, b) {
  const existing = findEdge(a, b);
  if (!existing) { currentEdges.push({ a, b, one_way: true }); drawEdges(); return; }
  if (existing.one_way && !(existing.a === a && existing.b === b)) {
    existing.one_way = false;  // reverse of a one-way -> now two-way
    drawEdges();
  }
  // same-direction one-way or already two-way: nothing to add
}
function onEdgeClick(rec) {
  if (editMode) {
    const key = edgeKey(rec.e);
    if (selectedEdge === key) {                       // second click -> remove
      currentEdges = currentEdges.filter((e) => edgeKey(e) !== key);
      selectedEdge = null;
      drawEdges();
      return;
    }
    if (selectedEdge) {                               // clear previous selection
      const prev = edgeEls.find((r) => edgeKey(r.e) === selectedEdge);
      if (prev) highlightEdge(prev, false);
    }
    selectedEdge = key;
    highlightEdge(rec, true);
  } else {
    const key = edgeKey(rec.e);
    if (highlightedEdgeKey === key) {
      highlightedEdgeKey = null;
    } else {
      highlightedEdgeKey = key;
      highlightedNode = null;
    }
    applyIncidentHighlight();
  }
}
function highlightEdge(rec, on) {
  rec.vis.setAttribute("stroke", on ? SELECT : (rec.e.one_way ? EDGE_ONE : EDGE_TWO));
  rec.vis.setAttribute("stroke-width", on ? 3 : 1.6);
  rec.vis.setAttribute("opacity", on ? 1 : 0.85);
}

// ---- save edits -------------------------------------------------------------
function saveEdits() {
  const baseKeys = new Set(baseEdges.map(edgeKey));
  const curKeys = new Set(currentEdges.map(edgeKey));
  const added = currentEdges.filter((e) => !baseKeys.has(edgeKey(e))).map((e) => [e.a, e.b]);
  const removed = baseEdges.filter((e) => !curKeys.has(edgeKey(e))).map((e) => [e.a, e.b]);
  const payload = {
    seed: meta.seed, topology_mode: meta.topology_mode, sector_count: meta.sector_count,
    base_edges: baseEdges.map((e) => [e.a, e.b, e.one_way]),
    current_edges: currentEdges.map((e) => [e.a, e.b, e.one_way]),
    added, removed,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `edits_${meta.topology_mode}_seed${meta.seed}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---- pan / zoom -------------------------------------------------------------
function initPanZoom() {
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const nk = Math.max(0.05, Math.min(8, T.k * Math.exp(-e.deltaY * 0.0015)));
    T.tx = mx - (mx - T.tx) * (nk / T.k);
    T.ty = my - (my - T.ty) * (nk / T.k);
    T.k = nk;
    applyTransform();
  }, { passive: false });

  let panning = false, px = 0, py = 0;
  // Nodes stop propagation on pointerdown, so this only fires on empty space,
  // outlines, and edges — all of which should pan when dragged.
  svg.addEventListener("pointerdown", (e) => {
    if (e.button === 1) e.preventDefault(); // Prevent autoscroll
    if (e.button !== 0 && e.button !== 1) return; // Only pan on left or middle click
    panning = true; px = e.clientX; py = e.clientY;
    svg.classList.add("grabbing");
  });
  window.addEventListener("pointermove", (e) => {
    if (!panning) return;
    T.tx += e.clientX - px; T.ty += e.clientY - py;
    px = e.clientX; py = e.clientY;
    applyTransform();
  });
  window.addEventListener("pointerup", () => { panning = false; svg.classList.remove("grabbing"); });
  svg.addEventListener("click", (ev) => {
    if (ev.target === svg && !editMode) {
      highlightedNode = null;
      highlightedEdgeKey = null;
      applyIncidentHighlight();
    }
  });
}

// ---- toggles / controls -----------------------------------------------------
function initControls() {
  document.getElementById("tg-id").addEventListener("change", (e) => {
    idMode = e.target.checked ? "internal" : "spatial";
    for (const [id, rec] of nodeEls) rec.idText.textContent = idLabel(byId.get(id));
  });
  const bind = (cbId, group) =>
    document.getElementById(cbId).addEventListener("change", (e) => {
      group.style.display = e.target.checked ? "" : "none";
    });
  bind("tg-core", gCore); bind("tg-cluster", gClusters); bind("tg-band", gBands);

  // per-band node/edge visibility toggles
  const bt = document.getElementById("band-toggles");
  bt.innerHTML = meta.bands.map((b) =>
    `<div class="band-row">` +
    `<input type="checkbox" class="bt-node" data-band="${b.name}" title="show ${b.name} nodes" checked>` +
    `<input type="checkbox" class="bt-edge" data-band="${b.name}" title="show ${b.name} edges" checked>` +
    `<span style="color:${bandColor(b.name)}">${b.name}</span></div>`).join("");
  bt.querySelectorAll(".bt-node").forEach((cb) => cb.addEventListener("change", () => {
    nodeBandOn[cb.dataset.band] = cb.checked; applyBandVisibility();
  }));
  bt.querySelectorAll(".bt-edge").forEach((cb) => cb.addEventListener("change", () => {
    edgeBandOn[cb.dataset.band] = cb.checked; applyBandVisibility();
  }));

  document.getElementById("tg-edit").addEventListener("change", (e) => {
    editMode = e.target.checked;
    document.getElementById("controls").classList.toggle("edit", editMode);
    if (!editMode) {
      pendingNode = null; markPending();
      if (selectedEdge) {
        const rec = edgeEls.find((r) => edgeKey(r.e) === selectedEdge);
        if (rec) highlightEdge(rec, false);
        selectedEdge = null;
      }
    } else {
      highlightedNode = null;
      highlightedEdgeKey = null;
      applyIncidentHighlight();
    }
    updateHint();
  });
  document.getElementById("btn-save").addEventListener("click", saveEdits);
  document.getElementById("btn-reset").addEventListener("click", () => {
    for (const [id, p] of basePos) { const n = nodePos.get(id); n.x = p.x; n.y = p.y; }
    drawNodes(); drawEdges();
    highlightedNode = null;
    highlightedEdgeKey = null;
    applyIncidentHighlight();
  });
  window.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    pendingNode = null; markPending();
    if (selectedEdge) {
      const rec = edgeEls.find((r) => edgeKey(r.e) === selectedEdge);
      if (rec) highlightEdge(rec, false);
      selectedEdge = null;
    }
    highlightedNode = null;
    highlightedEdgeKey = null;
    applyIncidentHighlight();
  });
  updateHint();
}
function updateHint() {
  document.getElementById("edit-hint").innerHTML = editMode
    ? "Click two nodes to add a directed warp. Click an edge, then click it again to delete. Esc clears."
    : "Drag nodes to declutter. Scroll to zoom, drag background to pan.";
}

// ---- legend -----------------------------------------------------------------
function legendRow(sym, text) {
  return `<div class="row"><span class="sym" style="color:${sym.c}">${sym.g}</span><span>${text}</span></div>`;
}
function buildLegend() {
  let h = "<h3>Ports</h3>";
  h += legendRow(PORT_SYMS.STARDOCK, PORT_SYMS.STARDOCK.t);
  h += legendRow(PORT_SYMS.PORT, PORT_SYMS.PORT.t);
  h += "<h3>Planets</h3>";
  h += legendRow(PLANET_SYMS.owned, PLANET_SYMS.owned.t);
  h += legendRow(PLANET_SYMS.none, PLANET_SYMS.none.t);
  h += "<h3>Discoveries</h3>";
  for (const k in DISC_SYMS) h += legendRow(DISC_SYMS[k], DISC_SYMS[k].t);
  h += "<h3>Species</h3>";
  h += legendRow(SPECIES_SYM, "Alien species (with name)");
  h += "<h3>Outlines</h3>";
  h += `<div class="row"><span class="swatch" style="border-top-style:dotted;border-color:${CORE_COLOR}"></span><span>Core Space (sectors 1&ndash;${meta.core_sector_count})</span></div>`;
  h += `<div class="row"><span class="swatch" style="border-top-style:dashed;border-color:${BAND_FALLBACK}"></span><span>Cluster (colour = its band)</span></div>`;
  h += `<div class="row"><span class="swatch" style="border-top-style:dotted;border-color:${BAND_FALLBACK}"></span><span>Band ring (dotted)</span></div>`;
  h += "<h3>Bands</h3>";
  for (const b of meta.bands) {
    h += `<div class="row"><span class="swatch ring" style="border-color:${bandColor(b.name)}"></span><span>${b.name}</span></div>`;
  }
  h += "<h3>Warps</h3>";
  h += `<div class="row"><span class="swatch" style="border-color:${EDGE_TWO}"></span><span>Two-way warp</span></div>`;
  h += `<div class="row"><span class="swatch" style="border-color:${EDGE_ONE}"></span><span>One-way warp (arrow)</span></div>`;
  document.getElementById("legend").innerHTML = h;
}

// ---- boot -------------------------------------------------------------------
function buildTitle() {
  document.getElementById("title-main").textContent =
    `${meta.topology_mode} topology · seed ${meta.seed}`;
  document.getElementById("title-sub").textContent =
    `${meta.sector_count} sectors · ${UNIVERSE.regions.length} clusters · ${currentEdges.length} warps`;
  document.title = `Big Bang — ${meta.topology_mode} · seed ${meta.seed}`;
}
function boot() {
  buildLayout();
  drawBands(); drawClusters(); drawCore(); drawEdges(); drawNodes();
  buildTitle(); buildLegend(); initPanZoom(); initControls();
  fitView();
  window.addEventListener("resize", applyTransform);
}
boot();
</script>
</body>
</html>
