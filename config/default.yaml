# Edge of the Unknown — default game configuration.
#
# Tunable constants for the economy (DESIGN §8), universe generation (§5), and
# the starter ship (§4). Validated against edge.core.config.GameConfig. Every
# game constant lives here, not in code (CLAUDE.md). Omitted fields fall back to
# the schema defaults; the values below are spelled out so the balance is legible.

config_version: 3  # Phase-3 schema epoch (expansive topology default, band-graded aliens)
seed: 4             # universe seed for a new game; leave empty (seed:) for a random seed
turns_per_day: 250  # TWINSTR.DOC default (§9)

# Engine tick loop (§9). tick_seconds is the real-time interval between ticks.
# Each cron cadence is in ticks; with tick_seconds=1.0, ticks = real seconds.
ticker:
  tick_seconds: 1.0                    # 1 tick per real second
  crons:
    daily_turn_reset: 1200             # every 20 minutes
    interest_accrual: 1200             # every 20 minutes
    port_economy: 1200                 # every 20 minutes
    planet_growth: 1200                # every 20 minutes
    alien_drift: 120                   # every 2 minutes (per-species move chance applies)

# SectorView sprite scene — sizes/counts only, no rules impact (presentation).
# Sprites are sized to the space available, clamped to [min, max] per axis.
scene:
  planet: { min_height: 4, max_height: 14 }        # SectorView orbit-row planet (width = 2*height)
  planet_detail: { min_height: 4, max_height: 16 } # PlanetScreen orbit view planet (independent of above)
  port:   { min_width: 6, min_height: 4, max_width: 18, max_height: 8 }
  ship:   { min_width: 6, min_height: 3, max_width: 16, max_height: 6 }
  max_ships_shown: 2           # sprites shown; extra ships fall to a clickable list
  ship_face_inward_chance: 0.5 # chance the 2nd of two ships is flipped to face the 1st

# TUI presentation — the sector-screen warp grid + status sidebar (no rules impact).
ui:
  warp_columns: 3            # warp-grid width; cells fill the printable area, wrap into rows
  warp_focus_default: first  # default keyboard focus: first | backtrack | unexplored
  sidebar_width: 33          # status sidebar fixed character width (content is fixed-width)
  sidebar_min_screen_width: 90  # hide the sidebar when the terminal is narrower than this
  surface_terrain_height: 15 # SurfaceScreen terrain-panel height (rows, incl. border)
  local_map_radius: 3        # Computer/Map ego-graph reach in warp hops from your sector
  portrait_dir: images/species       # species portrait dir (abs, or repo-root-relative); supports <id>_<n> variants
  portrait_symbols: vhalf+quad+geometric  # chafa --symbols selector for alien contact portraits
  portrait_font_ratio: 0.4   # terminal cell width/height; lower to widen a horizontally-squashed portrait

# The species roster lives in its own file (§6) so a game can be generated against a
# different source roster. The alien dialogue corpus (§6.7) lives in a third file so a
# roster and its voice corpus can vary independently. Both are resolved relative to this
# file; the roster is injected as `roster`, and the dialogue is merged onto it.
#
# `dialogue_file` may be a single path or a list applied in order: the base file supplies
# `personas` / `recency_k` / shared `grammar`, and any later file may add a `species_grammars`
# block (an authoring-pipeline sidecar) that layers per-species grammar overrides on top —
# e.g. to A/B a machine-authored corpus, point it at a generated sidecar:
#   dialogue_file:
#     - alien_dialogue_default.yaml
#     - dialogue/alien_dialogue.ollama_gemma4.yaml
roster_file: alien_roster_default.yaml
dialogue_file: 
    - alien_dialogue_default.yaml
    - dialogue/alien_dialogue_species.yaml
names_file: names_default.yaml

economy:
  starting_latinum: 2000
  starting_bank: 0

  # Price clamp: [floor_frac*base, ceiling_frac*base], always > 0 (§8 invariant).
  floor_frac: 0.25
  ceiling_frac: 2.0

  # BNT's tuned values relabeled to the TW trio (§8).
  fuel_ore:  { base: 11, delta: 5, elasticity: 1.0 }
  organics:  { base: 5,  delta: 2, elasticity: 1.0 }
  equipment: { base: 15, delta: 7, elasticity: 1.0 }

  # The component sink: StarDock hardware prices by tier (§8). Tier III is
  # barter-only (alien trade / salvage), so it has no latinum price.
  tier_i_component_latinum: 2000
  tier_ii_component_latinum: 8000
  repair_kit_latinum: 200
  ship_trade_in_frac: 0.5   # credit toward a new hull when trading the old one in
  repair_cost_frac: 0.25    # StarDock battle-damage repair, per tier price (Phase 3)
  colonist_incentive: 5     # per-head latinum to enlist a colonist (recruited, not bought)

  # Banking + stock regeneration (engine cron applies; the math is pure).
  bank_interest_per_day: 0.005
  regen_fraction: 0.05
  desired_stock_frac_standard: 0.50
  desired_stock_frac_stardock: 0.90

  # Haggling mini-game (§8). quick-trade mode skips it entirely.
  haggling:
    insult_frac: 0.30
    max_rejections: 2
    history_penalty: 0.08

# Alien disposition bands (§6): effective disposition (base + the player's attitude
# offset, clamped 0–1) is hostile below `hostility`, friendly at/above `amity`, neutral
# between. Placement is band-graded (§5/§6): the Hub is peaceable, hostiles rise outward.
aliens:
  hostility_threshold: 0.35
  amity_threshold: 0.65
  escape_floor: 0.10   # player escape chance never drops below this (§10, Phase 3)
  # Per-band downward bias on placed dispositions (Hub stays friendly; each band keeps a
  # friendly resupply anchor). Mean stance falls outward → danger rises (§5/§6).
  band_disposition_bias: { Hub: 0.0, Frontier: -0.1, Deep: -0.2, Void: -0.3 }
  disposition_gradient_tolerance: 0.1
  # Consequences of conduct (§6.5, WP27): killing a species' ships sours its attitude
  # (by the species' own attitude_loss_rate) and deepens a grudge against the player;
  # never_forgets / permanent-betrayal species record it forever and lock the offset.
  grudge_severity_per_kill: 0.08
  grudge_duration_days: 30
  # Alignment per kill by the victim's disposition band, and experience scaling.
  alignment_kill_friendly: -3
  alignment_kill_neutral: -1
  alignment_kill_hostile: 1
  experience_kill_scale: 10.0
  experience_per_discovery: 5
  criminal_alignment: -10   # below this the governor's Core patrols take notice (WP38 enforces)

# Encounter rolls (§10, Phase 3 — read by the WP24 encounter system). Per-band chance an
# encounter fires (0 in the safe Hub, rising outward); when it does, a species is drawn
# with weight inverse to threat (weak raiders common, apex predators rare).
encounters:
  interrupt_chance: { Hub: 0.0, Frontier: 0.12, Deep: 0.22, Void: 0.32 }
  weight_inverse_threat: true
  weight_floor: 0.05
  detection_base: 0.7        # species sensors vs cloak + nebula; undetected slips away
  detection_sensor_coeff: 0.05
  detection_cloak_coeff: 0.08
  nebula_cover: 0.25

# Combat rounds (§10, WP25). Flee is clamped to [aliens.escape_floor, flee_cap] — the
# §13 floor invariant. ahead/spinal attackers are evadable (combat-speed contest);
# all_round leaves no safe angle; missiles ignore arc.
combat:
  flee_base: 0.35
  flee_speed_coeff: 0.05
  interception_coeff: 0.5
  cloak_coeff: 0.03
  damage_penalty: 0.25
  flee_cap: 0.95
  evade_base: 0.35
  evade_speed_coeff: 0.06
  evade_cap: 0.9
  threat_damage_scale: 3.0
  missile_damage: 30
  missile_price: 300
  swarm_size_min: 3
  swarm_size_max: 5
  # Localized damage (§4.1, WP26): a hull-reaching volley may knock out one
  # component, weighted toward exposed/forward subsystems.
  knockout_chance: 0.35
  knockout_weights: { main_gun: 3.0, thrusters: 3.0, screens: 2.0, spindrive: 1.0 }
  # Ship destruction (§10): hull 0 drops the player to this hull (price 0 — never sold).
  escape_pod_class: escape_pod
  # Salvage (§10, BNT 10–20%): per wreck, hull_max × salvage_hull_value × U[min,max]
  # latinum, plus an occasional loose Tier-I component (needs a free hold).
  salvage_frac_min: 0.10
  salvage_frac_max: 0.20
  salvage_hull_value: 3.0
  salvage_component_chance: 0.25

# Weapon catalog (§4): {damage, firing_arc, rate, special}. Referenced by ship-class
# `armament` lists; arcs drive the §10 evasion counter-play.
weapons:
  light_blaster:   { name: Light Blaster,    damage: 8,  firing_arc: all_round }
  spinal_railgun:  { name: Spinal Railgun,   damage: 22, firing_arc: spinal, rate: periodic }
  nose_cannon:     { name: Nose Cannon,      damage: 12, firing_arc: ahead }
  turret_array:    { name: Turret Array,     damage: 14, firing_arc: all_round }
  heavy_lance:     { name: Heavy Lance,      damage: 26, firing_arc: ahead, rate: periodic }

bigbang:
  sector_count: 1000
  topology_mode: expansive    # graph shape: trunk (chokepoints) | expansive (band-lattice), §5
  cluster_min: 5
  cluster_max: 25
  intra_group_degree: 2.5
  bridges_min: 1
  bridges_max: 5
  one_way_chance: 0.15
  max_warps_per_sector: 6
  core_sector_count: 10
  home_cluster_min: 3        # alliance home cluster size range (< Core), §5 step 6
  home_cluster_max: 6
  start_sector: stardock     # where the player starts: stardock | random | a sector number
  stardock_min_hops: 2
  stardock_max_hops: 5
  port_density: 0.45
  planet_density: 0.25
  port_class_distribution: [20, 20, 20, 10, 10, 10, 5, 5]
  initial_stock_min: 200
  initial_stock_max: 2000
  bands:
    - { name: Hub,      min_hops: 0,  max_hops: 5 }
    - { name: Frontier, min_hops: 6,  max_hops: 12 }
    - { name: Deep,     min_hops: 13, max_hops: 20 }
    - { name: Void,     min_hops: 21, max_hops: 9999 }
  # expansive-mode thresholds: same names, deeper hop windows (ring roads lengthen
  # paths). Used only when topology_mode == expansive (§5 step 5).
  bands_expansive:
    - { name: Hub,      min_hops: 0,  max_hops: 14 }
    - { name: Frontier, min_hops: 15, max_hops: 35 }
    - { name: Deep,     min_hops: 36, max_hops: 58 }
    - { name: Void,     min_hops: 59, max_hops: 9999 }

# Engine room (§4.1): the game-global formulas turning a hull's slotted parts into
# derived aspects. Per-subsystem layouts live on each ship class below. The
# coefficients are tuned so the starter Trailblazer's "every base slot filled, all
# upgrade slots empty" layout derives exactly the Phase-1 flat numbers (shields 100,
# warp 3, combat 4) — a regression pin (PHASE2_PLAN WP1).
#
#   aspect = base + per_component*active + per_tier*tier_bonus
#   (active = filled, non-knocked-out slots; tier_bonus = sum of (tier-1) over them)
engine_room:
  aspects:
    spindrive: { base: 0, per_component: 1,  per_tier: 1 }   # -> warp speed
    thrusters: { base: 0, per_component: 2,  per_tier: 1 }   # -> combat speed
    screens:   { base: 0, per_component: 50, per_tier: 25 }  # -> shields
    main_gun:  { base: 2, per_component: 8,  per_tier: 6 }   # -> gun damage
  efficiency: { base: -1, per_component: 1, per_tier: 1 }    # spindrive -> global combat bonus
  warp_turn_divisor: 3      # turns_per_warp = max(1, round(divisor / warp_speed))
  gun_rate_base: 1
  gun_rate_step: 2          # +1 rate of fire per 2 parts in the main gun
  tier_ceiling: III

# Typed planets (§4.2): per-type production shaping + BNT colonist constants +
# band-weighted ownership. yield_profile multiplies per-commodity colonist output;
# habitability caps colonist population (0 = uncolonizable, extraction-only).
planets:
  production_rate: 0.005     # output per (capped) colonist per tick (§A.3)
  food_per_colonist: 0.05    # organics eaten per colonist per tick
  growth_rate: 0.02          # colonist reproduction when fed
  starvation_rate: 0.05      # colonist die-off when food runs out
  jovian_scoop: 50           # fuel ore per tick, fuel-scooped (no colonists)
  asteroid_mining: 50        # equipment per tick, mined (no colonists)
  types:
    terrestrial_warm:  { colonizable: true,  habitability: 100000, yield_profile: { fuel_ore: 0.3, organics: 1.5, equipment: 0.5 } }
    terrestrial_cool:  { colonizable: true,  habitability: 120000, yield_profile: { fuel_ore: 0.3, organics: 1.3, equipment: 0.5 } }
    terrestrial_hot:   { colonizable: true,  habitability: 20000,  yield_profile: { fuel_ore: 1.5, organics: 0.2, equipment: 0.4 } }
    terrestrial_cold:  { colonizable: true,  habitability: 20000,  yield_profile: { fuel_ore: 0.4, organics: 0.2, equipment: 1.5 } }
    jovian:            { colonizable: false, habitability: 0,      yield_profile: { fuel_ore: 1.0, organics: 0.0, equipment: 0.0 } }
    asteroid_belt:     { colonizable: false, habitability: 0,      yield_profile: { fuel_ore: 0.2, organics: 0.0, equipment: 1.0 } }
    barren:            { colonizable: false, habitability: 0,      yield_profile: {} }
  # Band-weighted owner roll (non-Core): alliance-owned vs unowned. The unowned
  # fraction is non-decreasing Hub→Frontier→Deep→Void (§4.2 invariant). Core worlds
  # are always governor-owned regardless of this table.
  ownership:
    Hub:      { alliance: 8, none: 2 }
    Frontier: { alliance: 5, none: 5 }
    Deep:     { alliance: 3, none: 7 }
    Void:     { alliance: 1, none: 9 }

# Orbital starbases (§4.2, WP4): the engine-room model minus thrusters/spindrive,
# plus a fusion_reactor (whose keystone `converter` powers the base). Owned worlds
# can carry an intact base that defends the system (Phase 3); an unowned, uninhabited
# world can carry a derelict — built then stripped of its reactor keystone, so the
# remaining parts are a salvage cache the player can cannibalize.
starbase:
  ship_class_id: orbital_platform
  owned_base_chance: 0.5      # an owned planet carries an intact defensive base
  derelict_chance: 0.4        # an unowned, uninhabited planet carries a derelict
  subsystems:
    fusion_reactor:
      slot_count: 4
      keystone: converter
      base_components: [converter, radiator, accelerator]
      legal_components: [converter, radiator, accelerator, secondary]
    screens:
      slot_count: 3
      keystone: secondary
      base_components: [secondary, accelerator]
      legal_components: [secondary, accelerator, converter, radiator]
    main_gun:
      slot_count: 3
      keystone: accelerator
      base_components: [accelerator, linkage]
      legal_components: [accelerator, linkage, converter, secondary]

# Discoveries (§7, WP5): the universe is salted at big bang with finds whose rarity
# (and value) rises with distance band. Hidden finds (wrecks/entities) need a sensor
# check on entry; nebulae interfere with that check. Rare+ finds yield artifact
# barter-goods (mapped to a component tier, §8); lesser finds give latinum/components.
discovery:
  sector_density: 0.20        # fraction of sectors holding an open-space find
  surface_site_chance: 0.5    # fraction of planets seeded with surface sites (WP6 reveals)
  surface_sites_max: 3        # up to this many sites on a seeded planet (WP6)
  # band -> rarity weights. Strongly separated so the mean-rarity gradient is monotone
  # Hub -> Frontier -> Deep -> Void (the §5 step-8 validator asserts strictly rising).
  band_rarity_weights:
    Hub:      { COMMON: 80, UNCOMMON: 20 }
    Frontier: { COMMON: 25, UNCOMMON: 50, RARE: 25 }
    Deep:     { UNCOMMON: 20, RARE: 45, EXCEPTIONAL: 35 }
    Void:     { RARE: 15, EXCEPTIONAL: 45, LEGENDARY: 40 }
  tier_value:  { COMMON: 250, UNCOMMON: 1000, RARE: 4000, EXCEPTIONAL: 12000, LEGENDARY: 30000 }
  # Artifact payloads barter at a component tier (§8: Rare ≈ II, Exceptional ≈ III).
  barter_equivalence: { RARE: II, EXCEPTIONAL: III, LEGENDARY: III }
  # Min effective sensor rating to detect a hidden find of each tier (rarer = harder).
  sensor_difficulty: { COMMON: 1, UNCOMMON: 2, RARE: 3, EXCEPTIONAL: 4, LEGENDARY: 5 }
  nebula_interference: 2      # sensor rating subtracted while inside a nebula sector
  space_kinds:   { wreck: 5, entity: 3, nebula: 2, black_hole: 1 }
  surface_kinds: { ruins: 4, artifact: 3, ancient_tech: 2, crashed_ship: 3 }
  hidden_kinds: [wreck, entity]   # phenomena are obvious; drifting finds need sensors
  # Kinds barred from sharing a sector with a port (seam; empty ⇒ all may coexist).
  # Wormholes aren't listed here — they're force-placed on one-way edges, not rolled.
  port_incompatible_kinds: []
  component_pool: [accelerator, converter, radiator, secondary, turbine, burner, linkage, navigator]
  salvage_turn_cost: 2
  scan_turn_cost: 1
  descent_turn_cost: 3            # turns to land on a planet surface (WP6)
  explore_turn_cost: 1            # turns to reveal one surface site (WP6)
  surface_hidden_min_rank: 3      # Rare+ surface sites need a sensor sweep to reveal
  black_hole_gravity_warp: false  # Phase-3 hazard seam; inert in Phase 2
  black_hole_warp_turn_cost: 5

# Genesis torpedoes (§4.2, WP10): a StarDock device that terraforms a dead, unowned
# world (barren / asteroid belt / gas giant) into a colonizable terrestrial, ready to
# claim. A latinum sink at the high end of the economy.
genesis:
  device_id: genesis_torpedo
  price: 15000
  result_type: terrestrial_warm
  eligible_types: [barren, asteroid_belt, jovian, terrestrial_hot, terrestrial_cold]

# The starter hull — a Trailblazer-class explorer (§4). Its engine room is built
# "complete but minimal": every base slot filled at Tier I, every upgrade slot
# empty — the canonical first upgrade target (§4.1). The flat aspect scalars below
# are the NPC-fallback / cap values; the live aspects are derived from the slots.
starter_ship:
  id: trailblazer
  name: S.S. Wayfarer
  role: transport
  holds_total: 60
  turns_per_warp: 1
  shields_max: 100
  warp_speed: 3
  combat_speed: 4
  cloak_rating: 0
  sensor_rating: 2
  hull_max: 100
  colonist_capacity: 100
  subsystems:
    spindrive:
      slot_count: 5
      keystone: navigator
      base_components: [navigator, turbine, accelerator]
      legal_components: [navigator, turbine, accelerator, converter, radiator]
    thrusters:
      slot_count: 4
      keystone: burner
      base_components: [burner, burner]
      legal_components: [burner, turbine, accelerator, radiator]
    screens:
      slot_count: 4
      keystone: secondary
      base_components: [secondary, accelerator]
      legal_components: [secondary, accelerator, converter, radiator]
    main_gun:
      slot_count: 5
      keystone: accelerator
      base_components: [accelerator, linkage]
      legal_components: [accelerator, linkage, converter, secondary]

# StarDock hardware emporium (§5, §8): which component kinds are stocked and at
# which tiers. Prices come from the economy block; Tier III is barter-only and is
# deliberately absent here.
hardware:
  components: [accelerator, converter, radiator, secondary, turbine, burner, linkage, navigator]
  tiers: [I, II]

# Buyable hulls beyond the free starter (§4 v1 set; price band ~20k–150k rising
# with role, DESIGN §8). Each is an engine-room hull (the player ship is always
# slotted): bigger roles get more slots (upgrade headroom) and richer base loadouts.
# The flat aspect scalars are caps/fallbacks; live aspects derive from the slots.
ship_classes:
  - id: scout_marauder
    name: Scout Marauder
    role: fighter
    holds_total: 30
    turns_per_warp: 1
    shields_max: 120
    warp_speed: 4
    combat_speed: 6
    cloak_rating: 1
    sensor_rating: 3
    hull_max: 80
    colonist_capacity: 50
    price: 20000
    armament: [nose_cannon]           # fast hull, forward gun — strafe it (§10)
    defenses: [{ type: speed_and_size, value: 2 }]
    missiles: 2
    subsystems:
      spindrive:
        slot_count: 6
        keystone: navigator
        base_components: [navigator, turbine, accelerator, accelerator]
        legal_components: [navigator, turbine, accelerator, converter, radiator]
      thrusters:
        slot_count: 6
        keystone: burner
        base_components: [burner, burner, burner]
        legal_components: [burner, turbine, accelerator, radiator]
      screens:
        slot_count: 3
        keystone: secondary
        base_components: [secondary]
        legal_components: [secondary, accelerator, converter, radiator]
      main_gun:
        slot_count: 5
        keystone: accelerator
        base_components: [accelerator, linkage]
        legal_components: [accelerator, linkage, converter, secondary]
  - id: missile_frigate
    name: Missile Frigate
    role: warship
    holds_total: 50
    turns_per_warp: 1
    shields_max: 200
    warp_speed: 3
    combat_speed: 4
    cloak_rating: 0
    sensor_rating: 2
    hull_max: 140
    colonist_capacity: 150
    price: 50000
    armament: [turret_array]
    defenses: [{ type: armour, value: 3 }]
    missiles: 6
    subsystems:
      spindrive:
        slot_count: 5
        keystone: navigator
        base_components: [navigator, turbine, accelerator]
        legal_components: [navigator, turbine, accelerator, converter, radiator]
      thrusters:
        slot_count: 5
        keystone: burner
        base_components: [burner, burner]
        legal_components: [burner, turbine, accelerator, radiator]
      screens:
        slot_count: 5
        keystone: secondary
        base_components: [secondary, accelerator, accelerator]
        legal_components: [secondary, accelerator, converter, radiator]
      main_gun:
        slot_count: 6
        keystone: accelerator
        base_components: [accelerator, linkage, linkage]
        legal_components: [accelerator, linkage, converter, secondary]
  - id: battleship
    name: BattleShip
    role: capital_warship
    holds_total: 80
    turns_per_warp: 1
    shields_max: 300
    warp_speed: 3
    combat_speed: 4
    cloak_rating: 0
    sensor_rating: 2
    hull_max: 250
    colonist_capacity: 300
    price: 100000
    armament: [heavy_lance, light_blaster]
    defenses: [{ type: armour, value: 5 }, { type: energy_plates, value: 3 }]
    missiles: 4
    subsystems:
      spindrive:
        slot_count: 6
        keystone: navigator
        base_components: [navigator, turbine, accelerator]
        legal_components: [navigator, turbine, accelerator, converter, radiator]
      thrusters:
        slot_count: 6
        keystone: burner
        base_components: [burner, burner]
        legal_components: [burner, turbine, accelerator, radiator]
      screens:
        slot_count: 6
        keystone: secondary
        base_components: [secondary, accelerator, accelerator, accelerator]
        legal_components: [secondary, accelerator, converter, radiator]
      main_gun:
        slot_count: 7
        keystone: accelerator
        base_components: [accelerator, linkage, accelerator]
        legal_components: [accelerator, linkage, converter, secondary]
  - id: imperial_starship
    name: Imperial StarShip
    role: capital_warship
    holds_total: 120
    turns_per_warp: 1
    shields_max: 400
    warp_speed: 4
    combat_speed: 6
    cloak_rating: 0
    sensor_rating: 3
    hull_max: 350
    colonist_capacity: 500
    price: 150000
    armament: [spinal_railgun, turret_array]
    defenses: [{ type: screens, value: 4 }, { type: armour, value: 4 }]
    missiles: 8
    subsystems:
      spindrive:
        slot_count: 7
        keystone: navigator
        base_components: [navigator, turbine, accelerator, accelerator]
        legal_components: [navigator, turbine, accelerator, converter, radiator]
      thrusters:
        slot_count: 6
        keystone: burner
        base_components: [burner, burner, burner]
        legal_components: [burner, turbine, accelerator, radiator]
      screens:
        slot_count: 7
        keystone: secondary
        base_components: [secondary, accelerator, accelerator, accelerator, accelerator]
        legal_components: [secondary, accelerator, converter, radiator]
      main_gun:
        slot_count: 8
        keystone: accelerator
        base_components: [accelerator, linkage, accelerator, linkage]
        legal_components: [accelerator, linkage, converter, secondary]
  # The escape pod (§10, WP26): issued when the player's hull reaches 0 — ship,
  # cargo, and stores are lost; the pod limps home. price 0 ⇒ never sold, and the
  # shipyard listing skips unpriced hulls. Minimal single-slot engine room so the
  # player screens keep working; a vestigial gun and 1-warp drive — it limps.
  - id: escape_pod
    name: Escape Pod
    role: transport
    holds_total: 2
    turns_per_warp: 2
    shields_max: 10
    warp_speed: 1
    combat_speed: 1
    cloak_rating: 0
    sensor_rating: 1
    hull_max: 20
    colonist_capacity: 0
    price: 0
    subsystems:
      spindrive:
        slot_count: 1
        keystone: navigator
