# Edge of the Unknown — default game configuration.
#
# Tunable constants for the economy (DESIGN §8), universe generation (§5), and
# the starter ship (§4). Validated against edge.core.config.GameConfig. Every
# game constant lives here, not in code (CLAUDE.md). Omitted fields fall back to
# the schema defaults; the values below are spelled out so the balance is legible.

config_version: 15  # GW-WP19: one shared survey/assault world ground layout
seed: 4             # universe seed for a new game; leave empty (seed:) for a random seed
turns_per_day: 250  # TWINSTR.DOC default (§9)

# Engine tick loop (§9). tick_seconds is the real-time interval between ticks.
# Each cron cadence is in ticks; with tick_seconds=1.0, ticks = real seconds.
ticker:
  tick_seconds: 1.0                    # 1 tick per real second
  crons:
    daily_turn_reset: 1200             # every 20 minutes
    interest_accrual: 1200             # every 20 minutes
    port_economy: 1200                 # every 20 minutes
    planet_growth: 1200                # every 20 minutes
    market_settlement: 1200            # daily order-book settlement (§8, WP47)
    governance_tick: 1200              # daily NPC seizures/intrigue (§6.3, WP51)
    alien_drift: 120                   # every 2 minutes (per-species move chance applies)
    trader_step: 120                   # every 2 minutes (NPC merchant trades, WP43)

# SectorView sprite scene — sizes/counts only, no rules impact (presentation).
# Sprites are sized to the space available, clamped to [min, max] per axis.
scene:
  # 40 is derived, not taste: every other kind scales off the *rendered* primary
  # height, so this is the one number that decides where the whole hierarchy stops
  # growing. At 40 each kind's scale lands exactly on the top rung of its art
  # ladder (port 0.3*40 = 12, starbase 0.35*40 = 14, ship 0.2*40 -> 7); at the old
  # 26 the chain froze around terminal height 40 with every rung but stardock's
  # still unreachable, so a 100-row console drew the same sprites as a 40-row one.
  planet: { min_height: 4, max_height: 40 }        # SectorView primary body (width = 2*height)
  planet_detail: { min_height: 4, max_height: 16 } # PlanetScreen orbit view planet (independent of above)
  # Station max_height must stay >= round(scale * planet.max_height); a lower cap
  # saturates while the planet is still growing, pinning the station at one size
  # across most viewports. The caps must also clear a whole *tier* of the sprite
  # art (edge/art/sprites.py `fit_box`) or the art steps down a rung: a port
  # capped at 6 rows selects trading_port's 7-wide mast rung instead of its
  # 11x7 silhouette, and a ship capped at 16 columns clears no rung at all
  # (the narrowest is 17x3, then ~34x5).
  # These caps are sized to the *top* rung of each ladder (vertical for stations,
  # horizontal for ships): trading_port 11x12, starbase 11x14, stardock 15x15,
  # warship 46x7. Widths follow the 2.4 aspect in `station_dimensions`; ship width
  # is the open sky instead, so its cap must reach the widest rung directly.
  # Those rungs are the ceiling — the art has nothing richer, so making a port
  # bigger than 11x12 needs new tiers authored upstream in sprite-art-designer,
  # not a config change here (docs/SPRITE_ART_SYNC.md).
  # Stardock is the one kind whose cap sits *below* round(scale * planet)
  # (0.6 * 40 = 24), deliberately: its ladder stops at 15x15, so 16 already clears
  # the richest art there is and the non-saturation rule has nothing left to
  # protect. The cap is not inert — a direct-open docked screen falls back to it
  # and StationArtRow sizes the row from the box — so raising it to 24 would only
  # pad the docked header to 24 rows around 15 rows of art.
  port:     { min_width: 6, min_height: 4, max_width: 28, max_height: 12 }
  stardock: { min_width: 8, min_height: 4, max_width: 38, max_height: 16 }
  starbase: { min_width: 6, min_height: 4, max_width: 33, max_height: 14 }
  ship:   { min_width: 6, min_height: 3, max_width: 46, max_height: 7 }
  max_ships_shown: 3           # sprites shown; extra ships fall to a clickable list
  ship_face_inward_chance: 0.5 # chance the 2nd of two ships is flipped to face the 1st
  # Arrival-view scale hierarchy: the primary body (planet > space find > station)
  # takes most of the free height; everything else is sized relative to it.
  # A rendered primary supplies the live reference height. Docked headers reuse those
  # exact Sector-view sizing inputs rather than scaling against their banner.
  # Kept modest: an ordinary port is a structure, not a rival body. The floor is
  # set by the art, not taste — below ~0.27 the scaled box never clears 7 rows, and
  # trading_port's 6-row rung is a bare 7-wide mast rather than its 11-wide
  # silhouette. 0.3 reaches the silhouette at the larger primaries and still sits
  # under the 0.35 that playtest flagged as rivalling the planet.
  port_scale: 0.3
  stardock_scale: 0.6
  starbase_scale: 0.35         # playtest 2026-07-17: at 0.5 a starbase (12 inked rows) rivalled the planet
  ship_scale: 0.2              # below port_scale so traffic never outsizes the port it visits

  # WP-SC05: the reviewer-approved `edge.scene` physical-model calibration
  # (docs/SCENE_CALIBRATION_REVIEW.md §1-2, approved as-is). Unrelated to
  # every key above (those still feed the *legacy* `_SceneComposer`); this
  # block is read only by `edge.art.scene_tuning.build_scene_tuning` /
  # `build_continuous_yields`, which turn it into a real
  # `edge.scene.model.SceneTuning` for `edge/scene/solve.py`. Not yet wired
  # into the running TUI (that is WP-SC08/SC09/SC10/SC11's job) — this is
  # only "approved numbers are loadable, validated config" (plan §5).
  # Fraction-valued fields are written as exact "num/den" strings so they
  # load as `fractions.Fraction`, never a lossy float.
  physical_model:
    # Nominal face areas per PhysicalObject.scale_class, display scene units
    # (not literal km): preserves entity > anchor > belt > orbital > wreck >
    # ship as bounding-box area (plan §2.2, §9.1). "anchor" is the fallback
    # bucket a bare planet uses; face_extent_by_kind below overrides it for
    # nebula/black_hole/wormhole so those phenomena read distinctly larger.
    face_extent_by_scale_class:
      entity:   [34, 14]  # area 476 — the foreground subject; largest of all
      anchor:   [60, 30]  # area 1800 — shared planet/discovery bucket
      belt:     [90, 16]  # area 1440 — wide flat permeable field
      # Stardock is its own scale class, not a bigger number inside the
      # shared station bucket: plan §2.2 orders Stardock > starbase > port,
      # and AGENTS.md makes it Core Space's flagship location. Shipping it at
      # the "orbital" 14x7 was why every admitted Stardock in the gallery
      # matrix rendered at rung 2 of 4 (a 9x6 can) and never at its authored
      # 15x15 tier — with cell_aspect 2 a 14x7 face can only project a
      # 14-cell-high box at scale 1, and no camera a real scene produces gets
      # a parent-orbiting station near enough to beat that.
      # 10x20 is the su box whose projection is 15x15 cells at scale 1 with a
      # cell to spare (aspect 1:2 mirrors the authored rung's square cell
      # shape once cell_aspect is applied), and it is the smallest extent
      # measured at which *both* strategies reach rung 0 everywhere they
      # admit a Stardock at all (8x16 and 9x18 both fall short under
      # depth_layered; 12x24 buys nothing further). Area 200 keeps
      # anchor 1800 > entity 476 > stardock 200 > orbital 98 > wreck 96 >
      # ship 60, so §4.4's ordering holds and a Stardock still never
      # out-frames a planet.
      # Every station face is now sized off its own ladder (WP-SC12): the su
      # height is its richest authored rung's natural height, and the su width
      # gives that rung's cell aspect room once cell_aspect 2 is applied.
      #
      # Height first, because it is a hard ceiling under
      # `DepthLayeredAnchorProjection`: that strategy's scale is
      # `depth_layer_scale ** layer` with `0 < depth_layer_scale < 1`, so scale
      # never exceeds 1 and a station can never project taller than its own su
      # face height at any viewport or budget. At the previous 7 su an ordinary
      # port could reach 7 cells against a rung 0 that needs 12, so that
      # strategy drew every port and starbase a tier below the legacy composer
      # no matter what the solver did. Setting the face to the rung it must be
      # able to reach removes the ceiling instead of working around it, and
      # costs `FixedFovPerspective` nothing — there the target-height depth
      # search picks whatever depth yields the target size, so a larger face
      # only means a slightly farther one.
      #
      # Widths keep the legacy composer's own 2.4:1 station aspect
      # (`station_dimensions`' `int(height * 2.4)`) to within a tenth once
      # cell_aspect 2 is applied: 2*14/12 = 2.33, 2*17/14 = 2.43.
      #
      # Areas keep §4.4's ordering and now state §2.2's Stardock > starbase >
      # port for the first time: anchor 1800 > entity 476 > stardock 352 >
      # starbase 238 > port 168 > wreck 96 > ship 60.
      stardock: [22, 16]  # area 352 — the headline station (rung 0 is 15x15)
      # Split off the shared "orbital" bucket (WP-SC12): plan §2.2 orders
      # Stardock > starbase > port and the legacy composer has always sized a
      # starbase above a port (starbase_scale 0.35 vs port_scale 0.3), which
      # one shared class could express neither as apparent scale nor as two
      # different station-size parity targets.
      starbase: [17, 14]  # area 238 — defence platform (rung 0 is 11x14)
      orbital:  [14, 12]  # area 168 — trading port (rung 0 is 11x12)
      wreck:    [16, 6]   # area 96 — "slightly larger than ships" (plan §2.2)
      ship:     [12, 5]   # area 60
    # Per-continuous_kind override: nebula/black_hole visual system >> wormhole
    # > planet/anchor-fallback (1800), matching plan §2.2's stated hierarchy.
    face_extent_by_kind:
      nebula:     [110, 60]  # area 6600 — the largest phenomenon: a diffuse field
      black_hole: [100, 60]  # area 6000 — comparable to nebula, slightly tighter
      wormhole:   [76, 40]   # area 3040 — clearly bigger than a bare planet, smaller than nebula/black_hole
    # Placement/depth-range box per scale class (plan §9.3). Ship/wreck get a
    # noticeably wider box (x/y span +60%, z span +30%) than every other class
    # per plan §2.5 ("[ships] receive wider placement regions ... than
    # stations"); orbital placement stays tied to its parent planet's own
    # narrower placement (SceneTuning.region_by_scale_class's docstring), so
    # it is not widened independently of the anchor it orbits.
    region_by_scale_class:
      # The z bands are re-based (WP-SC12; the *spans* are unchanged apart
      # from the anchor's, see below). They used to all start at 1, which is
      # also `near_plane_su` — and `project()` refuses any object at an
      # absolute `z < near_plane_su` outright. Since the camera is solved to
      # sit *in front of* the scene anchor by its framing distance, an anchor
      # near a z_min of 1 put the camera at a negative z with nothing legally
      # placeable in front of it, so no secondary object could ever be nearer
      # than the anchor. That is what pinned a lone port beside a wormhole /
      # nebula / black hole to its rung 1 (7 cells) where the legacy composer
      # draws rung 0 (12): reaching 12 cells needed the port at z = -20.
      #
      # An anchor's own z-span buys nothing — it is inflexible, and its
      # apparent size comes from the camera the solver frames to it, not from
      # its depth — so the anchor classes take a shallow 600..699 band and the
      # secondary classes keep their own span widths re-based to straddle it:
      # ~300 su of room in front of the nearest anchor (enough for a station
      # to come forward to its parity size) and ~100-120 su behind the
      # farthest.
      entity:   { x_min: -200, x_max: 200, y_min: -100, y_max: 100, z_min: 600, z_max: 699 }
      anchor:   { x_min: -200, x_max: 200, y_min: -100, y_max: 100, z_min: 600, z_max: 699 }
      belt:     { x_min: -200, x_max: 200, y_min: -100, y_max: 100, z_min: 600, z_max: 699 }
      # Every station kind gets the same *absolute* box, used when it has no
      # planet to orbit; where it may sit relative to a parent planet is the
      # separate `orbit_offset_region_by_scale_class` below.
      # z reaches 300, 100 su nearer than the anchor band's floor, so a
      # station that is *itself* the scene anchor can still come forward to
      # its own parity size: the camera is framed from the station's
      # classified depth by `target_fraction_by_scale_class`, which is a
      # framing fraction and not the parity target, and a lone starbase at
      # 120x44 landed 4 su short of the depth its rung 0 needs.
      stardock: { x_min: -200, x_max: 200, y_min: -100, y_max: 100, z_min: 300, z_max: 799 }
      starbase: { x_min: -200, x_max: 200, y_min: -100, y_max: 100, z_min: 300, z_max: 799 }
      orbital:  { x_min: -200, x_max: 200, y_min: -100, y_max: 100, z_min: 300, z_max: 799 }
      wreck:    { x_min: -320, x_max: 320, y_min: -160, y_max: 160, z_min: 300, z_max: 819 }
      ship:     { x_min: -320, x_max: 320, y_min: -160, y_max: 160, z_min: 300, z_max: 819 }
    # Where an object with a parent planet may sit *relative to that planet*
    # (WP-SC12). Before this existed, the parent-relative reading of a station
    # region was only a docstring: the shipped value was the absolute anchor
    # box (z 1..400) applied as an offset, so a station was always at least
    # 1 su behind its planet and up to 400 behind, far past the depth at which
    # any authored rung still clears once the anchor is framed to fill the
    # viewport — every parented station in the gallery matrix was rejected
    # `no_feasible_depth`. z is symmetric at +/-120 su: twice the planet's own
    # 60 su nominal face width, so a station may orbit anywhere within a
    # couple of planet radii, in front of the world as readily as behind it
    # (which is where the legacy composer draws it — at the disc's near limb).
    # x/y match the absolute box; the screen-space slot lattice is what
    # actually chooses a station's position within them.
    orbit_offset_region_by_scale_class:
      stardock: { x_min: -200, x_max: 200, y_min: -100, y_max: 100, z_min: -120, z_max: 120 }
      starbase: { x_min: -200, x_max: 200, y_min: -100, y_max: 100, z_min: -120, z_max: 120 }
      orbital:  { x_min: -200, x_max: 200, y_min: -100, y_max: 100, z_min: -120, z_max: 120 }
    # frame()'s target projected-ink-height fraction of viewport.height per
    # anchor scale_class (plan §9.5): the Entity frames tighter (1/3) than a
    # planet/phenomenon (1/2) so it reads as a close subject, not a backdrop;
    # ships/wrecks are rarely the anchor so their fraction is small/theoretical.
    target_fraction_by_scale_class:
      entity: "1/3"
      anchor: "1/2"
      belt: "1/2"
      # Only read when the class is the scene anchor. A Stardock is the
      # anchor exactly when nothing bigger shares its sector, and then it is
      # the destination the player came for, so it frames like the Entity
      # (1/3) rather than like an incidental port (1/5) — still well short of
      # a planet's 1/2, which it must never read as.
      stardock: "1/3"
      starbase: "1/4"
      orbital: "1/5"
      wreck: "1/8"
      ship: "1/8"
    # frame()'s seed ink/natural-height ratio before a laddered anchor snaps
    # to its own rung's exact ratio (plan §9.5). Ships/stations are dense
    # authored art (little padding, 9/10); planets/nebulae fade toward the
    # edge (3/5); belts are the sparsest (1/3, permeable field, plan §2.5).
    ink_ratio_by_scale_class:
      entity: "4/5"
      anchor: "3/5"
      belt: "1/3"
      # Measured off the checked-in catalogue rather than assumed: the
      # stardock ladder's richest rung (15x15) has an ink_min/natural height
      # ratio of 0.73-0.80 across archetypes, unlike the flat 1.00 of its
      # lower tiers, and rung 0 is the tier the floor below aims at.
      stardock: "4/5"
      starbase: "9/10"
      orbital: "9/10"
      wreck: "4/5"
      ship: "9/10"
    # Plan §9.1's three structural modes, first match wins, most demanding
    # first. Thresholds reuse the WP-SC04 benchmark canvas breakpoints
    # (87x36, 120x44) so mode selection lines up with sizes already measured.
    structural_mode_thresholds:
      - [120, 44, wide]
      - [87, 36, standard]
      - [0, 0, compact]
    # FixedFovPerspective's calibrated FOV ratio: a gentle half-angle (visible
    # height per depth unit) keeps distant admitted objects legible instead of
    # shrinking sharply toward the frame edges.
    fixed_fov_num: 1
    fixed_fov_den: 2
    # Matches the shipped legacy composer's width = 2*height disc rule
    # (docs/SECTOR_SCENE_COMPOSITION.md), so cutover does not silently change
    # the terminal's visual proportions.
    cell_aspect: "2"
    # Smallest workable positive depth — do not let anything sit on the camera plane.
    near_plane_su: 1
    # DepthLayeredAnchorProjection: 8 layers give enough depth resolution to
    # distinguish near/mid/far traffic without an unbounded search space; a
    # 4/5 per-layer scale gives roughly a 20% size step between adjacent
    # layers, visually distinguishable at terminal resolution.
    depth_layers: 8
    depth_layer_size_su: 6
    depth_layer_scale: "4/5"
    # candidates()'s framing-height sweep bounds, as a fraction of
    # viewport.height (plan §9.6): never frame an anchor smaller than 1/8 of
    # the viewport (illegible) or larger than 3/4 (crowds out everything else).
    camera_height_fraction_min: "1/8"
    camera_height_fraction_max: "3/4"
    # candidates()'s bounded, centre-out aim offsets, in the order to try
    # them — enough range to dodge a collision without degenerating into a
    # full raster scan (plan §6.2 rule 4).
    aim_offsets_su: [0, -2, 2, -4, 4, -6, 6]
    # Hard cap on candidates() output (plan §6.2 rule 4): the height sweep
    # (roughly a dozen distinct rung/cell heights in practice) times the 7
    # aim offsets above, rounded up for headroom.
    max_camera_candidates: 64
    # Plan §9.6 hysteresis metric weights: admission changes (an object
    # popping in/out) are the most visually jarring resize artifact, so that
    # term is weighted 4x the others; camera/position/art-size churn are
    # weighted equally as comparatively minor wobble.
    hysteresis_weight_camera: 1
    hysteresis_weight_position: 1
    hysteresis_weight_admission: 4
    hysteresis_weight_art: 1
    # Hard bound on the whole solve pass loop (plan §9.6, §6.2 rule 4): covers
    # a handful of reposition attempts, at most one reanchor, and a few
    # box-class step-downs before the loop must terminate.
    max_passes: 24
    # One cell of clearance from every viewport edge (plan §2.4: "retain
    # separation and edge margins rather than eliminate every void cell").
    edge_margin: 1
    # Below these cell dimensions an object reads as noise rather than its
    # own shape; stations/ships need at least 2-3 cells on their short axis
    # to read as a rectangle rather than a dot.
    min_projected_cells_by_scale_class:
      entity: [4, 2]
      anchor: [6, 3]
      belt: [6, 2]
      # The natural box of the poorest rung the stardock richness floor below
      # still permits (rung 1, 15x11, read off the checked-in catalogue), so
      # the cell floor and the rung floor state the same thing instead of one
      # silently dominating the other.
      stardock: [15, 11]
      # Same rule as stardock, now that each station kind has its own class
      # (WP-SC12): the natural box of the poorest rung its richness floor
      # below still permits — starbase rung 1 is 11x8, trading_port rung 2 is
      # 7x6 but its rung 1 (11x7) is the poorest tier the legacy composer ever
      # selects for a port in the parity matrix, and a 7x6 "bare can" is the
      # degraded look the minimum-richness fix exists to stop.
      starbase: [11, 8]
      orbital: [11, 7]
      ship: [3, 1]
      wreck: [3, 1]
    # Minimum-richness floor (maintainer feedback: composers were shrinking
    # ports/stardocks/starbases and never using ships' larger sizes even on
    # large screens). `min_projected_cells_by_scale_class` above is smaller
    # than every ladder's smallest rung, so it imposed no real floor -- this
    # instead excludes the worst N rung indices (index 0 = richest, ascending
    # = worse) of a laddered object's own ladder from ever being selected,
    # forcing the solver to place it closer or reject it, never show it
    # degraded. Every port/starbase/stardock ladder has 4 authored rungs;
    # excluding the worst 1 leaves 3 usable tiers.
    #
    # `ship` is deliberately absent from this map: measurement (real gallery
    # case/size matrix, both strategies) showed that excluding even the
    # single worst ship rung (of 3) collapses DepthLayeredAnchorProjection's
    # ship/wreck admission rate from ~99% to ~3% -- its coarse per-layer
    # depth-scale step (4/5 across 8 layers) rarely lands inside the
    # narrower band where 2-of-3 ship rungs both clear. The ship "never uses
    # larger sizes" complaint is instead addressed by cost_budget below
    # (its two richest tiers cost 178-436 and were literally unaffordable);
    # see docs/SECTOR_SCENE_PHYSICAL_MODEL_PLAN.md.
    #
    # `stardock` excludes the worst *2* of its 4 rungs, leaving only 15x15
    # and 15x11. "Never the worst tier" is the right bar for an incidental
    # port; a headline location should be recognisable, and at rung 2 (9x6)
    # it is a can. Measured across the gallery matrix with the 10x20 face
    # above: every admitted Stardock lands on rung 0 under both strategies
    # (6 of 8 cells, the two misses being 67x30/87x36 planet+stardock, where
    # a parent-orbiting station is too far behind the planet to clear any
    # permitted rung -- the same honest no_feasible_depth an ordinary port
    # already hits there). Overall secondary-object admission is unchanged
    # at 91.3%/94.9%, so the floor costs nothing but the two Stardocks that
    # would have been drawn as cans.
    min_rung_index_from_end_by_scale_class:
      orbital: 1
      starbase: 1
      stardock: 2
    # Matches edge_margin: one blank cell of clearance between distinct
    # accepted objects' ink-max boxes (plan §9.6 attempt rule 4).
    separation_margin: 1
    # The minimum visible fraction the farther object of an occluding pair
    # must clear (plan §9.6 attempt rule 5). The Entity keeps a floor of 1 --
    # plan §4.15 makes it the foreground subject, so nothing is ever in front
    # of it anyway. The framing anchor and the belt drop from 1 to 3/4
    # (WP-SC12): "never partially occluded" was an assumption, and it is not
    # what the arrival view has ever looked like. The legacy composer berths a
    # station *at the primary body's lower limb, overlapping the disc's
    # bounding box a little so it reads as at the world* -- that is the whole
    # point of the placement -- and `_paint_station` does not consult the
    # occupancy map at all. A floor of 1 made a single overlapping cell fatal,
    # so on a canvas whose sky is mostly filled by the body the station could
    # only be admitted at a depth far enough back to clear it entirely, which
    # is a smaller authored rung than legacy draws (and on the narrower
    # canvases, no admissible depth at all). 3/4 is the same floor every other
    # class already carries.
    min_visible_fraction_by_scale_class:
      entity: "1"
      anchor: "3/4"
      belt: "3/4"
      # Same as any other station: a Stardock is bigger, not un-occludable.
      stardock: "3/4"
      starbase: "3/4"
      orbital: "3/4"
      ship: "3/4"
      wreck: "3/4"
    # Cumulative estimated render-cost ceiling for one solve (plan §4.14,
    # §9.4), in the catalogue's measured render_cost units. One unit is
    # very nearly one cell of authored sprite box: `render_cost` is
    # `width * height * sections` normalised so the cheapest rung is 10,
    # which across the whole checked-in catalogue works out at 0.66-1.11
    # cost per natural cell (median 1.11).
    #
    # The previous value, 250, rested on a false premise — its comment said
    # "the checked-in ship/port rungs measure in the tens", but only the
    # *worst* rungs do: ship rung 0 costs 350-436 and rung 1 178-244, and
    # Stardock rung 0 costs 200. A 250 budget therefore made every ship's
    # two richest authored tiers unaffordable on every canvas, which is the
    # direct cause of the "composers never use the larger sizes for the
    # ships" report.
    #
    # 800 is the smallest value measured (real gallery case/size matrix,
    # both strategies, sweeping 250/400/600/800/1000/1400/2000) at which
    # ordinary scenes stop being cost-limited in rung richness: the admitted
    # ship rung distribution is byte-identical at 800, 1000, 1400 and 2000,
    # so above 800 the binding constraint is geometry, not cost. It also
    # still binds the plan §6.3 synthetic stress inventories, which is the
    # budget's actual job — the 20/50-ship cases run at 786/800, 712/800,
    # 750/800 and 794/800 with the anchor stepped down its box-class ladder,
    # whereas at 1400 they fall under budget (1054/1400) and the only
    # remaining bound would be emergency_ship_ceiling. As a sanity check on
    # scale, 800 cost units is roughly 800 cells of sprite box, about a
    # tenth of the largest supported 150x52 canvas.
    cost_budget: 800
    # Hard cap on admitted ship count, independent of cost_budget (plan
    # §2.3), well above any generated-universe DTO inventory measured, but
    # below the 50-ship synthetic stress case so that case still exercises it.
    emergency_ship_ceiling: 40
    # Per-object bound on deterministic reposition offsets tried for one
    # flexible object across a whole solve (plan §6.2 rule 4, §9.6 step 1).
    max_reposition_candidates: 16
    # Plan §9.6's glyph scatter: free-cell placement attempts per
    # fighter/mine glyph before giving up to the sidebar, and the minimum
    # cell spacing between placed glyphs so a garrison doesn't read as one block.
    max_glyph_tries: 20
    glyph_spacing: 2
    # --- station-size parity (WP-SC12) -------------------------------------
    # The acceptance bar for replacing the legacy `_SceneComposer` is that a
    # port / Stardock / starbase renders at the size that composer produces.
    # These two blocks state that size in the physical model's own vocabulary
    # -- a target *projected ink height* in cells -- and the solver orders a
    # station's bounded depth candidates by closeness to it (plan §4.13's
    # "soft objective expressed in projected height"). It is candidate
    # ordering only: every candidate still goes through every hard rule.
    #
    # `station_size_reference` reproduces the legacy composer's
    # `primary_body_height` (edge/tui/widgets.py), the head of its scale
    # chain. Every coefficient is lifted from that function, not fitted:
    #   height_fraction  = its `body_h * 0.9`
    #   header_rows      = the rows it reserves before the body budget
    #                      (hdr + 1 = 4 for a beacon-less sector)
    #   width_fraction   = its visible_cap, (1 - 0.78) / (2*0.7 - 1) = 0.55
    #   max_cells/min_cells = SceneArtConfig.planet.max_height/min_height
    # Legacy's fourth term, the _SHIP_SKY_RESERVE trim, is deliberately not
    # reproduced: it buys horizontal sky for a ship berthed beside a
    # right-anchored disc, a placement rule the physical model does not
    # share, and it is rung-neutral -- it moves the reference only at 87x36
    # (28 -> 25), where every station kind selects the same authored rung
    # either way.
    #
    # This is *not* the model's own anchor size, and deliberately so. A 60x30
    # su anchor face at cell_aspect 2 projects w = 4h, and §4.7/§4.17 forbid
    # cropping, so the largest whole anchor a viewport can hold is
    # (width - 2*edge_margin)/4 = 16/21/29/37 cells at 67x30/87x36/120x44/
    # 150x52 -- below the legacy composer's 23/25/36/40, because legacy lets
    # its disc run off the right edge. Keying station size to the projected
    # anchor would propagate that difference into every station; keying it to
    # this reference does not.
    station_size_reference:
      height_fraction: "9/10"
      header_rows: 4
      width_fraction: "11/20"
      max_cells: 40
      min_cells: 4
    # Per-kind scale and clamps, mirroring SceneArtConfig.station_dimensions'
    # two branches exactly: `round(primary_height * <kind>_scale)` when the
    # station orbits a planet, `int(body_height * 0.6)` when it does not, both
    # clamped to that kind's own SpriteSize min/max height.
    station_target_by_scale_class:
      orbital:  { parent_scale: "3/10", lone_scale: "3/5", min_cells: 3, max_cells: 12 }
      starbase: { parent_scale: "7/20", lone_scale: "3/5", min_cells: 3, max_cells: 14 }
      stardock: { parent_scale: "3/5",  lone_scale: "3/5", min_cells: 3, max_cells: 16 }
    # Per-continuous-kind ink/cost envelopes (calibration §2): request-box ->
    # visible-ink relationship, illegibility floor, the anchor step-down
    # ladder's box classes (descending), and their render_cost (nondecreasing
    # with box size, same units as the ladder rungs' measured render_cost).
    # `ink_fraction_max` is a *ceiling* the resolved render must not exceed
    # (edge/art/scene_paint.py::_max_ink_envelope), so it has to sit at or
    # above what the shipped generator actually inks. The WP-SC05 values were
    # estimates; measuring every generator across its own box classes at three
    # sizes and five seeds shows all but the nebula fill 100% of their request
    # box on at least one axis (planet 1.000, belt 1.000, black_hole 1.000,
    # wormhole 1.000, wreck 1.000, entity 1.000, nebula 0.833). A 9/10 or 4/5
    # ceiling therefore fired the bounded validation correction on *every*
    # such object and -- with no cheaper box class left -- dropped it outright
    # (WP-SC12).
    continuous:
      planet:
        # A disc render fills most of its request box (60-90%); three box
        # classes give the anchor step-down ladder room to shrink twice
        # before hitting the legibility floor.
        ink_fraction_min: "3/5"
        ink_fraction_max: "1"
        min_extent: [6, 3]
        box_classes: [[80, 40], [50, 25], [28, 14]]
        render_cost: [70, 35, 12]
      nebula:
        # Cloud phenomena are diffuse (lower ink-fraction floor than a solid
        # disc) but can be dense at full detail; the largest box class here
        # is the plan §6.1 cost-dominant case (highest render_cost of the set).
        ink_fraction_min: "2/5"
        ink_fraction_max: "9/10"
        min_extent: [10, 5]
        box_classes: [[100, 50], [64, 32], [36, 18]]
        render_cost: [110, 55, 20]
      black_hole:
        # Accretion-disc/lensing system (plan §2.1): the visible phenomenon
        # (not just the event horizon) supplies physical scale, so its
        # envelope is sized close to the nebula's.
        ink_fraction_min: "1/2"
        ink_fraction_max: "1"
        min_extent: [8, 4]
        box_classes: [[90, 45], [58, 29], [32, 16]]
        render_cost: [100, 50, 18]
      wormhole:
        # "Slightly larger than a planet" (plan §2.2): smaller top box class
        # than planet/nebula/black_hole above.
        ink_fraction_min: "1/2"
        ink_fraction_max: "1"
        min_extent: [6, 3]
        box_classes: [[50, 25], [32, 16], [18, 9]]
        render_cost: [40, 20, 8]
      wreck:
        # Wrecks are not laddered (ArtMode.CONTINUOUS); a small envelope,
        # two box classes since a wreck never anchors a crowded scene.
        ink_fraction_min: "1/2"
        ink_fraction_max: "1"
        min_extent: [5, 2]
        box_classes: [[24, 10], [16, 7]]
        render_cost: [15, 6]
      entity:
        # The Entity is unique per sector and never rejected for cost (plan
        # §2.3 invariant); its ladder only needs room for step-down to have
        # somewhere to go.
        ink_fraction_min: "3/5"
        ink_fraction_max: "1"
        min_extent: [8, 4]
        box_classes: [[40, 16], [26, 10]]
        render_cost: [35, 14]
      belt:
        # `ink_fraction_min` is 3/5, not the WP-SC05 estimate of 1/5 (WP-SC12).
        # A permeable field *reads* as mostly negative space, but the estimate
        # confused that with the ink *bounding box*, which is what this
        # fraction measures: sweeping the real belt generator over its own box
        # classes at three sizes and five seeds puts the ink bbox at
        # 0.650-1.000 of the request box on width and 0.800-1.000 on height.
        # At 1/5 the `min_extent` floor below demanded a 15-cell-tall belt,
        # while an 11.25:1 projected aspect caps a belt at ~10 cells on a
        # 120-wide canvas — so the belt was unadmittable at every calibrated
        # viewport, and every `belt+…` scene lost its primary body.
        ink_fraction_min: "3/5"
        ink_fraction_max: "1"
        min_extent: [12, 3]
        box_classes: [[120, 20], [80, 14]]
        render_cost: [30, 12]
    # §3 extended proposals with a natural config home, approved but not yet
    # read by any WP-SC06 solver code path — kept here so a future work
    # package wiring these has an already-approved number rather than
    # inventing one. (Absolute/solver latency budgets are deliberately left
    # out of shipped config — they gate devtool/benchmark performance
    # assertions, not a runtime tuning knob; see edge/devtool/scene_benchmark.py.)
    cost_budget_estimate_tolerance: "1/10"  # plan §4.14: estimate-side budget tolerance
    ship_depth_objective_weight: 2          # plan §4.13: soft ship-depth/rung-variation tiebreaker

# TUI presentation — the sector-screen warp grid + status sidebar (no rules impact).
ui:
  warp_columns: 3            # warp-grid width; cells fill the printable area, wrap into rows
  warp_focus_default: backtrack  # default keyboard focus: first | backtrack | unexplored
  nav_core_anchor_side: left # which edge the nav rose's Core anchor pins to: left | right (fixed, never jumps sides)
  sidebar_width: 33          # status sidebar fixed character width (content is fixed-width)
  sidebar_min_screen_width: 90  # hide the sidebar when the terminal is narrower than this
  local_map_radius: 3        # Computer/Map ego-graph reach in warp hops from your sector
  portrait_dir: images/species       # species portrait dir (abs, or repo-root-relative); supports <id>_<n> variants
  portrait_symbols: vhalf+quad+geometric  # chafa --symbols selector for alien contact portraits
  portrait_font_ratio: 0.4   # terminal cell width/height; lower to widen a horizontally-squashed portrait

# The species roster lives in its own file (§6) so a game can be generated against a
# different source roster. The alien dialogue corpus (§6.7) lives in a third file so a
# roster and its voice corpus can vary independently. Both are resolved relative to this
# file; the roster is injected as `roster`, and the dialogue is merged onto it.
#
# `dialogue_file` may be a single path or a list applied in order: the base file supplies
# `personas` / `recency_k` / shared `grammar`, and any later file may add a `species_grammars`
# block (an authoring-pipeline sidecar) that layers per-species grammar overrides on top —
# e.g. to A/B a machine-authored corpus, point it at a generated sidecar:
#   dialogue_file:
#     - alien_dialogue_default.yaml
#     - dialogue/alien_dialogue.ollama_gemma4.yaml
roster_file: alien_roster_default.yaml
dialogue_file: 
    - alien_dialogue_default.yaml
    - dialogue/alien_dialogue_species.yaml
names_file: names_default.yaml
# Ground-operations (survey + assault) balance — its own file so a game can vary
# its ground tuning independently (GW-WP02). Merged in as the `groundwar:` block.
groundwar_file: groundwar_default.yaml

economy:
  starting_latinum: 2000   # latinum in hand for a brand-new player (the trade-loop seed)
  starting_bank: 0         # latinum on deposit at game start (accrues interest, §8)

  # Every port price is clamped to [floor_frac*base, ceiling_frac*base] so it can
  # never cross zero or run away — the §8 positive-price invariant. A fully-stocked
  # port bottoms out at floor_frac*base; a sold-out one tops out at ceiling_frac*base.
  floor_frac: 0.25
  ceiling_frac: 2.0

  # The three tradeable commodities (§8), BNT's tuned values relabeled to the TW trio.
  #   base       = mid-stock reference price (latinum/unit) the clamp is measured against
  #   delta      = how far price swings from base as stock moves off its desired level
  #   elasticity = exponent shaping that swing (1.0 = linear; >1 steepens near the extremes)
  fuel_ore:  { base: 11, delta: 5, elasticity: 1.0 }
  organics:  { base: 5,  delta: 2, elasticity: 1.0 }
  equipment: { base: 15, delta: 7, elasticity: 1.0 }

  # The component sink: Stardock hardware prices by engine-room tier (§8). Tier III is
  # barter-only (alien trade / salvage), so it has no latinum price listed here.
  tier_i_component_latinum: 2000   # flat price of any Tier-I component at Stardock
  tier_ii_component_latinum: 8000  # flat price of any Tier-II component (the mid-game sink)
  repair_kit_latinum: 200          # a carried field-patch kit (restores a knocked-out component)
  ship_trade_in_frac: 0.5   # fraction of the old hull's price credited toward a new one
  repair_cost_frac: 0.25    # Stardock battle-damage repair costs this × the component's tier price (Phase 3)
  colonist_incentive: 5     # per-head latinum to enlist a Stardock colonist (recruited, not bought)

  # Banking + port stock regeneration (an engine cron applies these; the math itself is pure).
  bank_interest_per_day: 0.005      # daily interest on the bank balance (0.5%/day, compounds per turn-reset)
  regen_fraction: 0.05              # share of the gap to desired stock a port refills each economy tick
  desired_stock_frac_standard: 0.50 # a normal port settles toward 50% of capacity (its price pivot)
  desired_stock_frac_stardock: 0.90 # Stardock stays near-full (90%) so it's a reliable supplier

  # The Phase-5 order-book market (§8, WP46+): ports post buy/sell orders against their
  # desired-stock gaps each economy tick, and a daily settlement moves real goods and
  # latinum between them (conserving). The math is pure (edge/core/market.py); the WP47
  # wiring reads `enabled` — false falls back to the legacy regen byte-identically.
  market:
    enabled: true
    order_band: 0.10        # dead zone around desired stock: no orders within ±10% (silence at equilibrium)
    hinterland_frac: 0.01   # residual off-map regen (vs legacy 0.05) — the external gradient the book arbitrages
    min_purse_per_size: 200 # liquidity floor: the daily drip tops each purse toward size × this (selling never deadlocks)
    drip_frac: 0.25         # fraction of the purse gap to the floor closed per day (capped at the gap — never overshoots)
    settle_price: midpoint  # settlement price policy; "midpoint" of the crossed limits is the only one implemented

  # Haggling mini-game when trading at a port (§8). quick-trade mode skips it entirely.
  haggling:
    insult_frac: 0.30      # an offer worse than this fraction off the fair price insults the trader (may end talks)
    max_rejections: 2      # counter-offers the trader will entertain before walking away
    history_penalty: 0.08  # each prior haggle at this port stiffens the trader by this much (diminishing returns)

# Alien disposition bands (§6): effective disposition (base + the player's attitude
# offset, clamped 0–1) is hostile below `hostility`, friendly at/above `amity`, neutral
# between. Placement is band-graded (§5/§6): the Hub is peaceable, hostiles rise outward.
aliens:
  hostility_threshold: 0.35  # effective disposition below this ⇒ hostile band (opens with violence)
  amity_threshold: 0.65      # effective disposition at/above this ⇒ friendly band (trade, tech, dialogue)
                             # between the two ⇒ neutral band. Effective disp = base + player attitude offset, clamped 0–1.
  escape_floor: 0.10   # player escape chance never drops below this, however outmatched (§10, Phase 3)
  # Per-band downward bias added to every placed species' disposition (Hub stays friendly; each
  # band still keeps a friendly resupply anchor). Mean stance falls outward → danger rises (§5/§6).
  band_disposition_bias: { Hub: 0.0, Frontier: -0.1, Deep: -0.3, Void: -0.5 }
  disposition_gradient_tolerance: 0.1  # slack the §5 validator allows before the outward danger gradient is "broken"
  # Consequences of conduct (§6.5, WP27): killing a species' ships sours its attitude
  # (by the species' own attitude_loss_rate) and deepens a grudge against the player;
  # never_forgets / permanent-betrayal species record it forever and lock the offset.
  grudge_severity_per_kill: 0.08  # attitude-offset penalty stacked per ship of theirs you destroy
  grudge_duration_days: 30        # game-days a (recoverable) grudge lingers before it decays
  # Alignment (the good/evil axis) shifts per kill by the victim's disposition band; killing the
  # peaceable costs you, culling the hostile pays. Experience is separate (a progress score).
  alignment_kill_friendly: -3   # destroying a friendly-band ship (a war crime, in effect)
  alignment_kill_neutral: -1    # destroying a neutral-band ship
  alignment_kill_hostile: 1     # destroying a hostile-band ship (a small merit)
  experience_kill_scale: 10.0   # experience per kill = this × the victim's threat rating
  experience_per_discovery: 5   # flat experience granted for each new discovery logged
  criminal_alignment: -10   # at/below this the governor's Core patrols treat you as an outlaw (WP38 enforces)
  bounty_per_kill: 100      # latinum per hostile ship/fighter destroyed (WP44; echoes TW2002's Cabal 100/kill)
  entity_drift_chance: 0.5  # the roaming Entity's own per-firing move chance (§7, WP36; it wanders anywhere non-Core)
  # NPC traders (WP43): a friendly merchant (movement_policy trade_seek) runs real port trades on the
  # trader_step cron — buys good deals, dumps held cargo, conserving goods through the §8 pricing.
  trader_start_cash: 5000        # latinum purse a fresh trader is seeded with on its first step
  trader_cargo_capacity: 100     # units of goods a trader can hold at once
  trader_trade_units: 20         # max units a trader moves per trade step
  trader_buy_discount_frac: 0.95 # only buy when the quoted price is below this × the commodity's base (a real deal)
  trader_alongside_attitude: 0.02 # attitude a co-located player gains toward a trading merchant per step (capped)
  # NPC governance (§6.3, WP51): a background hum of Core seizures + leadership intrigue on the
  # governance_tick cron. A covets_core bloc seizes only once the incumbent's Core bases are broken.
  governance:
    enabled: true
    seizure_chance: 0.002       # per eligible covets_core bloc, per day
    intrigue_chance: 0.001      # per bloc with an internal_rival_species_id, per day
    min_incumbent_bases: 1      # seizure ready only when the incumbent holds fewer operational Core bases than this

# Encounter rolls (§10, Phase 3 — read by the WP24 encounter system). Per-band chance an
# encounter fires (0 in the safe Hub, rising outward); when it does, a species is drawn
# with weight inverse to threat (weak raiders common, apex predators rare).
encounters:
  interrupt_chance: { Hub: 0.0, Frontier: 0.12, Deep: 0.22, Void: 0.32 }  # per-band chance a warp entry triggers an encounter
  weight_inverse_threat: true  # when true, weaker species are drawn more often (weight ∝ 1/threat)
  weight_floor: 0.05           # minimum draw weight, so even an apex predator can still appear
  # Whether an alien detects (and can engage) the player, vs. the player slipping past unseen.
  detection_base: 0.7             # baseline detection probability before sensor/cloak/nebula modifiers
  detection_sensor_coeff: 0.05    # + this per point of the alien's sensor rating
  detection_cloak_coeff: 0.08     # − this per point of the player's cloak rating
  nebula_cover: 0.25              # − this flat while the player sits in a nebula sector

# Combat rounds (§10, WP25). Flee is clamped to [aliens.escape_floor, flee_cap] — the
# §13 floor invariant. ahead/spinal attackers are evadable (combat-speed contest);
# all_round leaves no safe angle; missiles ignore arc.
combat:
  # Flee: the odds of breaking off from combat entirely, clamped to [aliens.escape_floor, flee_cap].
  flee_base: 0.35            # baseline flee chance before modifiers
  flee_speed_coeff: 0.05     # + this per point your combat speed exceeds the enemy's
  interception_coeff: 0.5    # − this × the enemy's interception rating (anti-flee)
  cloak_coeff: 0.03          # + this per point of your cloak rating
  damage_penalty: 0.25       # − up to this as your hull is worn down (a crippled ship runs slower)
  flee_cap: 0.95             # upper clamp on flee chance (never a sure thing)
  # Evade: the odds a single incoming attack misses, for evadable (ahead/spinal) arcs only.
  evade_base: 0.35           # baseline evade chance per shot
  evade_speed_coeff: 0.06    # + this per point of combat-speed advantage
  evade_cap: 0.9             # upper clamp on evade chance
  threat_damage_scale: 3.0   # an alien's per-shot damage = this × its threat rating
  missile_damage: 30         # damage of one homing missile (ignores firing arc, always hits)
  missile_price: 300         # Stardock price per missile reload
  swarm_size_min: 3          # min ships when a pack/escort encounter spawns
  swarm_size_max: 5          # max ships in such a pack
  # Localized damage (§4.1, WP26): once a volley reaches the hull, it may knock out one
  # subsystem component instead of just shaving hull, weighted toward exposed/forward gear.
  knockout_chance: 0.35   # chance a hull-reaching hit disables a component (vs. plain hull loss)
  knockout_weights: { main_gun: 3.0, thrusters: 3.0, screens: 2.0, spindrive: 1.0 }  # relative odds of which subsystem takes it
  # Ship destruction (§10): hull reaching 0 drops the player into this hull (price 0 — never sold).
  escape_pod_class: escape_pod
  # Salvage from a defeated foe (§10, BNT-style 10–20%): latinum = hull_max × salvage_hull_value
  # × U[frac_min, frac_max], plus an occasional loose Tier-I component (needs a free hold).
  salvage_frac_min: 0.10          # low end of the random salvage multiplier
  salvage_frac_max: 0.20          # high end of the random salvage multiplier
  salvage_hull_value: 3.0         # latinum value per point of the wreck's max hull
  salvage_component_chance: 0.25  # chance a wreck also drops a scavengeable Tier-I component

# Weapon catalog (§4): {damage, firing_arc, rate, special}. Referenced by ship-class
# `armament` lists; arcs drive the §10 evasion counter-play.
weapons:
  light_blaster:   { name: Light Blaster,    damage: 8,  firing_arc: all_round }
  spinal_railgun:  { name: Spinal Railgun,   damage: 22, firing_arc: spinal, rate: periodic }
  nose_cannon:     { name: Nose Cannon,      damage: 12, firing_arc: ahead }
  turret_array:    { name: Turret Array,     damage: 14, firing_arc: all_round }
  heavy_lance:     { name: Heavy Lance,      damage: 26, firing_arc: ahead, rate: periodic }

bigbang:
  sector_count: 1000          # total sectors (nodes) in the generated warp graph
  topology_mode: spiral       # graph shape: trunk | expansive | planar | mesh | spiral (dense concentric rings), §5

  # === Shared across every topology mode ===
  # These knobs mean the same thing regardless of `topology_mode` above.
  cluster_min: 5              # smallest cluster of sectors the generator forms
  cluster_max: 15            # largest such cluster (clusters are then bridged together, §5)
  intra_group_degree: 3.5    # average warp connections per sector inside a cluster (density)
  inter_group_degree: 3.5    # average inter-cluster warp connections per cluster (density)
  one_way_chance: 0.15       # one-way density; spiral rewires this share of non-Core sectors as wormholes
  max_warps_per_sector: 8    # outbound-warp cap; configurable up to the nav rose's hard limit of 8
  core_sector_count: 25      # sectors reserved as the protected Core Space (sectors 1–10), §5
  home_cluster_min: 10       # alliance home cluster size range (each < Core), §5 step 6
  home_cluster_max: 20
  start_sector: stardock     # where the player starts: stardock | random | a specific sector number
  stardock_min_hops: 2       # Stardock is placed this many warp hops from the Core, at least…
  stardock_max_hops: 5       # …and at most this many (a short shakedown run from home)
  port_density: 0.45         # fraction of sectors that hold a trading port
  planet_density: 0.25       # fraction of sectors that hold a planet
  port_class_distribution: [20, 20, 20, 10, 10, 10, 5, 5]  # relative weights of the 8 port buy/sell classes
  initial_stock_min: 200     # low end of a port's randomized starting commodity stock
  initial_stock_max: 2000    # high end of that starting stock

  # === Topology-mode-specific ===
  # One block per `topology_mode`; only the block matching the mode selected above is used
  # (active_topology()). Each block carries that mode's distance bands and, for trunk, its
  # extra-bridge range. Distance bands set each sector's band by warp-hop distance from the
  # Core (driving rarity/danger/ownership everywhere else). Every block must name the same
  # bands in the same order — only the hop windows differ, because expansive's ring roads
  # lengthen paths (so its windows are deeper to keep all four bands populated).
  topology:
    trunk:      # the chokepoint spanning tree (the original algorithm)
      bridges_min: 1          # fewest extra bridges a cluster gets beyond its spanning-tree link
      bridges_max: 5          # most such extra bridges (trunk-only; other modes ignore these)
      bands:
        - { name: Hub,      min_hops: 0,  max_hops: 5 }
        - { name: Frontier, min_hops: 6,  max_hops: 12 }
        - { name: Deep,     min_hops: 13, max_hops: 20 }
        - { name: Void,     min_hops: 21, max_hops: 9999 }
    expansive:  # the deeper band-lattice web
      bands:
        - { name: Hub,      min_hops: 0,  max_hops: 14 }
        - { name: Frontier, min_hops: 15, max_hops: 35 }
        - { name: Deep,     min_hops: 36, max_hops: 58 }
        - { name: Void,     min_hops: 59, max_hops: 9999 }
    planar:     # concentric planar spiderweb
      bands:
        - { name: Hub,      min_hops: 0,  max_hops: 5 }
        - { name: Frontier, min_hops: 6,  max_hops: 12 }
        - { name: Deep,     min_hops: 13, max_hops: 20 }
        - { name: Void,     min_hops: 21, max_hops: 9999 }
    mesh:       # regular grid mesh
      bands:
        - { name: Hub,      min_hops: 0,  max_hops: 8 }
        - { name: Frontier, min_hops: 9,  max_hops: 16 }
        - { name: Deep,     min_hops: 17, max_hops: 24 }
        - { name: Void,     min_hops: 25, max_hops: 9999 }
    spiral:     # dense concentric rings, numbered outward from sector 1 (six-warp default)
      bands:
        - { name: Hub,      min_hops: 0,  max_hops: 4 }
        - { name: Frontier, min_hops: 5,  max_hops: 9 }
        - { name: Deep,     min_hops: 10, max_hops: 14 }
        - { name: Void,     min_hops: 15, max_hops: 9999 }

# Engine room (§4.1): the game-global formulas turning a hull's slotted parts into
# derived aspects. Per-subsystem layouts live on each ship class below. The
# coefficients are tuned so the starter Trailblazer's "every base slot filled, all
# upgrade slots empty" layout derives exactly the Phase-1 flat numbers (shields 100,
# warp 3, combat 4) — a regression pin (PHASE2_PLAN WP1).
#
#   aspect = base + per_component*active + per_tier*tier_bonus
#   (active = filled, non-knocked-out slots; tier_bonus = sum of (tier-1) over them)
engine_room:
  aspects:
    spindrive: { base: 0, per_component: 1,  per_tier: 1 }   # -> warp speed
    thrusters: { base: 0, per_component: 2,  per_tier: 1 }   # -> combat speed
    screens:   { base: 0, per_component: 50, per_tier: 25 }  # -> shields
    main_gun:  { base: 2, per_component: 8,  per_tier: 6 }   # -> gun damage
  efficiency: { base: -1, per_component: 1, per_tier: 1 }    # spindrive -> global combat bonus
  warp_turn_divisor: 3      # turns_per_warp = max(1, round(divisor / warp_speed))
  gun_rate_base: 1
  gun_rate_step: 2          # +1 rate of fire per 2 parts in the main gun
  tier_ceiling: III

# Typed planets (§4.2): per-type production shaping + BNT colonist constants +
# band-weighted ownership. yield_profile multiplies per-commodity colonist output;
# habitability caps colonist population (0 = uncolonizable, extraction-only).
planets:
  production_rate: 0.005     # commodity output per (habitability-capped) colonist per tick (§A.3)
  food_per_colonist: 0.05    # organics each colonist eats per tick (unfed colonies starve)
  growth_rate: 0.02          # colonist population growth per tick while fed
  starvation_rate: 0.05      # colonist die-off per tick when the organics run out
  jovian_scoop: 50           # fuel ore auto-scooped per tick from a gas giant (no colonists needed)
  asteroid_mining: 50        # equipment per hand-mining action (and per tick, where auto-collected)
  mining_turn_cost: 1        # turns one hand-mining action costs
  # A belt is FINITE (PT-52): a seeded ore reserve that mining draws down and that never
  # regrows. Reserve = base × the band's scale × a per-belt spread draw, so the deep fields are
  # the rich ones — worth the trip out, and worth moving on once you have worked one out.
  belt_reserve_base: 600
  belt_reserve_spread: 0.35
  belt_reserve_band_scale: { Hub: 1.0, Frontier: 1.6, Deep: 2.4, Void: 3.5 }
  # Cloud Cities (PT-54): a gas giant has no ground, so it holds no stores and no people until
  # a staging area is built — paid from the ship's HOLD (there are no stores yet to draw on).
  # Size n costs n × stage_cost equipment; the first is one hold-load of the starting hull (60)
  # and exactly one belt haul, so the first city is a single supply run.
  cloud_city_stage_cost: 50   # equipment aboard per size step (size n costs n × this)
  cloud_city_berths: 5000     # colonist berths per city size (a maxed city ≈ 20k — a station, not a world)
  cloud_city_max_size: 4      # the ceiling a city can be built to
  cloud_city_npc_size: 2      # the city an alliance-owned gas giant is generated with
  # Planet taxonomy. Each type fixes: whether colonists can live there (colonizable),
  # the population ceiling (habitability; 0 = extraction-only, no colonists), and a
  # yield_profile that multiplies per-commodity colonist output (§4.2).
  types:
    terrestrial_warm:  { colonizable: true,  habitability: 100000, yield_profile: { fuel_ore: 0.3, organics: 1.5, equipment: 0.5 } }
    terrestrial_cool:  { colonizable: true,  habitability: 120000, yield_profile: { fuel_ore: 0.3, organics: 1.3, equipment: 0.5 } }
    terrestrial_hot:   { colonizable: true,  habitability: 20000,  yield_profile: { fuel_ore: 1.5, organics: 0.2, equipment: 0.4 } }
    terrestrial_cold:  { colonizable: true,  habitability: 20000,  yield_profile: { fuel_ore: 0.4, organics: 0.2, equipment: 1.5 } }
    jovian:            { colonizable: false, habitability: 0,      yield_profile: { fuel_ore: 1.0, organics: 0.0, equipment: 0.0 } }
    asteroid_belt:     { colonizable: false, habitability: 0,      landable: false, yield_profile: { fuel_ore: 0.2, organics: 0.0, equipment: 1.0 } }
    barren:            { colonizable: false, habitability: 0,      yield_profile: {} }
  # Band-weighted owner roll (non-Core): alliance-owned vs unowned. The unowned
  # fraction is non-decreasing Hub→Frontier→Deep→Void (§4.2 invariant). Core worlds
  # are always governor-owned regardless of this table.
  ownership:  # per-band odds a non-Core planet is alliance-owned vs. unclaimed (none)
    Hub:      { alliance: 8, none: 2 }   # near home: mostly claimed territory
    Frontier: { alliance: 5, none: 5 }
    Deep:     { alliance: 3, none: 7 }
    Void:     { alliance: 1, none: 9 }   # frontier: mostly free for the player to claim

  # Who already lives here (GW-WP09-PRE). The big bang seeds native polities: Core
  # worlds hold the governor's people, a bloc's home cluster holds its own, and beyond
  # them lie *unaligned* worlds — `owner: none` with a people on it, which is the only
  # kind of world a fresh player may assault, and the subject of the D2 protectorate.
  # Population is a fraction of the world's own capacity, so a small world holds a
  # small people. `min_*` are generation invariants: a seed that cannot field them is
  # regenerated, so the ground game always has targets.
  inhabitants:
    band_chance:            # odds an unaligned world beyond the blocs is peopled
      Hub:      0.40        # near home: the settled lanes, mostly claimed already
      Frontier: 0.75        # the contested middle — where the ground game lives
      Deep:     0.65
      Void:     0.45        # the far dark is emptier, but what is out there is unowned
    unaligned_wary_bias: 0.7   # beyond the blocs, a wary people is the likelier neighbour
    home_cluster_chance: 0.7   # a bloc peoples the cluster it holds
    core_chance: 0.85          # the governor's capital worlds are lived in
    population_min_frac: 0.05  # of the world's colonist capacity
    population_max_frac: 0.55
    citadel_chance: 0.35       # an inhabited world that has fortified (L2+ raises the gun)
    citadel_max_level: 3
    treasury_per_1k: 40        # latinum banked per 1000 inhabitants
    stores_per_1k: 30          # goods held per 1000 inhabitants
    min_assaultable: 6         # generation invariant: ground targets for a fresh player
    min_friendly_inhabited: 4  # ... and worlds whose survey finds settlements

# Orbital starbases (§4.2, WP4): the engine-room model minus thrusters/spindrive,
# plus a fusion_reactor (whose keystone `converter` powers the base). Owned worlds
# can carry an intact base that defends the system (Phase 3); an unowned, uninhabited
# world can carry a derelict — built then stripped of its reactor keystone, so the
# remaining parts are a salvage cache the player can cannibalize.
starbase:
  ship_class_id: orbital_platform  # the ship-class template a starbase is built from
  owned_base_chance: 0.5      # chance an owned planet carries an intact, system-defending base
  derelict_chance: 0.4        # chance an unowned, uninhabited planet carries a strippable derelict
  service_integrity_min: 0.70  # a powered base below this component integrity withholds services (WP-PR04)
  # Starbase engine room: like a ship's, minus thrusters/spindrive, plus a fusion_reactor that
  # powers the whole base. slot_count = total slots; keystone = the part whose loss kills the
  # subsystem; base_components = what ships pre-filled; legal_components = what may be slotted.
  subsystems:
    fusion_reactor:
      slot_count: 4
      keystone: converter
      base_components: [converter, radiator, accelerator]
      legal_components: [converter, radiator, accelerator, secondary]
    screens:
      slot_count: 3
      keystone: secondary
      base_components: [secondary, accelerator]
      legal_components: [secondary, accelerator, converter, radiator]
    main_gun:
      slot_count: 3
      keystone: accelerator
      base_components: [accelerator, linkage]
      legal_components: [accelerator, linkage, converter, secondary]
  # Forward-base services (§4.2, WP53): what a player-owned operational base offers, and at
  # what markup. The same Stardock commands resolve here through the shared service-point
  # seam. fee_frac ≥ 1 (never cheaper than Stardock); Tier III stays barter-only, so a base
  # stocks only I/II by default.
  services:
    repair: true
    components: true
    munitions: true
    banking: true
    fee_frac: 1.25            # frontier convenience markup over Stardock latinum prices
    component_stock_tiers: [I, II]
    # Base-hosted markets (WP78): a starbase sector's port is the base's trading post.
    # A player/corp owner skims this share of each outsider trade's value from the
    # port's purse into their bank — rent for holding the local market.
    trade_cut_frac: 0.05

# Discoveries (§7, WP5): the universe is salted at big bang with finds whose rarity
# (and value) rises with distance band. Hidden finds (wrecks/entities) need a sensor
# check on entry; nebulae interfere with that check. Rare+ finds yield artifact
# barter-goods (mapped to a component tier, §8); lesser finds give latinum/components.
discovery:
  sector_density: 0.20        # fraction of sectors salted with an open-space find (wreck/nebula/…)
  surface_site_chance: 0.5    # fraction of planets seeded with surface sites to explore (WP6)
  surface_sites_max: 3        # up to this many sites on a seeded planet (WP6)
  # Per-band rarity weights for a find's tier. Strongly separated so the mean-rarity gradient
  # rises monotonically Hub → Frontier → Deep → Void (the §5 step-8 validator asserts it).
  band_rarity_weights:
    Hub:      { COMMON: 80, UNCOMMON: 20 }
    Frontier: { COMMON: 25, UNCOMMON: 50, RARE: 25 }
    Deep:     { UNCOMMON: 20, RARE: 45, EXCEPTIONAL: 35 }
    Void:     { RARE: 15, EXCEPTIONAL: 45, LEGENDARY: 40 }
  tier_value:  { COMMON: 250, UNCOMMON: 1000, RARE: 4000, EXCEPTIONAL: 12000, LEGENDARY: 30000 }  # latinum a find of each tier is worth
  # Rare+ finds pay out as artifact barter-goods pegged to a component tier instead of latinum (§8).
  barter_equivalence: { RARE: II, EXCEPTIONAL: III, LEGENDARY: III }
  # Minimum effective sensor rating needed to detect a hidden find of each tier (rarer = harder).
  sensor_difficulty: { COMMON: 1, UNCOMMON: 2, RARE: 3, EXCEPTIONAL: 4, LEGENDARY: 5 }
  nebula_interference: 2      # sensor rating subtracted while inside a nebula sector (fog)
  # Relative weights for which *kind* of find is placed. `entity` is deliberately NOT here
  # (DESIGN §7, WP34): the singular roaming Entity is a roster species flagged `singular_entity`,
  # placed by the big bang — not a salted discovery object.
  space_kinds:   { wreck: 5, nebula: 2, black_hole: 1 }                 # open-space phenomena
  surface_kinds: { ruins: 4, artifact: 3, ancient_tech: 2, crashed_ship: 3 }  # planet-surface sites
  hidden_kinds: [wreck]   # kinds that need a sensor check to spot; the rest are plainly visible on entry
  # Kinds barred from sharing a sector with a port (a placement seam; empty ⇒ all may coexist).
  # Wormholes aren't listed here — they're force-placed on one-way edges, not rolled.
  port_incompatible_kinds: []
  component_pool: [accelerator, converter, radiator, secondary, turbine, burner, linkage, navigator]  # parts a find may drop
  salvage_turn_cost: 2            # turns to salvage a wreck
  scan_turn_cost: 1              # turns to run a sensor scan of the current sector
  surface_hidden_min_rank: 3      # surface sites of this rarity rank and up need a sensor sweep to reveal
  black_hole_gravity_warp: false  # Phase-3 hazard seam (black holes fling you off-course); inert in Phase 2
  black_hole_warp_turn_cost: 5    # extra turns a black-hole gravity warp will cost once that hazard is live

# Genesis torpedoes (§4.2, WP10): a Stardock device that terraforms a dead, unowned
# world (barren / asteroid belt / gas giant) into a colonizable terrestrial, ready to
# claim. A latinum sink at the high end of the economy.
genesis:
  device_id: genesis_torpedo   # the Stardock item id this rule applies to
  price: 15000                 # latinum cost of one Genesis torpedo (a high-end sink)
  result_type: terrestrial_warm  # what an eligible world is transformed into
  eligible_types: [barren, jovian, terrestrial_hot, terrestrial_cold]  # dead/marginal worlds a torpedo can terraform (asteroid belts have no surface to re-form)

# Citadels (§4.2, §14, WP54): cumulative planetary fortifications on an owned colony.
# Each level is paid up front (equipment from planet stores + latinum) and completed as a
# timed build — colonists accrue toward build_colonist_days on the planet-growth tick, so
# bigger colonies build faster. L1 = treasury + garrison bonus; L2 = the fixed gun that
# joins sector defense; L3 = a siege shield (no invasion while a base or the gun stands).
citadels:
  gun_min_level: 2
  shield_min_level: 3
  gun_hull: 400
  gun_shields: 200
  gun_damage: 40
  gun_defense: 30
  invasion_round_lo: 0.10        # per-round min fraction of the enemy's strength lost (BNT shape)
  invasion_round_hi: 0.35        # per-round max fraction
  civilian_survival_frac: 0.5    # fraction of colonists that survive a conquest
  invasion_alignment_penalty: 20 # alignment hit for a failed ground assault
  fighter_yield: 0.5             # garrison fighters minted per unit of the fighter allocation share
  levels:
    - { cost_equipment: 200, cost_latinum: 5000,  min_colonists: 100, build_colonist_days: 5000,  garrison_mult: 1.5 }  # L1
    - { cost_equipment: 400, cost_latinum: 12000, min_colonists: 300, build_colonist_days: 15000, garrison_mult: 2.0 }  # L2
    - { cost_equipment: 800, cost_latinum: 30000, min_colonists: 600, build_colonist_days: 40000, garrison_mult: 3.0 }  # L3

# Special devices (§10, §14, WP56): bought at the Stardock into the ship's device bay.
# A probe is consumable (flies up to probe_range hops charting its path); the interdictor
# is a toggled stance (turn_tax per day while engaged); the mine-deflector is passive
# (absorbs armid mines one-for-one on entry).
devices:
  probe:          { price: 500,   probe_range: 8, loss_chance: 0.25 }
  interdictor:    { price: 20000, turn_tax: 5 }
  mine_deflector: { price: 3000 }

# The starter hull — a Trailblazer-class explorer (§4). Its engine room is built
# "complete but minimal": every base slot filled at Tier I, every upgrade slot
# empty — the canonical first upgrade target (§4.1). The flat aspect scalars below
# are the NPC-fallback / cap values; the live aspects are derived from the slots.
starter_ship:
  id: trailblazer
  name: S.S. Wayfarer
  role: transport          # ship-class role (transport / fighter / warship / capital_warship / …)
  holds_total: 60          # cargo hold capacity, in commodity units
  turns_per_warp: 1        # base turn cost per warp (the engine room may derive a live value)
  shields_max: 100         # shield cap (aspect fallback/cap; live value derived from the screens slots)
  warp_speed: 3            # travel speed (fallback/cap; derived from the spindrive slots)
  combat_speed: 4          # evasion speed in combat (fallback/cap; derived from the thrusters slots)
  cloak_rating: 0          # stealth vs. enemy sensors (0 = none)
  sensor_rating: 2         # detection strength for hidden finds and cloaked foes
  hull_max: 100            # hull hit points before destruction (drops to the escape pod)
  colonist_capacity: 100   # colonists carried (a separate limit from cargo holds)
  passenger_capacity: 8           # ground recruits + suits carried (passenger berths, GW D3)
  # Engine room: the four slotted subsystems whose filled parts derive the live aspects above.
  # slot_count = total slots; keystone = the part whose loss disables the subsystem;
  # base_components = pre-filled at Tier I; legal_components = what may be slotted here.
  subsystems:
    spindrive:
      slot_count: 5
      keystone: navigator
      base_components: [navigator, turbine, accelerator]
      legal_components: [navigator, turbine, accelerator, converter, radiator]
    thrusters:
      slot_count: 4
      keystone: burner
      base_components: [burner, burner]
      legal_components: [burner, turbine, accelerator, radiator]
    screens:
      slot_count: 4
      keystone: secondary
      base_components: [secondary, accelerator]
      legal_components: [secondary, accelerator, converter, radiator]
    main_gun:
      slot_count: 5
      keystone: accelerator
      base_components: [accelerator, linkage]
      legal_components: [accelerator, linkage, converter, secondary]

# Stardock hardware emporium (§5, §8): which component kinds are stocked and at
# which tiers. Prices come from the economy block; Tier III is barter-only and is
# deliberately absent here.
hardware:
  components: [accelerator, converter, radiator, secondary, turbine, burner, linkage, navigator]  # component kinds Stardock sells
  tiers: [I, II]  # tiers offered for latinum here; Tier III is barter-only and intentionally absent

# Buyable hulls beyond the free starter (§4 v1 set; price band ~20k–150k rising
# with role, DESIGN §8). Each is an engine-room hull (the player ship is always
# slotted): bigger roles get more slots (upgrade headroom) and richer base loadouts.
# The flat aspect scalars are caps/fallbacks; live aspects derive from the slots.
# Per-hull extras: price (latinum to buy); armament (weapon ids from the `weapons`
# catalog, whose firing arcs drive §10 evasion); defenses ({type, value} damage
# mitigation); missiles (homing-missile magazine size). Fields carry the same
# meaning as in starter_ship above.
ship_classes:
  - id: scout_marauder
    name: Scout Marauder
    role: fighter
    holds_total: 30
    turns_per_warp: 1
    shields_max: 120
    warp_speed: 4
    combat_speed: 6
    cloak_rating: 1
    sensor_rating: 3
    hull_max: 80
    colonist_capacity: 50
    passenger_capacity: 6           # ground recruits + suits carried (passenger berths, GW D3)
    price: 20000
    armament: [nose_cannon]           # fast hull, forward gun — strafe it (§10)
    defenses: [{ type: speed_and_size, value: 2 }]
    missiles: 2
    subsystems:
      spindrive:
        slot_count: 6
        keystone: navigator
        base_components: [navigator, turbine, accelerator, accelerator]
        legal_components: [navigator, turbine, accelerator, converter, radiator]
      thrusters:
        slot_count: 6
        keystone: burner
        base_components: [burner, burner, burner]
        legal_components: [burner, turbine, accelerator, radiator]
      screens:
        slot_count: 3
        keystone: secondary
        base_components: [secondary]
        legal_components: [secondary, accelerator, converter, radiator]
      main_gun:
        slot_count: 5
        keystone: accelerator
        base_components: [accelerator, linkage]
        legal_components: [accelerator, linkage, converter, secondary]
  - id: missile_frigate
    name: Missile Frigate
    role: warship
    holds_total: 50
    turns_per_warp: 1
    shields_max: 200
    warp_speed: 3
    combat_speed: 4
    cloak_rating: 0
    sensor_rating: 2
    hull_max: 140
    colonist_capacity: 150
    passenger_capacity: 12          # ground recruits + suits carried (passenger berths, GW D3)
    price: 50000
    armament: [turret_array]
    defenses: [{ type: armour, value: 3 }]
    missiles: 6
    subsystems:
      spindrive:
        slot_count: 5
        keystone: navigator
        base_components: [navigator, turbine, accelerator]
        legal_components: [navigator, turbine, accelerator, converter, radiator]
      thrusters:
        slot_count: 5
        keystone: burner
        base_components: [burner, burner]
        legal_components: [burner, turbine, accelerator, radiator]
      screens:
        slot_count: 5
        keystone: secondary
        base_components: [secondary, accelerator, accelerator]
        legal_components: [secondary, accelerator, converter, radiator]
      main_gun:
        slot_count: 6
        keystone: accelerator
        base_components: [accelerator, linkage, linkage]
        legal_components: [accelerator, linkage, converter, secondary]
  - id: battleship
    name: BattleShip
    role: capital_warship
    holds_total: 80
    turns_per_warp: 1
    shields_max: 300
    warp_speed: 3
    combat_speed: 4
    cloak_rating: 0
    sensor_rating: 2
    hull_max: 250
    colonist_capacity: 300
    passenger_capacity: 24          # ground recruits + suits carried (passenger berths, GW D3)
    price: 100000
    armament: [heavy_lance, light_blaster]
    defenses: [{ type: armour, value: 5 }, { type: energy_plates, value: 3 }]
    missiles: 4
    subsystems:
      spindrive:
        slot_count: 6
        keystone: navigator
        base_components: [navigator, turbine, accelerator]
        legal_components: [navigator, turbine, accelerator, converter, radiator]
      thrusters:
        slot_count: 6
        keystone: burner
        base_components: [burner, burner]
        legal_components: [burner, turbine, accelerator, radiator]
      screens:
        slot_count: 6
        keystone: secondary
        base_components: [secondary, accelerator, accelerator, accelerator]
        legal_components: [secondary, accelerator, converter, radiator]
      main_gun:
        slot_count: 7
        keystone: accelerator
        base_components: [accelerator, linkage, accelerator]
        legal_components: [accelerator, linkage, converter, secondary]
  - id: imperial_starship
    name: Imperial StarShip
    role: capital_warship
    holds_total: 120
    turns_per_warp: 1
    shields_max: 400
    warp_speed: 4
    combat_speed: 6
    cloak_rating: 0
    sensor_rating: 3
    hull_max: 350
    colonist_capacity: 500
    passenger_capacity: 30          # ground recruits + suits carried (passenger berths, GW D3)
    price: 150000
    armament: [spinal_railgun, turret_array]
    defenses: [{ type: screens, value: 4 }, { type: armour, value: 4 }]
    missiles: 8
    subsystems:
      spindrive:
        slot_count: 7
        keystone: navigator
        base_components: [navigator, turbine, accelerator, accelerator]
        legal_components: [navigator, turbine, accelerator, converter, radiator]
      thrusters:
        slot_count: 6
        keystone: burner
        base_components: [burner, burner, burner]
        legal_components: [burner, turbine, accelerator, radiator]
      screens:
        slot_count: 7
        keystone: secondary
        base_components: [secondary, accelerator, accelerator, accelerator, accelerator]
        legal_components: [secondary, accelerator, converter, radiator]
      main_gun:
        slot_count: 8
        keystone: accelerator
        base_components: [accelerator, linkage, accelerator, linkage]
        legal_components: [accelerator, linkage, converter, secondary]
  # The escape pod (§10, WP26): issued when the player's hull reaches 0 — ship,
  # cargo, and stores are lost; the pod limps home. price 0 ⇒ never sold, and the
  # shipyard listing skips unpriced hulls. Minimal single-slot engine room so the
  # player screens keep working; a vestigial gun and 1-warp drive — it limps.
  - id: escape_pod
    name: Escape Pod
    role: transport
    holds_total: 2
    turns_per_warp: 2
    shields_max: 10
    warp_speed: 1
    combat_speed: 1
    cloak_rating: 0
    sensor_rating: 1
    hull_max: 20
    colonist_capacity: 0
    passenger_capacity: 0
    price: 0
    subsystems:
      spindrive:
        slot_count: 1
        keystone: navigator
        base_components: [navigator]
        legal_components: [navigator]
      thrusters:
        slot_count: 1
        keystone: burner
        base_components: [burner]
        legal_components: [burner]
      screens:
        slot_count: 1
        keystone: secondary
        base_components: [secondary]
        legal_components: [secondary]
      main_gun:
        slot_count: 1
        keystone: accelerator
        base_components: [accelerator]
        legal_components: [accelerator]

  # Orbital starbase (§4.2): an immobile set-piece emplacement. Its live subsystems are
  # generated from `starbase.subsystems`; these flat scalars are the class stats the
  # WP40 assault foe scales by surviving-component integrity. Never sold (price 0).
  - id: orbital_platform
    name: Orbital Platform
    role: starbase
    holds_total: 0
    turns_per_warp: 1
    shields_max: 250
    warp_speed: 0
    combat_speed: 0
    cloak_rating: 0
    sensor_rating: 3
    hull_max: 400
    colonist_capacity: 0
    passenger_capacity: 0
    price: 0
    armament: [turret_array]        # all-round emplacement — no arc to slip (§10)
    defenses: [{ type: armour, value: 4 }, { type: screens, value: 3 }]
