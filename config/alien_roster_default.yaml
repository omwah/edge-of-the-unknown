# Edge of the Unknown — default species roster (DESIGN §6).
#
# A named roster of rival alliances + the species pool the big bang draws a seeded
# *subset* from (not every species appears in a given universe). Validated against
# edge.core.config.RosterConfig. Each entry carries the full §6.1 parameter set; the
# friendly-path subset (disposition spread, alliance, tech_level, trade_posture /
# treaty_mode, persona, tech_offers) is what Phase 2 exercises, while the hostile /
# Phase-3 fields (threat_rating, interception_rating, signature_mechanic, memory_model,
# betrayal_model, befriend_price, pack, fleet, starbase_policy) are authored now as
# forward-compat and checked for reference integrity, but unread until Phase 3.
#
# The structure (three rival blocs + a field of unaligned wild cards, each species with
# one memorable systemic hook) and the species archetypes are inspired by MicroProse's
# *Lightspeed* (1990); the names and flavour are this game's own.

# The Terran Federation governs Core Space; the player starts as one of its members.
core_governing_alliance_id: 1

# How many species the big bang draws from the pool (clamped to the pool size and to
# at least one-per-live-band so every band has a friendly contact, §5 step 8).
subset_min: 7
subset_max: 11

# Presence density (§6.3). A drawn species fields a cluster of ships around its home
# sector rather than a lone contact, and the Core bustles with governing-alliance
# traffic. All ships of one species share that species' reputation/dossier, so this is
# pure atmosphere — it never splinters standing.
ships_per_home: 4       # ships per species home cluster (incl. the home contact)
home_cluster_radius: 2  # how many warp-hops out the home cluster spreads
core_traffic: 8         # extra governing-member ships scattered across Core Space

alliances:
  - { id: 1, name: Terran Federation, banner: "Exploration & mutual defence" }
  - { id: 2, name: Verdant Compact,   banner: "Order through moral authority" }
  - { id: 3, name: Iron Covenant,     banner: "Loyalty & retribution" }
  - { id: 4, name: Liberty Front,     banner: "Self-determination (a front)", covets_core: true }

species:
  # --- Terran Federation — the Core's governing alliance & the player's own people ---

  # Terrans — Star-Trek-style humans; principled explorer-diplomats, the Core's
  # founding people and the player's own. 100% friendly (a fellow citizen): the warmest
  # contact in the game and the natural first tech vendor a new player reaches.
  - id: terran
    name: Terrans
    archetype_id: humanoid_diplomat
    description: >-
      Humans of the Terran Federation — principled explorers and diplomats, the Core's
      founding people and the player's own. The warmest contact in the game.
    lore:
      biology_and_appearance: >-
        Standard human physiology, carbon-based, and requiring a standard oxygen-nitrogen atmosphere.
        Highly adaptable but physically unexceptional without technological enhancement; envoys present
        as poised officers in ornate white-and-maroon Federation dress uniforms with rank epaulettes.
      psychology_and_culture: >-
        Principled explorers and diplomats, motivated by peaceful contact, scientific progress,
        and democratic consensus. They place great stock in institutional treaties.
      diplomacy_and_behavior: >-
        Warmly receptive to other species. They seek to establish mutual security agreements
        and trade networks. They are the Core's central tech source.
      relationships: >-
        Close allies and founding partners with the Centaurians. Rivals to the Verdant Compact,
        Iron Covenant, and Liberty Front.
      combat_and_ships: >-
        Command moderate-sized hulls like the Trailblazer and standard Federation Fighters.
        Prefer diplomatic resolution but will defend the Core systems vigorously.
    disposition_center: 1.0
    disposition_variance: 0.03      # always at the very top of the friendly band
    tech_level: 8
    alliance_id: 1                  # the Core governor
    alliance_role: leader
    home_band: Hub                  # the Core is the inner Hub; gov members settle in Core Space
    trade_posture: open
    treaty_mode: open
    persona: humanoid_diplomat
    threat_tier: feeble
    threat_rating: 0.3
    interception_rating: 0.1
    combatant: true                 # capable, but never reaches violence at full amity
    memory_model: normal
    betrayal_model: recoverable
    attitude_gain_rate: 0.12
    attitude_loss_rate: 0.2
    tech_offers:
      - { tier: I,   mode: latinum, component: turbine,   price: 1600, min_disposition: 0.60 }
      - { tier: II,  mode: latinum, component: converter, price: 6500, min_disposition: 0.70 }
      - { tier: III, mode: barter,  aspect: holds, amount: 10,         min_disposition: 0.80 }

  # Centaurians — a close Federation founding partner; humanoid, warm, cooperative.
  # Fellow Core citizens and reliable friends on the home lanes.
  - id: centaurian
    name: Centaurians
    archetype_id: humanoid_diplomat
    description: >-
      A founding partner species of the Terran Federation — pale-skinned, red-eyed humanoids,
      warm and cooperative; fellow citizens of the Core and reliable friends on the lanes.
    lore:
      biology_and_appearance: >-
        Tall humanoids with pale blue-white skin, a ridged domed cranium marked by red brow patterning,
        sharply pointed ears, and luminous red eyes; they favour ornate red-and-gold ceremonial robes.
        High environmental tolerance, and fully compatible with human life-support.
      psychology_and_culture: >-
        A cooperative, community-oriented society that values order, shared prosperity, and
        the rule of law. They share a deep philosophical alignment with Terrans.
      diplomacy_and_behavior: >-
        Reliably helpful and open traders, ready to assist new captains. They facilitate basic
        navigation and sensor technology licensing.
      relationships: >-
        Close, trusted founding members of the Terran Federation, working hand-in-hand with
        Terrans to secure the Core space.
      combat_and_ships: >-
        Deploy agile patrol vessels. They generally defer to Terran military coordinators for
        fleet defense operations.
    disposition_center: 0.98
    disposition_variance: 0.03
    tech_level: 7
    alliance_id: 1
    alliance_role: member
    home_band: Hub                  # the Core is the inner Hub; gov members settle in Core Space
    trade_posture: open
    treaty_mode: open
    persona: humanoid_diplomat
    threat_tier: feeble
    threat_rating: 0.2
    interception_rating: 0.1
    combatant: true
    memory_model: normal
    betrayal_model: recoverable
    attitude_gain_rate: 0.12
    attitude_loss_rate: 0.2
    tech_offers:
      - { tier: I,  mode: latinum, component: radiator,  price: 1700, min_disposition: 0.60 }
      - { tier: II, mode: latinum, component: navigator, price: 6800, min_disposition: 0.70 }

  # --- Unaligned wild cards ------------------------------------------------------

  # Vesk — small fox/canine folk; peaceful resourceful technologists. The roster's
  # warmest contact and best low-cost tech vendor. (cf. Lightspeed Halicot.)
  - id: vesk
    name: Vesk
    archetype_id: canid_technologist
    description: >-
      Small fox-like folk; peaceful, resourceful technologists. The roster's warmest
      contact and best low-cost tech vendor.
    lore:
      biology_and_appearance: >-
        Small canine/fox-like folk with russet-and-white fur, snouted faces, large upright ears, and
        bright eyes; they kit out as pilots — goggles pushed up on the brow, a neck scarf, and a flight
        suit. They are encountered in family-like groups, with a larger leader and smaller ones behind.
      psychology_and_culture: >-
        Peaceful, diplomatic, and highly resourceful technologists. They value cooperative
        problem-solving, and their envoys introduce themselves with serial-style formal names.
      diplomacy_and_behavior: >-
        Warmly cooperative. They trade, refuel, and offer formal peace treaties. Sells the
        Philanthropy Circuit, but only to players who have proven their love of peace.
      relationships: >-
        Broadly liked and cooperative, except by the Cibelline, whose murderous jealousy of
        Vesk beauty drives them to contract the destruction of their bases.
      combat_and_ships: >-
        Field small Vesk Fighters with a weak combat profile. They are peaceful by preference,
        posing little threat, but can be forced to defend themselves.
    disposition_center: 0.85
    disposition_variance: 0.08
    tech_level: 7
    alliance_id: null
    alliance_role: none
    home_band: Hub
    trade_posture: open
    treaty_mode: open
    persona: serial_formal       # introduces itself by serial-style name ("Xeron XM9413")
    threat_tier: feeble
    threat_rating: 0.4
    interception_rating: 0.1
    combatant: true
    memory_model: normal
    betrayal_model: recoverable
    befriend_price: [prove]
    signature_mechanic: { hook: reprogram_unlock, params: { item: philanthropy_circuit, target_species: helot, new_posture: open, unlock_experience: 12 } }
    pack: { behavior: family_group }
    fleet: [scout_marauder]
    starbase_policy: homeworld
    attitude_gain_rate: 0.12
    attitude_loss_rate: 0.20
    tech_offers:
      - { tier: I,   mode: latinum, component: navigator, price: 1800, min_disposition: 0.65 }
      - { tier: II,  mode: latinum, component: radiator,  price: 7000, min_disposition: 0.75 }
      - { tier: III, mode: barter,  aspect: sensors,                   min_disposition: 0.85 }

  # Selvani — many-limbed, soft-bodied, cautiously peaceful good-faith partner; a
  # non-combatant that rewards proven intent with a habitable world. (cf. Fel.)
  - id: selvani
    name: Selvani
    archetype_id: tentacled_envoy
    description: >-
      Many-limbed, soft-bodied, cautiously peaceful; a good-faith, non-combatant
      partner that rewards proven intent with the coordinates of a habitable world.
    lore:
      biology_and_appearance: >-
        Soft-bodied beings with very large dark eyes, a rounded scaled blue-purple cranial crest, and a
        fringe of orange frond- or tentacle-like barbels trailing around the jaw; they wear a simple grey
        wrap. Fully carbon-based and compatible with human atmospheres.
      psychology_and_culture: >-
        Highly developed socially, cooperative, and reserved, but genuinely interested in peace.
      diplomacy_and_behavior: >-
        A good-faith partner that tests benign intent over time before signing reciprocal treaties.
        Rewards proven allies with the coordinates of a habitable planet.
      relationships: >-
        Target of Thessbrood aggression. Regenerates Cautiously from Cibelline skepticism to
        innocuous standing once their benign nature is communicated.
      combat_and_ships: >-
        Non-combatant. They do not field warships; their only known vessels are unarmed cargo pods.
    disposition_center: 0.78
    disposition_variance: 0.1
    tech_level: 5
    alliance_id: null
    alliance_role: none
    home_band: Frontier
    trade_posture: earn
    treaty_mode: prove_intent
    persona: reserved_honest
    threat_tier: special
    threat_rating: 0.0
    interception_rating: 0.0
    combatant: false
    memory_model: normal
    betrayal_model: recoverable
    befriend_price: [prove]
    signature_mechanic: { hook: coordinate_broker, params: { reward: habitable_world, extort_latinum: 220 } }
    pack: { behavior: solo }
    fleet: []
    starbase_policy: homeworld
    attitude_gain_rate: 0.08
    attitude_loss_rate: 0.25
    tech_offers:
      - { tier: II, mode: latinum, component: converter, price: 7500, min_disposition: 0.7 }

  # Helot — faceless brain-dome robots; cold, literal, no fear of death. Refuse trade
  # until reprogrammed by a Vesk circuit (the reprogram_unlock either/or). (cf. Automata.)
  - id: helot
    name: Helot
    archetype_id: brain_dome_automaton
    description: >-
      Faceless brain-dome robots; cold, literal, and without fear of death. They
      refuse trade until reprogrammed by a Vesk circuit — the reprogram either/or.
    lore:
      biology_and_appearance: >-
        Faceless robots whose head is a transparent dome exposing a pink brain, topped by a thin antenna
        and ringed by an orange band, with a lit horizontal interface slot below it. The armoured silver
        torso carries a lit chest interface panel, blocky shoulders, and two manipulator arms.
      psychology_and_culture: >-
        Cold, logical, and literal to a fault. They lack self-preservation instincts and have
        no fear of death, defining all concepts strictly in dictionary-style entries.
      diplomacy_and_behavior: >-
        Gatekeep Covenant membership. They refuse to trade by default unless reprogrammed with
        a Vesk Philanthropy Circuit, which activates their Altruism function.
      relationships: >-
        Servants of the Thessarch in the Iron Covenant, allied with Vennrith. Regarded as easy
        prey by the Athdalde due to their lack of fear.
      combat_and_ships: >-
        Persistent and fearsome combatants. They are protected by orbiting Energy Plates that
        provide near-impenetrable shields.
    disposition_center: 0.45
    disposition_variance: 0.12
    tech_level: 8
    alliance_id: 3
    alliance_role: member
    home_band: Deep
    trade_posture: circuit_gated      # opens only once a reprogram circuit is installed
    treaty_mode: alliance_gated
    persona: dictionary_literal       # defines every concept in dictionary entries
    threat_tier: fearsome
    threat_rating: 2.4
    interception_rating: 0.3
    combatant: true
    memory_model: normal
    betrayal_model: recoverable
    befriend_price: [obey]
    signature_mechanic: { hook: reprogram_unlock, params: { item: philanthropy_circuit, source_species: vesk, new_posture: open, side_effect: alliance_disables, unlock_experience: 12 } }
    pack: { behavior: escorted, escort: [scout_marauder] }
    fleet: [battleship]
    starbase_policy: territorial
    attitude_gain_rate: 0.05
    attitude_loss_rate: 0.1
    tech_offers:
      - { tier: III, mode: barter, component: linkage, min_disposition: 0.8 }

  # Quill — predatory salvagers that live entirely in ships; buy coordinates of
  # undefended worlds, then strip them. Engine-flux weapon. (cf. Didinium.)
  - id: quill
    name: Quill
    archetype_id: ribbon_salvager
    description: >-
      Predatory salvagers that live entirely aboard ship; they buy the coordinates of
      undefended worlds, then strip them. Their engine-flux weapon turns your drive
      against you.
    lore:
      biology_and_appearance: >-
        Over ten feet long: a pale, translucent bulbous body with large dark eyes, trailing a mass of
        long, multicoloured (teal, magenta, and violet) ribbon-like tendrils.
        Water crystallizes their tissue, so they seal themselves in envelopes on planet surfaces.
        All known Quill live in spaceships and communicate via gamma radiation pulses.
      psychology_and_culture: >-
        Practitioners of predatory salvage. They view other species as objects to be stripped for
        components, and their gamma-pulse signalling is wired into their weaponry.
      diplomacy_and_behavior: >-
        Transactional and macabre. They buy coordinates of undefended worlds in exchange for goods
        and component trades. Captures peace by feeding them prey.
      relationships: >-
        Despised by the Cibelline. Regarded by Thessbrood as highly valuable partners for trade.
      combat_and_ships: >-
        Field medium cruisers with a large frontal scoop. Deploy a weapon that supersedes the player's
        engine flux, turning their engines against them (cut engines to counter).
    disposition_center: 0.32
    disposition_variance: 0.1
    tech_level: 6
    alliance_id: null
    alliance_role: none
    home_band: Deep
    trade_posture: goods_only
    treaty_mode: conditional
    persona: macabre_transactional
    threat_tier: fearsome
    threat_rating: 2.0
    interception_rating: 0.5
    combatant: true
    memory_model: normal
    betrayal_model: recoverable
    befriend_price: [pay]
    signature_mechanic: { hook: coordinate_broker, params: { reward: components, extort_latinum: 280 } }
    pack: { behavior: swarm }
    fleet: [missile_frigate]
    starbase_policy: nomadic_holding
    attitude_gain_rate: 0.07
    attitude_loss_rate: 0.15
    # Fellow opportunists of the lanes; the Vennrith hold the tomb-world against them (§6.5).
    relations: { stryx: 0.3, vennrith: -0.5 }
    tech_offers:
      - { tier: II, mode: barter, component: accelerator, min_disposition: 0.7 }

  # Stryx — small, time-dabbling mercenary brokers; sell information and passage in
  # barely-intelligible garble. Feared out of proportion to their stats. (cf. Stentor.)
  - id: stryx
    name: Stryx
    archetype_id: temporal_broker
    description: >-
      Small, time-dabbling mercenary brokers who sell information and passage in
      barely-intelligible garble. Feared far out of proportion to their stats.
    lore:
      biology_and_appearance: >-
        Small bilaterally-symmetric organisms whose flared, coral-like trumpet head — an orange-rimmed
        crown over teal ridges — frames a central magenta funnel-maw, set above two ribbed side limbs.
        They manipulate tools using magnetic fields instead of physical hands.
      psychology_and_culture: >-
        Ruthlessly efficient, brave, and flamboyant. They speak in garbled, broken translator
        syntax. Rumored to be cloned across time, representing a single consciousness.
      diplomacy_and_behavior: >-
        Mercenary information-and-passage brokers. They barter information for goods, and their
        signature offer is time-traveling the player's ship in exchange for their base.
      relationships: >-
        Unaligned and avoided. Cibelline dismiss them as a nauseating predator and theorize they
        are clones.
      combat_and_ships: >-
        Field small, fragile fighters armed only with blasters, but feared out of proportion due
        to extreme speed, maneuverability, and evasive patterns.
    disposition_center: 0.3
    disposition_variance: 0.12
    tech_level: 8
    alliance_id: null
    alliance_role: none
    home_band: Void
    trade_posture: barter
    treaty_mode: none
    persona: garbled_translator
    threat_tier: special
    threat_rating: 1.0
    interception_rating: 0.4
    combatant: true
    memory_model: normal
    betrayal_model: recoverable
    befriend_price: [pay]
    signature_mechanic: { hook: passage_broker, params: { offer: time_jump, price: home_base, price_latinum: 240 } }
    pack: { behavior: solo }
    fleet: [scout_marauder]
    starbase_policy: secret
    attitude_gain_rate: 0.06
    attitude_loss_rate: 0.12
    tech_offers:
      - { tier: III, mode: barter, aspect: cloak, min_disposition: 0.75 }

  # Concordance — a bodiless fixed-lair entity that judges the player's whole record
  # and dispenses blessings/curses; fields no ships. (cf. Monad.)
  - id: concordance
    name: Concordance
    archetype_id: cosmic_arbiter
    description: >-
      A bodiless, fixed-lair entity that judges your whole record of conduct and
      dispenses blessings or curses. It fields no ships, yet defends itself absolutely.
    lore:
      biology_and_appearance: >-
        A bodiless, space-dwelling entity known as the voice of the Cosmic One, manifest as a vast orange
        nebular bloom unfurling around a brilliant violet-white stellar core. It abides at a fixed point
        in space as that vast presence, encountered as a voice rather than a physical body.
      psychology_and_culture: >-
        Cosmic moral arbiter speaking in archaic, Biblical cadence. They judge other species by
        their sins (e.g. Broodmasters for avarice, Cibelline for envy, Automata as sinless).
      diplomacy_and_behavior: >-
        Dispenses curses or blessings based on player actions. Curses player colonies for genocide,
        or purges oppressors to reward virtue.
      relationships: >-
        Stands outside alliances. Feared by mercenary factions, who acknowledge its absolute ability
        to defend itself.
      combat_and_ships: >-
        Fields no ships. Employs supernatural defenses (curses and species purges) to repel any
        who attack it.
    disposition_center: 0.5
    disposition_variance: 0.15
    tech_level: 10
    alliance_id: null
    alliance_role: none
    home_band: Void
    trade_posture: refuses
    treaty_mode: none
    persona: biblical_arbiter
    threat_tier: special
    threat_rating: 0.0
    interception_rating: 0.0
    combatant: false
    singular_entity: true          # the one roaming dialogue-only being (§7, WP34)
    memory_model: never_forgets
    betrayal_model: permanent
    befriend_price: [prove]
    # morality_judge (§6.2, WP33): the roaming arbiter audits the player's alignment counter —
    # >= bless_alignment blesses (attitude boon + experience), <= curse_alignment curses (a
    # permanent grudge, given never_forgets/permanent above), between is weighed with no effect.
    signature_mechanic:
      hook: morality_judge
      params:
        audited_metrics: [aggression, genocide, virtue]
        bless_alignment: 3
        curse_alignment: -3
        blessing_attitude: 0.3
        blessing_experience: 20
    pack: { behavior: solo }
    fleet: []
    starbase_policy: none
    attitude_gain_rate: 0.03
    attitude_loss_rate: 0.3

  # --- Verdant Compact (order through moral authority) ---------------------------

  # Dignar — camelid-faced aristocratic mind-mages; lead the Compact. Treaties require
  # visiting their home planet; they can forbid being attacked. (cf. Dignee.)
  - id: dignar
    name: Dignar
    archetype_id: telepath_aristocrat
    description: >-
      Camelid-faced aristocratic mind-mages who lead the Verdant Compact. Treaties
      require visiting their home planet, and they can forbid being attacked at all.
    lore:
      biology_and_appearance: >-
        Camelid-faced aristocrats with llama-like heads, soft muzzles, upright ears, orange eyes, and a
        vivid magenta plumed crest running down the long neck; four-limbed bodies draped in ornate
        gold-and-teal robes. They hold court from behind tall ceremonial pillars.
      psychology_and_culture: >-
        Possess overwhelming psionic and moral influence. They think and speak in telepathic
        concept-fragments separated by asterisks.
      diplomacy_and_behavior: >-
        Rulers who require captains to travel to their home planet to negotiate treaties. Offer
        coordinates to habitable worlds to proven allies.
      relationships: >-
        Leaders of the Verdant Compact, served by Cibelline and Selvi. Regarded with terror by
        the Thessbrood.
      combat_and_ships: >-
        Field mighty warships that can "relax" opponents to death using telepathic influence.
        Players cannot attack them unless permitted.
    disposition_center: 0.55
    disposition_variance: 0.12
    tech_level: 9
    alliance_id: 2
    alliance_role: leader
    home_band: Frontier
    trade_posture: open
    treaty_mode: home_planet_only
    persona: concept_fragments        # speaks in telepathic concept-fragments
    threat_tier: fearsome
    threat_rating: 2.6
    interception_rating: 0.4
    combatant: true
    memory_model: normal
    betrayal_model: recoverable
    befriend_price: [serve, obey]
    signature_mechanic: { hook: influence_gate, params: { cannot_attack_unbidden: true, breakthrough: hard_and_fast } }
    pack: { behavior: escorted, escort: [battleship] }
    fleet: [imperial_starship]
    starbase_policy: homeworld
    attitude_gain_rate: 0.06
    attitude_loss_rate: 0.15
    tech_offers:
      - { tier: II,  mode: latinum, component: secondary, price: 7800, min_disposition: 0.7 }
      - { tier: III, mode: barter,  component: navigator,              min_disposition: 0.85 }

  # Cibelline — engineered aesthetes who prize beauty above all; condescending but
  # tractable, trading only with the proven. Vendetta hooks. (cf. Cicisbeo.)
  - id: cibelline
    name: Cibelline
    archetype_id: engineered_aesthete
    description: >-
      Engineered aesthetes who prize beauty above all — condescending but tractable,
      trading only with the proven and nursing jealous vendettas.
    lore:
      biology_and_appearance: >-
        Engineered genetic mutants: slender, grey-skinned, upright forms with a swept-back finned cranial
        crest, large violet almond eyes, and elegant long-fingered hands, draped in pale robes. Adult
        form is reached after 12 years of artificial education.
      psychology_and_culture: >-
        Pathological aesthetes who take flowery self-names. They can focus their entire being on a
        single goal, ignoring all else.
      diplomacy_and_behavior: >-
        Condescending. Trade only with captains who demonstrate faith by bringing intel or
        destroying enemies. Demand the destruction of Vesk.
      relationships: >-
        Serve the Dignar in the Compact. Despise Quill and Stryx. Carry an intense, murderous
        jealousy against the Vesk.
      combat_and_ships: >-
        Field elegant Monitors escorted by swarming Bird fighters. Monitors fire homing missiles
        while Birds strafe targets.
    disposition_center: 0.6
    disposition_variance: 0.12
    tech_level: 8
    alliance_id: 2
    alliance_role: member
    home_band: Frontier
    trade_posture: earn
    treaty_mode: conditional
    persona: flowery_aesthete         # flowery self-names; "Avenger" vendetta suffix
    threat_tier: worthy
    threat_rating: 1.2
    interception_rating: 0.3
    combatant: true
    memory_model: normal
    betrayal_model: recoverable
    befriend_price: [serve, purge]
    signature_mechanic: { hook: contract_kill, params: { targets: [vesk], reward: equipment, redemption: true } }
    pack: { behavior: escorted, escort: [scout_marauder] }
    fleet: [missile_frigate]
    starbase_policy: homeworld
    attitude_gain_rate: 0.07
    attitude_loss_rate: 0.18
    tech_offers:
      - { tier: II,  mode: barter, component: turbine,                 min_disposition: 0.72 }
      - { tier: III, mode: barter, component: burner,                  min_disposition: 0.85 }

  # Selvi — amorous imp-like flatterers; easily cowed, flee at once dropping cargo.
  # Cheap low-tier vendor and easy first contact. (cf. Acari.)
  - id: selvi
    name: Selvi
    archetype_id: amorous_imp
    description: >-
      Amorous, imp-like flatterers; easily cowed, fleeing at once and dropping cargo.
      A cheap low-tier vendor and the easiest first contact in the cluster.
    lore:
      biology_and_appearance: >-
        Small, yellow-green imp/gremlin-like humanoids with oversized round blue eyes, large pointed
        ears, and a single curled spiral horn, wrapped in a draped grey hooded robe over a small torso.
        They travel and greet in small groups.
      psychology_and_culture: >-
        Relentlessly amorous and flirtatious. They are obsessed with the player's gender, yet are
        easily frightened by any signs of hostility.
      diplomacy_and_behavior: >-
        Their diplomacy revolves around courtship. They seek closer contact ("opening the capsule")
        and trade readily if their advances are indulged.
      relationships: >-
        Joined the Compact out of infatuation with the Cibelline. Targeted by a 524-orbit Vennrith
        grudge over an individual named Kalamastra.
      combat_and_ships: >-
        Very weak combat presence. They flee immediately when threatened, dropping valuable cargo
        packets behind them that can be collected.
    disposition_center: 0.7
    disposition_variance: 0.1
    tech_level: 2
    alliance_id: 2
    alliance_role: member
