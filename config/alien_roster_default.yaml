  # --- Liberty Front (self-determination — a front for conquest) -----------------

  # Thessbrood — colonial brain-sac masters attended by insect broodlings; lead the
  # Front. Oily servility masking conquest; plant TDX bombs in goods. (cf. Broodmasters.)
  - id: thessbrood
    name: Thessbrood
    archetype_id: colonial_broodmaster
    description: >-
      Colonial brain-sac masters attended by insect broodlings; they lead the Liberty
      Front behind oily servility, and plant hidden bombs in goods given to the distrusted.
    lore:
      biology_and_appearance: >-
        Colonial organism: a large dark master sac holding the main brain, its glowing orange core
        trailing a tangle of magenta tendrils across the ground, attended at all times by small luminous
        winged insectoid broodlings that groom it. The master sac is normally housed in a plinth.
      psychology_and_culture: >-
        Highly territorial colonizers and cowards. Address players in oily servile language to mask
        their aggression and expansionist plotting.
      diplomacy_and_behavior: >-
        Recruit captains to destroy Verdant Compact and Iron Covenant bases. Withhold treaties until service is rendered.
        Distrustful, planting TDX bombs in goods given to players.
      relationships: >-
        Lead the Liberty Front, with Dacaran as junior partners. Despise Dignar and Thessarch. Target
        of a Vennrith grudge.
      combat_and_ships: >-
        Slow and unmaneuverable warships firing powerful neutron-spark broadsides. cruisers and battleships
        add heavy armor and screen generators.
    disposition_center: 0.3
    disposition_variance: 0.1
    tech_level: 9
    alliance_id: 4
    alliance_role: leader
    home_band: Frontier
