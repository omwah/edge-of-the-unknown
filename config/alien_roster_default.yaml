  # --- Iron Covenant (loyalty & retribution) -------------------------------------

  # Vennrith — horned grudge-keepers; the Covenant's fierce backbone. Never forgive,
  # never forget; one betrayal is permanent. Escalating demands. (cf. Venge.)
  - id: vennrith
    name: Vennrith
    archetype_id: horned_grudgekeeper
    description: >-
      Horned grudge-keepers, the Iron Covenant's fierce backbone. They never forgive
      and never forget; one betrayal is permanent, and friendship means escalating demands.
    lore:
      biology_and_appearance: >-
        Heavy, grey-skinned warriors with a smooth domed cranium, back-swept temple horns, burning
        orange-red eyes, and a fanged scowl, set on heavy speckled bodies. They hold court behind
        redoubts hung with skull-trophies and captives.
      psychology_and_culture: >-
        Defined entirely by vindictiveness and retribution. They speak in inverted Yoda-like syntax,
        nursing grudges for centuries, and never forgive a betrayal.
      diplomacy_and_behavior: >-
        Requires Covenant membership. Once befriended, they subject captains to escalating demands
        (donations, destroying enemies). Failing a demand triggers permanent hatred.
      relationships: >-
        Loyal backbone of the Covenant under Thessarch. Deeply hate Thessbrood (16-orbit grudge) and
        Selvi (524-orbit Kalamastra grudge).
      combat_and_ships: >-
        Fearsome combatants fielding large, powerful warships that drive aggressively at targets.
        Can be cowed by a show of force.
    disposition_center: 0.3
    disposition_variance: 0.1
    tech_level: 7
    alliance_id: 3
    alliance_role: member
    home_band: Deep
    trade_posture: alliance_gated
    treaty_mode: alliance_gated
    persona: inverted_syntax          # inverted, Yoda-like phrasing
    threat_tier: fearsome
    threat_rating: 3.0
    interception_rating: 0.5
    combatant: true
    memory_model: never_forgets
    betrayal_model: permanent
    befriend_price: [obey, pay, purge]
    signature_mechanic: { hook: escalating_demand, params: { demand_ladder: [donate, destroy_target, surrender_base], fail_consequence: permanent_hatred, step_attitude: 0.05, satisfied_attitude: 0.3, satisfied_experience: 20 } }
    pack: { behavior: escorted, escort: [battleship] }
    fleet: [imperial_starship]
    starbase_policy: territorial
    attitude_gain_rate: 0.05
    attitude_loss_rate: 0.4
    # Inter-species stance + authored grudges (§6.4/§6.5 — schema WP27, semantics WP39).
    relations: { quill: -0.8, stryx: -0.3 }
    grudges:
      - { target: quill, cause: "the stripping of a Covenant tomb-world", severity: 0.6, duration_days: -1 }

  # Thessarch — psionic big-brain rulers; gatekeep Covenant membership. (cf. Jot.)
  - id: thessarch
    name: Thessarch
    archetype_id: psionic_overlord
    description: >-
      Psionic "big-brain" rulers who gatekeep Iron Covenant membership; nothing joins
      the bloc without their consent.
    lore:
      biology_and_appearance: >-
        Psionic "big-brain" beings with an enormous pale, segmented cranium dome housing psychic power,
        huge dark almond eyes, and a small, spindly body with slight appendages.
      psychology_and_culture: >-
        Authoritarian rulers who command with an iron claw and demand absolute obedience.
      diplomacy_and_behavior: >-
        Gatekeepers of the Iron Covenant. Compel binding fealty; allying with them binds the player
        to no-attack rules. Voiding rules immediately breaks alliance.
      relationships:
        Rule the Covenant over Vennrith and Helot. Opposed to the Liberty Front and Verdant Compact. Dismissed
        by Cibelline as terminally dull.
      combat_and_ships: >-
        Deploy massive Dtri Battlecruisers, among the largest and most powerful capital warships in
        the galaxy.
    disposition_center: 0.4
    disposition_variance: 0.12
    tech_level: 9
    alliance_id: 3
    alliance_role: leader
    home_band: Void
