  # Dacaran — winged horned "allies of convenience" scheming to usurp the Front's
  # leadership; probe loyalty, refuse trade. (cf. Dacian.)
  - id: dacaran
    name: Dacaran
    archetype_id: winged_schemer
    description: >-
      Winged, horned "allies of convenience" scheming to usurp the Liberty Front's
      leadership. They probe your loyalty and refuse to trade.
    lore:
      biology_and_appearance: >-
        Imposing grey demon-archetype humanoid with large curved horns, broad bat-like violet wings,
        burning red eyes, and a fanged scowl over a heavily muscled torso draped with a magenta sash.
        Large and physically imposing.
      psychology_and_culture: >-
        Treacherous opportunists who preach liberty and self-determination to mask their plans to
        usurp Thessbrood leadership.
      diplomacy_and_behavior: >-
        Probe player loyalty regarding Thessbrood. Offer coordinate/sabotage contracts to weaken the
        masters. Refuse standard trade.
      relationships: >-
        Liberty Front junior partners plotting to overthrow Thessbrood. Regard other alliances as
