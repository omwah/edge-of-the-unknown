# Ground-war proof-of-concept balance constants (edge-groundwar).
#
# A Starship-Troopers-flavored planetary raid: the player drops a platoon of
# powered-armor Mobile Infantry against a defended, city-holding world and must
# force a SURRENDER — a demonstration of power, not extermination — before the
# retrieval boat arrives. Everything tunable lives here; the rules layer
# (edge/groundwar/rules.py) reads only these numbers.

battlefield:
  width: 220        # cells; ~2-3 terminal screens wide
  height: 56

pressure:
  retrieval_turns: 24       # boat pickup — surrender must land before this turn ends
  casualty_ceiling: 0.5     # mission aborts (loss) past this fraction of the drop force dead
  escalation_every: 5       # a sortie wave + defense stiffening every N turns
  escalation_acc_bonus: 0.04  # turret/AA accuracy gained per escalation step
  escalation_acc_cap: 0.16    # ... up to this much bonus
  # GW-WP10 macro-turn economy (D4/D12): ending a tactical turn burns main-game turns
  # in quanta, mirroring expedition.local_turns_per_main_turn/main_turn_cost below.
  local_turns_per_main_turn: 2
  main_turn_cost: 1

resolve:
  start: 100
  cap: 120                  # hardening ceiling — headroom above start for atrocity/kills
  surrender_threshold: 25   # planet capitulates at or below this (difficulty shifts it)
  # Demonstrations of power (resolve LOST by the defenders):
  turret_destroyed: 6
  aa_destroyed: 8
  sensor_destroyed: 5
  wall_breached: 3          # per wall segment reduced to rubble
  garrison_killed: 2
  military_building_destroyed: 5
  citadel_gun_destroyed: 15
  city_cowed: 10            # a city's every active defense silenced
  broadcast: 14             # a Command suit dictating terms over a cowed city
  # Backfire (resolve GAINED by the defenders — hardened by atrocity/success):
  civilian_building_destroyed: 4
  trooper_killed: 1

platoon:
  # The squad is bought with gold-pressed latinum — the main game's universal
  # currency — so a raid can be funded straight out of the player's purse when
  # edge-groundwar is embedded. Suit `cost` below is a latinum price; `latinum`
  # is the drop-boat's outfitting budget (a standalone default the main game can
  # override with the player's actual balance). Scale reference: a Tier-I ship
  # component is 2000 latinum, Tier-II 8000 (config/default.yaml → economy).
  latinum: 12000            # latinum available to outfit the drop
  max_troopers: 14
  actions_per_turn: 2       # per trooper: any mix of move / jump / fire / missile / broadcast

suits:
  marauder:
    label: Marauder
    glyph: "M"
    cost: 1800              # latinum
    hp: 120
    armor: 8                # flat damage soak per hit
    move: 3                 # move points per turn (terrain costs apply)
    jump_range: 8           # cells per jump, ignoring terrain
    jump_charges: 4
    sight: 8
    signature: 1.4          # multiplier on enemy sensor radius against this suit
    weapon: {range: 9, damage: 28, accuracy: 0.75, structure_mult: 2.0}
    missiles: 3             # limited heavy shots
    missile: {range: 13, damage: 60, accuracy: 0.85, structure_mult: 2.0}
  scout:
    label: Scout
    glyph: "S"
    cost: 700              # latinum
    hp: 55
    armor: 3
    move: 6
    jump_range: 10
    jump_charges: 5
    sight: 14
    signature: 0.5
    weapon: {range: 11, damage: 12, accuracy: 0.80, structure_mult: 1.0}
    missiles: 0
    missile: {range: 0, damage: 0, accuracy: 0.0, structure_mult: 1.0}
    jam_radius: 9           # city sensors inside this radius are suppressed
  command:
    label: Command
    glyph: "C"
    cost: 1500             # latinum
    hp: 80
    armor: 5
    move: 4
    jump_range: 8
    jump_charges: 4
    sight: 11
    signature: 1.0
    weapon: {range: 8, damage: 16, accuracy: 0.75, structure_mult: 1.0}
    missiles: 1
    missile: {range: 12, damage: 45, accuracy: 0.85, structure_mult: 2.0}
    command_radius: 8       # friendly accuracy aura
    command_acc_bonus: 0.10
    broadcast_range: 14     # from a cowed city's center, to dictate terms

# The player's persistent ground force (GW plan D3). Recruits are *hired* at
# Stardock for a per-head incentive — people, never merchandise — and wear suits
# *bought* there at the `cost` above. Both ride a hull's passenger berths
# (ship_classes → passenger_capacity), a limit of their own: a platoon never eats
# cargo holds or colonist berths. Scale reference: a Marauder suit is 1800 slips,
# a Tier-I ship component 2000, so a full platoon is a real expedition-sized
# investment rather than pocket change.
ground_force:
  recruit_price: 250        # latinum incentive per head hired at the dock
  recruit_severance: 50     # paid out when a recruit is released back to the dock
  suit_resale_frac: 0.5     # fraction of `cost` refunded when a suit is sold back
  missile_price: 400        # latinum per ground missile (magazine capped by owned suits)

defenses:
  wall:    {hp: 80}
  gate:    {hp: 60}
  # Turrets are the ground gauntlet: the on-foot approach past them should cost
  # blood but stay survivable behind cover and by silencing them one at a time.
  turret:  {hp: 60, range: 12, damage: 24, accuracy: 0.72}
  # AA is the aerial defense. Dropping or jumping into its umbrella is meant to be
  # punishing, worse the deeper you land — `point_blank_bonus` ramps accuracy from
  # the base value at the edge of `range` up to (accuracy + bonus) at the muzzle,
  # so a capsule landing in the heart of a city (usually under several overlapping
  # AA) is near-certain death. The intended play is to land clear of the umbrella
  # and march in, taking the risk only for the jumps you truly need.
  aa:      {hp: 50, range: 15, damage: 48, accuracy: 0.60, point_blank_bonus: 0.35}
  sensor:  {hp: 40, radius: 16}
  citadel_gun: {hp: 120, range: 16, damage: 40, accuracy: 0.70}
  building_military_hp: 50
  building_civilian_hp: 30

garrison:
  infantry: {hp: 40, armor: 1, move: 3, sight: 8, weapon: {range: 6, damage: 10, accuracy: 0.60, structure_mult: 1.0}}
  armor:    {hp: 90, armor: 4, move: 4, sight: 9, weapon: {range: 8, damage: 22, accuracy: 0.65, structure_mult: 1.0}}
  sortie_base: 2            # units in the first sortie wave
  sortie_growth: 1          # extra units per later wave
  armor_from_wave: 2        # waves before tanks join the sorties
  undetected_first_strike: 0.15   # accuracy bonus firing while undetected
  preplaced_frac: 0.35      # GW-WP10: share of the reserved garrison stationed at drop

# Terrain gameplay classes, keyed by edge.art.terrain feature names.
# move_cost 0 = impassable on foot (jump jets clear it). cover soaks accuracy.
terrain:
  water_deep:    {move_cost: 0, cover: 0.0,  blocks_los: false}
  water_shallow: {move_cost: 2, cover: 0.0,  blocks_los: false}
  sand:          {move_cost: 1, cover: 0.0,  blocks_los: false}
  grass:         {move_cost: 1, cover: 0.05, blocks_los: false}
  forest:        {move_cost: 2, cover: 0.20, blocks_los: true}
  mountain:      {move_cost: 0, cover: 0.10, blocks_los: true}
  snow:          {move_cost: 2, cover: 0.0,  blocks_los: false}
  ice:           {move_cost: 1, cover: 0.0,  blocks_los: false}
  ash:           {move_cost: 1, cover: 0.05, blocks_los: false}
  crater:        {move_cost: 2, cover: 0.15, blocks_los: false}
  dust:          {move_cost: 1, cover: 0.0,  blocks_los: false}
  rock:          {move_cost: 2, cover: 0.15, blocks_los: false}
  debris:        {move_cost: 2, cover: 0.15, blocks_los: false}
  void:          {move_cost: 1, cover: 0.0,  blocks_los: false}
  # Cloud City station-interior features (GW-WP15). `bulkhead` and `security_door`
  # are both move_cost: 0 (impassable on foot), but unlike planet terrain jump-jets
  # never bypass either here — a bulkhead must never be the only route anywhere
  # (edge.core.groundwar.interior's connectivity invariant), while a security_door
  # may legally be a sole connector since it is always destructible (breach cost is
  # GW-WP16). vacuum/fire/electrical are inert hazard tags this WP — no effect yet.
  corridor:      {move_cost: 1, cover: 0.0,  blocks_los: false}
  plaza:         {move_cost: 1, cover: 0.0,  blocks_los: false}
  habitation:    {move_cost: 1, cover: 0.05, blocks_los: false}
  engineering:   {move_cost: 2, cover: 0.15, blocks_los: false}
  command_core:  {move_cost: 1, cover: 0.05, blocks_los: false}
  cover_strut:   {move_cost: 1, cover: 0.30, blocks_los: false}
  bulkhead:      {move_cost: 0, cover: 0.0,  blocks_los: true}
  security_door: {move_cost: 0, cover: 0.0,  blocks_los: true}
  lift:          {move_cost: 1, cover: 0.0,  blocks_los: false}
  vacuum:        {move_cost: 1, cover: 0.0,  blocks_los: false}
  fire:          {move_cost: 2, cover: 0.0,  blocks_los: false}
  electrical:    {move_cost: 1, cover: 0.0,  blocks_los: false}

# The peaceful branch (Expedition mode): a lone surveyor on a friendly world
# chasing ship-sensor archaeology leads. Smaller map than the battlefield —
# the pacing is walking and searching, not a platoon assault.
expedition:
  width: 220
  height: 56
  sites_min: 3              # sensor contacts per descent
  sites_max: 6
  supplies_start: 55        # every move or dig spends 1; settlements refill it
  dig_cost: 1
  dig_radius: 2             # a dig opens a trench this wide — the site pays off anywhere inside
  find_resupply: 6          # supplies regained at each successful find (capped at supplies_start)
  settlement_resupply: 12   # supplies regained per settlement visit (capped at supplies_start)
  move: 7                   # move points per turn (terrain costs apply)
  sight: 11                 # you must be this close to *notice* disturbed ground
  area_radius: 14           # the ship-sensor "general area" circle
  clue_radius: 3            # disturbed-ground clues lie within this of the true spot
  clue_count: 4
  settlements_min: 2        # inhabited worlds only
  settlements_max: 3
  city_hint_radius: 6       # a settlement's hint shrinks one search circle to this
  scanner:                  # handheld reading vs. distance to the nearest unfound site
    - {within: 8,  label: "SATURATED — it is close; look for disturbed ground"}
    - {within: 15, label: "strong"}
    - {within: 25, label: "moderate"}
    - {within: 40, label: "faint"}
  local_turns_per_main_turn: 4  # D4/D12: charge main-game turns every N local expedition turns
  main_turn_cost: 1             # ...this many main-game turns per threshold crossed (marching only)
  landing_blocked_features:     # terrain the shuttle will not set down on (you pick the drop site)
    - water_deep
    - water_shallow
    - mountain
    - ice

# Cloud City station-interior generation (GW-WP15; edge.core.groundwar.interior).
# The assault gate stays off until GW-WP16 — this tunes generation/art review only.
cloud_city:
  width: 60
  height: 32
  districts_base: 3        # room count at cloud_city_size 1
  districts_per_size: 2    # ... plus this many per size step above 1 (max size 4 -> 9 rooms)
  locked_door_frac: 0.35   # fraction of inter-room connections stamped as a security_door
  lift_pairs: 2            # extra long-range teleport-link shortcuts
  hazard_frac: 0.03        # fraction of non-objective floor cells tagged vacuum/fire/electrical
  cover_frac: 0.08         # fraction tagged cover_strut
  crate_chance: 0.4        # per-district odds of a salvage crate (GW-WP18 friendly tour)

# GW-WP16 migration gate: on. Generation/tactics/settlement/TUI parity proven
# (tests/test_groundwar_cloud_city_assault*.py); balance (garrison counts, defense
# density per district, emplacement geometry) is not tuned yet — a WP13-style
# follow-up, not a blocker for correctness. Below-friendly Cloud Cities now route
# to Assault via edge.core.groundwar.access.ground_access.
cloud_city_assault_enabled: true

# Persistent planetary ground-garrison economy (GW plan D11, GW-WP09). Feeds
# Planet.garrison_infantry/garrison_armor via three rails: big-bang seeding,
# automatic militia recovery (ownership-independent), and colonist-allocation
# training (owner-only, equipment-gated). ReinforceGarrison (ship -> planet,
# D15) is a fourth, player-issued rail with no config knob of its own here.
garrison_economy:
  train_yield: 0.4
  train_equipment_cost: 3
  militia_recovery_frac: 0.01
  militia_armor_recovery_frac: 0.003   # armor regrows slower than infantry, and only when fortified
  armor_recovery_min_citadel_level: 2
  cap_frac: 0.35
  seed_infantry_frac_min: 0.02
  seed_infantry_frac_max: 0.12
  seed_hostility_mult: 1.6
  seed_alliance_mult: 1.3
  seed_band_mult: {}   # e.g. Frontier: 1.3, Deep Space: 1.6 — left empty by default
  seed_armor_min_citadel_level: 2
  seed_armor_frac: 0.25

# Live-state assault difficulty derivation (GW-WP09); the standalone-only
# `difficulties:` preset table this once superseded was retired in GW-WP14. Read
# only by edge.core.groundwar.assault.derive_difficulty.
assault_difficulty:
  min_cities: 1
  max_cities: 4
  population_per_extra_city: 4000
  surrender_threshold_base: 30
  surrender_threshold_per_citadel_level: 8
  hostility_mult: 1.4
  band_mult: {}
  alliance_owned_mult: 1.2
  had_gun_mult: 1.15

# GW-WP11 strategic reconciliation. Resolve recovers on the daily planet tick;
# an unaligned people that surrenders remains sovereign under a limited
# protectorate until both the time and Resolve gates permit explicit annexation.
settlement:
  resolve_recovery_per_day: 8
  protectorate_min_days: 5
  annex_resolve_threshold: 80
  protectorate_production_share: 0.10
  civilian_loss_per_structure: 0.02
  civilian_alignment_penalty: 3
  annex_alignment_penalty: 15
  defenders_per_consequence: 10
