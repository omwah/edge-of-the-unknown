# Edge of the Unknown — default species roster (DESIGN §6).
#
# A named roster of rival alliances + the species pool the big bang draws a seeded
# *subset* from (not every species appears in a given universe). Validated against
# edge.core.config.RosterConfig. Each entry carries the full §6.1 parameter set; the
# friendly-path subset (disposition spread, alliance, tech_level, trade_posture /
# treaty_mode, persona, tech_offers) is what Phase 2 exercises, while the hostile /
# Phase-3 fields (threat_rating, interception_rating, signature_mechanic, memory_model,
# betrayal_model, befriend_price, pack, fleet, starbase_policy) are authored now as
# forward-compat and checked for reference integrity, but unread until Phase 3.
#
# The structure (three rival blocs + a field of unaligned wild cards, each species with
# one memorable systemic hook) and the species archetypes are inspired by MicroProse's
# *Lightspeed* (1990); the names and flavour are this game's own.

# The Terran Federation governs Core Space; the player starts as one of its members.
core_governing_alliance_id: 1

# How many species the big bang draws from the pool (clamped to the pool size and to
# at least one-per-live-band so every band has a friendly contact, §5 step 8).
subset_min: 7
subset_max: 11

# Presence density (§6.3). A drawn species fields a cluster of ships around its home
# sector rather than a lone contact, and the Core bustles with governing-alliance
# traffic. All ships of one species share that species' reputation/dossier, so this is
# pure atmosphere — it never splinters standing.
ships_per_home: 4       # ships per species home cluster (incl. the home contact)
home_cluster_radius: 2  # how many warp-hops out the home cluster spreads
core_traffic: 8         # extra governing-member ships scattered across Core Space

alliances:
  - { id: 1, name: Terran Federation, banner: "Exploration & mutual defence" }
  - { id: 2, name: Verdant Compact,   banner: "Order through moral authority" }
  - { id: 3, name: Iron Covenant,     banner: "Loyalty & retribution" }
  - { id: 4, name: Liberty Front,     banner: "Self-determination (a front)", covets_core: true }

species:
  # --- Terran Federation — the Core's governing alliance & the player's own people ---

  # Terrans — Star-Trek-style humans; principled explorer-diplomats, the Core's
  # founding people and the player's own. 100% friendly (a fellow citizen): the warmest
  # contact in the game and the natural first tech vendor a new player reaches.
  - id: terran
    name: Terrans
    archetype_id: humanoid_diplomat
    description: >-
      Humans of the Terran Federation — principled explorers and diplomats, the Core's
      founding people and the player's own. The warmest contact in the game.
    disposition_center: 1.0
    disposition_variance: 0.03      # always at the very top of the friendly band
    tech_level: 8
    alliance_id: 1                  # the Core governor
    alliance_role: leader
    home_band: Hub                  # the Core is the inner Hub; gov members settle in Core Space
    trade_posture: open
    treaty_mode: open
    persona: humanoid_diplomat
    threat_tier: feeble
    threat_rating: 0.3
    interception_rating: 0.1
    combatant: true                 # capable, but never reaches violence at full amity
    memory_model: normal
    betrayal_model: recoverable
    attitude_gain_rate: 0.12
    attitude_loss_rate: 0.2
    tech_offers:
      - { tier: I,   mode: latinum, component: turbine,   price: 1600, min_disposition: 0.60 }
      - { tier: II,  mode: latinum, component: converter, price: 6500, min_disposition: 0.70 }
      - { tier: III, mode: barter,  aspect: holds, amount: 10,         min_disposition: 0.80 }

  # Centaurians — a close Federation founding partner; humanoid, warm, cooperative.
  # Fellow Core citizens and reliable friends on the home lanes.
  - id: centaurian
    name: Centaurians
    archetype_id: humanoid_diplomat
    description: >-
      A founding partner species of the Terran Federation — humanoid, warm and
      cooperative; fellow citizens of the Core and reliable friends on the lanes.
    disposition_center: 0.98
    disposition_variance: 0.03
    tech_level: 7
    alliance_id: 1
    alliance_role: member
    home_band: Hub                  # the Core is the inner Hub; gov members settle in Core Space
    trade_posture: open
    treaty_mode: open
    persona: humanoid_diplomat
    threat_tier: feeble
    threat_rating: 0.2
    interception_rating: 0.1
    combatant: true
    memory_model: normal
    betrayal_model: recoverable
    attitude_gain_rate: 0.12
    attitude_loss_rate: 0.2
    tech_offers:
      - { tier: I,  mode: latinum, component: radiator,  price: 1700, min_disposition: 0.60 }
      - { tier: II, mode: latinum, component: navigator, price: 6800, min_disposition: 0.70 }

  # --- Unaligned wild cards ------------------------------------------------------

  # Vesk — small fox/canine folk; peaceful resourceful technologists. The roster's
  # warmest contact and best low-cost tech vendor. (cf. Lightspeed Halicot.)
