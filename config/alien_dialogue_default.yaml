# Edge of the Unknown — default alien dialogue corpus (DESIGN §6.7).
# =============================================================================================
# This file is the hand-authored voice corpus for the default roster, kept separate from the
# roster (alien_roster_default.yaml) so a roster and its voice can vary independently. It is
# read at the config I/O seam (edge.config.load_config, via `dialogue_file:` in default.yaml),
# merged onto the in-memory RosterConfig, and checked by edge.dialogue.select.validate_dialogue
# (DESIGN §13) on load. The offline authoring pipeline (edge.dialogue.authoring) writes machine
# alternatives under config/dialogue/<backend>_<model>.yaml in the `species_grammars` shape
# documented near the bottom of this header; those are layered on top of this base corpus.
#
# This header is the full spec: enough to author/edit a `personas` map or a `species_grammars`
# sidecar, and to check either for correctness and completeness. Schema lives in
# edge/core/config.py (DialogueWhen / DialogueChoice / DialogueLine / DialoguePack / RosterConfig),
# the vocabulary in edge/dialogue/intents.py, selection + validation in edge/dialogue/select.py,
# and Tracery realisation in edge/dialogue/render.py.
#
# --- TOP-LEVEL SHAPE -------------------------------------------------------------------------
#   recency_k: <int >= 0>           # no-repeat ring depth (see SELECTION). Default 2.
#   start_context: <context_key>    # the context the contact screen opens on. Default `greeting`.
#                                   #   The `generic` persona MUST author `choices` on it (see
#                                   #   COMPLETENESS): that list is the baseline reply menu every
#                                   #   species falls back to. The whole contact menu is authored
#                                   #   `choices` now — there is no code-derived verb menu. A reply's
#                                   #   availability (and greyed reason) is computed from species
#                                   #   params + live offers; the screen's only letter shortcuts are
#                                   #   `b` (Back) and `f` (Farewell).
#   grammar:   { symbol: [str,...] }# OPTIONAL shared Tracery fragments referenced by `#symbol#`
#                                   #   from any line's `grammar` (persona/global vocabulary).
#   personas:  { <persona_name>: <DialoguePack>, ... }   # the voices (see below). MUST include
#                                   #   `generic` — the ultimate fallback, see COMPLETENESS.
#
# --- THE FALLBACK CHAIN ----------------------------------------------------------------------
# Every alien resolves a line by walking three packs in order, most specific first:
#       species.dialogue_pack  ->  personas[species.persona]  ->  personas['generic']
# (`species.dialogue_pack` lives on the roster / is spliced from a species_grammars sidecar;
# `species.persona` is a key into `personas` here.) The FIRST pack in the chain that has the
# requested context key AND at least one entry whose `when` matches wins outright — the search
# does not blend packs. So a persona overrides `generic` only for the contexts it defines, and a
# species overrides its persona only for the contexts it defines; all other contexts fall through
# to `generic`. This is why a persona/species pack may be sparse: author only the distinctive
# beats and let `generic` carry the rest.
#
# --- A DialoguePack --------------------------------------------------------------------------
# A map of CONTEXT KEY -> ORDERED LIST OF LINE ENTRIES:
#       <context_key>:
#         - <DialogueLine>
#         - <DialogueLine>
# Each list is the candidate entries for that context; the selector picks one (see SELECTION).
#
# --- A DialogueLine (entry) ------------------------------------------------------------------
#   when:     <DialogueWhen>     # OPTIONAL predicate; omitted ⇒ matches anything (a CATCH-ALL).
#   variants: [ "<templated phrasing>", ... ]   # a pool of interchangeable phrasings, OR
#   grammar:  { origin: ["#a# #b#"], a: [...], b: [...] }   # a Tracery rule map (see GRAMMAR).
#   weight:   <int >= 1>         # OPTIONAL tie-break weight among equally-specific matches (1).
#   choices:  [ <DialogueChoice>, ... ]   # OPTIONAL authored player replies (see BRANCHING).
# RULE: exactly ONE of `variants` / `grammar` must be non-empty. If `grammar` is used it MUST
# define an `origin` symbol. Every `{placeholder}` used must be allowed for the context (below).
#
# --- A DialogueWhen (predicate) --------------------------------------------------------------
# All fields optional; an entry with none (and no `criteria`) is the catch-all. A field that is
# set must match the encounter facts for the entry to be eligible:
#   standing: allied | friendly | neutral | wary | hostile   # the effective-disposition band
#                                   #   (`allied` when the player shares the species' alliance).
#   treaty:   true | false          # whether a treaty is in force.
#   criteria: { <fact>: <value> }   # arbitrary fact gates, e.g. { has_intel_target: true }.
#   posture / stage: <str>          # Phase-3 forward-compat; entries that set these are INERT in
#                                   #   Phase 2 (never selected). Leave unset for Phase-2 lines.
#
# --- FACTS a `criteria` gate can name (assembled in edge/dialogue/facts.py) ------------------
# Per-context facts (set only while the named context is shown/spoken):
#   has_intel_target: true|false    # offer_coordinates — the speaker holds an unlogged tip.
#   subject: <species_id>           # dossier_other + branch.dossier_other.* — the asked-about kind.
# SESSION facts (the per-contact visit, DESIGN §6.7/WP28): a conversation opens a session on
# `Player.contact_session` that accumulates what happened THIS VISIT and feeds every selection
# with that species until the visit ends (farewell, or any movement — the session's lifetime is
# structural, never trusted to the UI). Keys:
#   asked.<context_key>: true       # that context was already spoken this visit (set for every
#                                   #   spoken context — gate on it to react to a repeat question,
#                                   #   e.g. { criteria: { asked.dossier_self: true } }).
#   traded: true                    # the player bought/bartered a tech offer this visit.
#   accepted_lead: true             # the player logged a coordinate tip this visit.
# An entry that pins a session fact outscores a vaguer one only while the fact holds, so always
# keep a less-specific (or catch-all) sibling for the first exchange of a visit.
# SITUATIONAL facts (the live circumstances, DESIGN §6.7/WP29): ALWAYS present in every
# selection, so a `criteria` may pin either polarity of the booleans (real true/false) or a
# bucket string. Keys:
#   band: <band name>               # the sector's distance band, e.g. Hub / Frontier / Deep.
#   in_nebula: true|false           # a nebula shrouds this sector.
#   wreck_here: true|false          # a visible, uncollected wreck lies in this sector.
#   hull: critical|scarred|sound    # player hull state bucket (<=25% / <=60% / above).
#   low_turns: true|false           # the player is nearly out of turns.
#   holds_empty: true|false         # nothing in the cargo bay.
#   holds_full: true|false          # no free hold.
#   carrying: fuel_ore|organics|equipment   # largest cargo stack (ABSENT when unladen).
#   just_fled_combat: true|false    # the player fled a fight earlier today.
# (Persisted cross-visit arc facts land in WP30.)
#
# --- A DialogueChoice (authored player reply) ------------------------------------------------
# The node's `choices` are the player's reply menu — the WHOLE menu (there is no code-derived
# verb fallback). The contact screen shows them as NUMBERED replies. Resolution walks the same
# species → persona → generic chain as lines, but for *choices*: if the winning line's pack has
# no `choices` for the node, the menu falls back to the `generic` persona's choices for that
# context (the `start_context` baseline). So a persona may voice a greeting line without
# restating the menu — its replies fall through to generic.
#   text:         "<templated reply label>"    # REQUIRED; uses the node's placeholders.
#   next_context: <context_key>     # OPTIONAL: transition to any known context, incl. a branch.*
#                                   #   `back` steps to the previous node; `dossier_other` opens the
#                                   #   ask-about-a-species picker; `offer_coordinates` asks for a tip.
#   action:       leave | trade | barter | accept_lead | attack   # OPTIONAL mechanical verb
#                                   #   (`leave` speaks the parting line then breaks contact;
#                                   #   `attack` is recognised but Phase-3-gated). No action ⇒
#                                   #   pure transition. No next_context + no action ⇒ stay/act.
#                                   #   Availability is gated in code from species params + offers
#                                   #   (trade posture, treaty mode, combatant, artifacts, a tip).
#   when:         <DialogueWhen>    # OPTIONAL gate on whether the reply is offered.
#   weight:       <int >= 1>        # OPTIONAL.
#
# --- CONTEXT KEYS (the closed vocabulary) ----------------------------------------------------
# A context key is one of the fixed INTENTS below, OR a reserved namespace key:
#   diplomacy: greeting  treaty_offer  treaty_grant  treaty_condition  treaty_refuse  farewell
#   trade:     trade_open  trade_refuse
#   discovery: offer_coordinates                 (the location-tip "map" mechanic)
#   lore:      dossier_self  dossier_other
#   encounter: refuel  extort_response  demand  reward
#   combat (Phase-3, peaceful=false; authored-but-inert in Phase 2):
#              combat_open  combat_taunt  surrender  flee_scorn  betrayal
#   branch.<name>:  an authored intermediate node, reachable ONLY as a choice `next_context`.
#   sig.<name>:     a Phase-3 signature-mechanic prompt (reserved namespace).
# Any other key is invalid and fails validation.
#
# --- PLACEHOLDERS ({...} fill from the encounter; unknown ones render empty) -----------------
# Universal (every context):           {player} {species} {alliance}
# Per-context EXTRAS (in addition to the universal set):
#   treaty_condition:   {subject} {count}
#   offer_coordinates:  {target} {coords} {distance} {band} {reward}
#   dossier_other:      {subject}
#   demand:             {subject} {count} {reward} {coords}
#   reward:             {subject} {count} {reward}
#   combat_taunt:       {subject}
#   betrayal:           {subject}
#   branch.* and sig.*: the rich set {subject} {count} {reward} {coords} {item}
# Using a placeholder not allowed for the context fails validation.
#
# --- SELECTION (how one line is chosen at runtime) -------------------------------------------
# Within the winning pack's entries for a context: keep entries whose `when` matches; among
# those the MOST-SPECIFIC wins (an entry that pins more facts beats a vaguer one), ties broken by
# `weight` through a seeded RNG. Then realise it:
#   - variants: pick an index avoiding the last `recency_k` shown (the no-repeat "recency ring");
#   - grammar:  expand `origin` (GRAMMAR_VARIANTS=8 seeded expansions, also recency-rotated).
# Rings are kept per (CONTACT INSTANCE, context) — two ships of one species rephrase
# independently, each with its own "what I already said" memory (WP29).
# Determinism: the same (game seed, command log) reproduces the same line.
#
# --- GRAMMAR (Tracery), optional alternative to `variants` -----------------------------------
# `grammar` is { symbol: [expansions] } expanded from `origin`. Reference other symbols with
# `#symbol#`; values may embed `{placeholders}`. Symbols not defined locally resolve against the
# top-level shared `grammar:` map. Keep `#...#` (grammar symbols) and `{...}` (placeholders)
# distinct — never `#{x}#`. A grammar line MUST define `origin` and must render non-empty.
#
# --- BRANCHING / branch.* nodes --------------------------------------------------------------
# A choice's `next_context` may target a `branch.<name>` node defined in the same pack. Such a
# node is an ordinary list of line entries (usually a single catch-all entry plus its own
# `choices`). Every `branch.*` node MUST be reachable — i.e. some choice's `next_context` points
# at it — or validation rejects it as dead config.
#
# --- species_grammars SIDECAR (config/dialogue/<backend>_<model>.yaml) -----------------------
# A machine-authored sidecar has NO `personas`; instead a top-level `species_grammars` map keyed
# by SPECIES ID (roster `species[].id`, not persona name), each value a DialoguePack spliced onto
# that species' `dialogue_pack` (so it wins over the species' persona via the chain above):
#       species_grammars:
#         <species_id>:
#           <context_key>:
#             - { grammar: { origin: ["#a# {player}"], a: [...] }, choices: [ ... ] }
# Notes: a species_id must exist in the roster. An `offer_coordinates` entry authored without a
# `when` is auto-gated on `{ criteria: { has_intel_target: true } }` at merge time, so it never
# shadows the generic "nothing new" fallback once a tip is logged. A sidecar layers OVER this
# base corpus; it need not restate contexts that should fall through to persona/generic.
#
# --- CORRECTNESS & COMPLETENESS CHECKLIST (validate_dialogue, DESIGN §13) --------------------
# A corpus (base + any merged sidecar) is valid iff ALL hold:
#  1. A `generic` persona exists and carries a CATCH-ALL entry (no `when`, no `criteria`) for
#     EVERY intent key above (all of diplomacy/trade/discovery/lore/encounter/combat) — so
#     resolution never blanks for any standing/treaty.
#  2. Every context key in every pack is a known intent, a `branch.*`, or a `sig.*`.
#  3. Every line entry has exactly one of non-empty `variants` / `grammar` (grammar ⇒ has
#     `origin`), and every `{placeholder}` (in variants, grammar strings, and choice `text`) is
#     allowed for that context.
#  4. Every choice's `action` (if set) is one of leave/trade/barter/accept_lead/attack, and
#     its `next_context` (if set) is a known context key.
#  5. Every `branch.*` node is reachable (targeted by some choice `next_context`).
#  6. Every species' `persona` names a real persona pack, and for every context the species can
#     reach (its Phase-2 friendly path + all branch nodes reachable through choices) a non-empty
#     line resolves for standings allied/friendly/neutral/hostile x treaty false/true. Reachable
#     contexts come from the species' params: a `refuses` trader drops `trade_open`; a `none` /
#     `superfluous` treaty_mode drops the `treaty_*` contexts; `trade_refuse` is reachable for
#     all. `generic`'s catch-alls satisfy this for any species that authors no line of its own.
#  7. `generic.dossier_other` is parameterised by `{subject}` (one line narrates any species).
#  8. The `generic` persona authors a non-empty `choices` list on `start_context` (default
#     `greeting`) — the baseline reply menu every species falls back to (`choices_for`). Without
#     it a contact node would render no replies.
#
# =============================================================================================
recency_k: 2
start_context: greeting

personas:
  # The complete fallback pack: a catch-all line for every base context key, so a line
  # never blanks. `greeting` is standing-keyed; the rest are voiced over by the personas.
  generic:
    greeting:
      - when: { standing: allied }
        variants:
          - "Welcome back, friend {player}. The {species} are glad of your company."
          - "Ah, {player}. Among allies you are always welcome among the {species}."
          - "Our friend returns. Speak, {player} — the {species} listen."
          - Identify yourself, {player}. What brings you to the {species}?
      - when: { standing: friendly }
        variants:
          - "Greetings, {player}. The {species} receive you in good faith."
          - "Well met, traveller. What brings you to the {species} today?"
          - "You are welcome here, {player}. How may the {species} assist you?"
      - when: { standing: neutral }
        variants:
          - "We are the {species}. State your business, {player}."
          - "You stand before the {species}. What do you want?"
      - when: { standing: hostile }
        variants:
          - "You have nerve to hail the {species}, {player}. Speak quickly."
          - "The {species} have little love for you. Why do you call?"
      - variants:
          - "The {species} acknowledge you, {player}."
          - "You have the attention of the {species}."
        # The baseline reply menu (§6.7). `start_context` (greeting) MUST carry choices: this list
        # is the menu every species falls back to (via `choices_for`) unless its own pack authors
        # replies for the node. Each reply's availability is gated in code from species params +
        # live offers (a `refuses`/gated trader, a treaty mode, the combatant flag, artifacts on
        # offer, a coordinate tip), so a greyed reply shows *why*. Treaty/attack are Phase-3 and
        # stay disabled (hidden unless `ui.show_disabled_options`).
        choices:
          - text: "Ask about another people…"
            next_context: dossier_other
          - text: "Where should we explore next?"
            next_context: offer_coordinates
          - text: "Let us trade."
            action: trade
          - text: "I have an artifact to barter."
            action: barter
          - text: "Let us speak of a treaty."
            next_context: treaty_offer
          - text: "Prepare to be boarded!"
            action: attack
          - text: "Farewell."
            action: leave
    trade_open:
      - variants:
          - "The {species} will deal with you. Show us what you seek."
          - "Our wares are open to you, {player}. Let us trade."
    trade_refuse:
      - variants:
          - "The {species} have nothing for you today."
          - "We do not trade with you, {player}. Not now."
    offer_coordinates:
      - when: { criteria: { has_intel_target: true } }
        variants:
          - "Seek {target}? Set course for sector {coords}, {player} — {distance} jumps into the {band}. {reward} awaits there."
          - "The {species} know of {target} at sector {coords}: {distance} hops out, deep in the {band}. You'll find {reward}."
          - "Take these coordinates, {player}: sector {coords}, {distance} jumps off. {target} lies there, and with it {reward}."
        choices:  # log the volunteered tip (gated on a tip being on offer), or back out
          - text: "Log these coordinates."
            action: accept_lead
          - text: "Maybe later."
            next_context: back
      - variants:  # catch-all — nothing new to point you toward
          - "The {species} know of nowhere new to send you just now, {player}."
          - "We have no fresh coordinates for you. Range farther, {player}, and return."
          - The stars are quiet. We have no destinations for you.
        choices:
          - text: "Thanks for nothing..."
            next_context: back
    treaty_offer:
      - variants:
          - "A lasting peace between us? The {species} will consider it."
          - "Speak of treaty, {player}, and the {species} will weigh your words."
    treaty_grant:
      - variants:
          - "It is done. The {species} and {player} are at peace."
          - "Let the accord stand. The {species} honour it."
    treaty_condition:
      - variants:
          - "First prove yourself, {player}, and the {species} will talk of treaty."
          - "Earn our trust, and peace with the {species} may follow."
    treaty_refuse:
      - variants:
          - "There will be no treaty with you, {player}."
          - "The {species} decline your offer of peace."
    refuel:
      - variants:
          - "Take on fuel, {player}, and go in peace."
          - "The {species} will see your tanks filled."
    extort_response:
      - variants:
          - "You would threaten the {species}? Take your goods and be gone."
          - "We yield this once, {player}. Do not mistake it for weakness."
    demand:
      - variants:
          - "The {species} require {reward}. See it done."
          - "Bring us {reward}, {player}, if you would keep our favour."
    reward:
      - variants:
          - "You have served well. The {species} grant you {reward}."
          - "Take this {reward}, {player}, with the thanks of the {species}."
    combat_open:
      - variants:
          - "Then it is battle. The {species} will not yield!"
          - "You chose this, {player}. The {species} answer in kind."
    combat_taunt:
      - variants:
          - "Is that the best you bring, {player}?"
          - "The {species} have weathered worse than you."
    surrender:
      - variants:
          - "Hold! The {species} yield. Spare us."
          - "Enough! We surrender, {player}."
    flee_scorn:
      - variants:
          - "Run, then. The {species} expected no better of you."
          - "Coward. Do not show your hull to the {species} again."
    betrayal:
      - variants:
          - "Betrayer! The {species} will not forget this, {player}."
          - "You have broken faith. The {species} are done with you."
    farewell:
      - variants:
          - "Go well, {player}."
          - "The {species} bid you farewell."
          - "Safe warp, traveller."
    dossier_self:
      - variants:
          - "We are the {species}, of {alliance}."
          - "The {species} keep our own counsel in this cluster."
    dossier_other:
      - variants:
          - "The {subject}? The {species} have dealings with them, of a kind."
          - "Ah, the {subject}. Tread carefully where they are concerned."

          - The {subject} are known to us. But we say no more.
  # Terrans / Centaurians — Starfleet voice: warm, formal-but-friendly, exploration-
  # and cooperation-minded. Allied-keyed lines address the player as a fellow citizen.
  humanoid_diplomat:
    greeting:
      - when: { standing: allied }
        variants:
          - "Welcome home, {player}. The Federation stands with you."
          - "{player}! Good to see a fellow citizen out on the lanes. Safe travels."
          - "A friendly flag in the dark — well met, {player}. The {species} are glad of you."
          - The Federation extends its hand in friendship, {player}.
      - variants:    # any non-allied standing
          - "We come in peace, {player}. The {species} of the Terran Federation greet you."
          - "Greetings, traveller. The {species} seek understanding, not conflict."
    trade_open:
      - variants:
          - "Everything we've built is open to a friend of the Federation, {player}."
          - "The {species} trade gladly and fairly. Tell us what you need, {player}."
    treaty_offer:
      - variants:
          - "Between friends a treaty is a formality — but gladly, {player}."
          - "The {species} welcome a lasting accord. Let us make it so, {player}."
    farewell:
      - variants:
          - "Go well, {player}. To boldly go — and come home safe."
          - "Clear skies, {player}. The {species} will be here when you return."
    dossier_other:
      - variants:
          - "The {subject}? The {species} seek peaceful understanding with all peoples, {player}."
          - "Ah, the {subject}. We've reached out to them in good faith — as we do with all, {player}."

          - The {subject}? We are always trying to open diplomatic channels with them.
  # Vesk — introduces itself by serial-style name; warm, helpful technologists.
  serial_formal:
    greeting:
      - variants:
          - "Greetings, {player}. I am Veska VK-7 of the {species}. We are at your service."
          - "I am Veska VK-7 of the {species}. How may we be of service, {player}?"
          - "Well met. Veska VK-7 of the {species} greets you, {player}, in friendship."
        # Authored branching (§6.7): when a line carries `choices`, the contact screen shows
        # these numbered player replies instead of the derived Say/Do menu. A reply may
        # transition to another context (`next_context`, including a `branch.*` node) and/or
        # fire a mechanical `action` (leave / trade / barter / accept_lead).
        choices:
          - text: "Show me what the {species} have built."
            next_context: branch.vesk_workshop
          - text: "Safe travels."
            action: leave
    # An intermediate branch node, reached only from the greeting choice above. It carries a
    # catch-all line (no `when`) so it resolves for any standing, then offers its own replies.
    branch.vesk_workshop:
      - variants:
          - "Step into our workshop, {player}. Circuits, sensors — all our craft is here."
          - "The {species} are proud of our making. Look upon it, {player}."
          - Our greatest innovations are displayed here, {player}.
        choices:
          - text: "Let's deal."
            action: trade
          - text: "Tell me about yourselves."
            next_context: dossier_self
          - text: "Another time."
            action: leave
    trade_open:
      - variants:
          - "The {species} trade gladly. Our circuits and sensors are yours, {player}."
          - "We have built fine things, {player}. The {species} will sell to a friend."
    farewell:
      - variants:
          - "This makes us very happy. Good warp, {player}."
          - "Go in peace, {player}. The {species} are always at your service."
    dossier_other:
      - variants:
          - "The {subject}? We know them. Beware those whose minds are unkind, {player}."
          - "Of the {subject} the {species} can tell you much. Listen well."

          - We have recorded much data concerning the {subject}, {player}.
  # Selvani — cautious, reserved, good-faith.
  reserved_honest:
    greeting:
      - variants:
          - "We are the {species}. We are cautious, {player}, but mean you no harm."
          - "You may mean to harm the {species}. Yet we will hear you, {player}."
          - "Greetings, friend. Our intent is peace. What do you wish of the {species}?"
    trade_open:
      - variants:
          - "We will deal, {player}, with those who have proven honest."
          - "The {species} trade carefully. Show us good faith and we will reciprocate."
    dossier_other:
      - variants:
          - "The {subject}? We know little, but we will tell you what we know, {player}."

          - We observe the {subject} from afar.
          - The {subject} are a curious people, though we keep our distance.
  # Cibelline — vain engineered aesthetes; condescending self-names.
  flowery_aesthete:
    greeting:
      - variants:
          - "Felicitations, fortunate one. You behold Gold Moon Rising of the {species}."
          - "Your eyes descry Jade Flowerbud of the {species}. State your need, {player}."
          - "Behold Summer Breeze of the {species}, perfection made flesh. What is it, {player}?"
    trade_open:
      - variants:
          - "We of the {species} deign to deal with you. Do not waste our beauty's time."
          - "Such sordid commerce. Yet the {species} permit it — be quick, {player}."
    dossier_other:
      - variants:
          - "The {subject}? Aesthetically beneath contempt, but instructive, {player}."

          - The {subject}? A tragic lack of culture, honestly.
          - Do not speak to us of the {subject}. They offend our eyes.
  # Selvi — amorous, flirtatious, easily cowed.
  amorous:
    greeting:
      - variants:
          - "Friendliest greetings, warm one! The {species} adore your shapely hull, {player}."
          - "Are you the female of your species, {player}? No matter — open your capsule!"
          - "Heu! What camaraderie shall we share, {player}? Come closer to the {species}."
    trade_open:
      - variants:
          - "For you, lovely {player}, the {species} will trade and gladly."
          - "Anything for such a friend! The {species} open their stalls to you."
    dossier_other:
      - variants:
          - "The {subject}? Ooh. Some are cute, some are not. The {species} can tell you which."

          - Oh, the {subject}? We tried to get close, but they were so cold!
          - The {subject}? Not really our type, to be honest.
