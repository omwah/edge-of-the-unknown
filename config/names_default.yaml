# Discovery names (PT-49, DESIGN §7). Keyed by DiscoveryKind; drawn combinatorially
# (first_part + second_part) without replacement, from a name-only sub-RNG seeded off the game
# seed — so a find is a *place* you can talk about ("the Cygnus Veil") and two games with the
# same seed name it identically. A kind with no pool here falls back to a numbered name; a
# combat wreck ignores these entirely and takes the destroyed ship's own name.
discoveries:
  nebula:
    first_part: [Cygnus, Halaf, Verdani, Tsoraan, Orin, Mirach, Drelb, Antares, Lyra, Kryptos,
                 Caprico, Solaris, Corusca, Kobal, Gallifra, Termina]
    second_part: [Veil, Shroud, Cradle, Mantle, Pillars, Bloom, Curtain, Reach]
