species_grammars:
  terran:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside#'
        opener:
        - Greetings, Captain.
        - Welcome to the reach of our stars.
        - A message received from a Terran vessel.
        detail:
        - It is an honor to establish contact with a traveler of the Federation.
        - We have watched your signals crossing the void for some time.
        - Your signature is recognized as one of our kin in the stars.
        aside:
        - We value your presence here, {player}.
        - May we begin our dialogue in peace?
        - The stars are vast, but today they bring us together.
      choices:
      - text: I come in the name of the Terran Federation.
        next_context: greeting
      - text: I'm looking for local coordinates and trade opportunities.
        next_context: trade_open
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#opener# #detail# #aside#'
        opener:
        - It is a pleasure to meet a traveler of your standing.
        - Your presence in this sector is noted and welcomed, Captain.
        detail:
        - The Terran Federation values prosperity through cooperation.
        - We believe that mutual exchange is the foundation of lasting peace.
        - I have observed your vessel's cargo logs and find them most intriguing.
        honorific:
        - Shall we discuss a fair exchange?
        - Perhaps you are prepared to negotiate terms?
        aside:
        - Tell me, what is it your people seek in these stars?
      choices:
      - text: I am interested. What do you have for trade?
        next_context: trade_open
        action: trade
      - text: Let's discuss the specifics of an exchange.
        next_context: trade_open
        action: barter
    farewell:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#opener# #aside# #detail#'
        opener:
        - The stars are vast, but your journey is what gives them meaning.
        - It has been an honor to share this space with you.
        detail:
        - May your engines run true and your path remain clear.
        - I hope the path ahead treats you with kindness.
        honorific:
        - Safe travels, Captain {player}.
        - Go with the favor of the stars.
        aside:
        - Our worlds may be apart,
        - Though we are far from our homeworld,
      choices:
      - text: May we meet again in these reaches.
        next_context: farewell
      - text: I will remember your hospitality well.
        next_context: farewell
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#opener# #detail# #aside#'
        - '#opener# #honorific# #detail#'
        opener:
        - When it comes to the {subject}, we find them quite...
        - Our records on the {subject} are... extensive.
        - The {subject} occupy a unique place in our collective memory.
        detail:
        - a people of formidable resolve and distinct cultural complexities.
        - an intriguing species whose methods often clash with our diplomatic norms.
        - neighbors whose capabilities we have come to respect, if not always fully
          trust.
        honorific:
        - Captain {player}, they are a sturdy bunch.
        - I believe the {subject} possess a certain... grit that even some Terrans
          admire.
        - In my experience, they are among the more stoic of our neighbors.
        aside:
        - though their ways can be quite taxing for diplomatic negotiations.
        - even if their methods are occasionally blunt to the point of being abrasive.
        - though we find their tenacity most admirable in these lawless sectors.
      choices:
      - text: I've heard they can be quite formidable.
        next_context: dossier_other
      - text: Tell me more about their specific customs.
        next_context: branch.inquiry_customs
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#opener# #aside# #detail#'
        opener:
        - I have come across data regarding the {target} you seek.
        - My sensors have identified a significant signature of {target}.
        - It is my privilege to share what I have uncovered.
        detail:
        - You should set your course for sector {coords}. It is roughly {distance}
          jumps away within the {band} band, where {reward} awaits.
        - The coordinates are locked at sector {coords}; it's a short trek of {distance}
          jumps in the {band} range to claim {reward}.
        - 'I can provide the route: head into the {band} and travel {distance} jumps
          to sector {coords} to find {reward}.'
        honorific:
        - May this assistance serve you well, Captain.
        - I trust your navigation systems are primed for the journey.
        - A fair wind on your voyage, friend.
        aside:
        - It is a rare find in these reaches.
        - The signals were faint, but clear enough.
        - A most fortuitous discovery for any explorer.
      choices:
      - text: Thank you, I'll head there immediately.
        next_context: farewell
        action: accept_lead
      - text: What makes this location so significant?
        next_context: branch.inquiry
