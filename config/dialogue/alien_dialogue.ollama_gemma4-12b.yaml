        - Termination of local contact protocol initiated.
        - 'System_Update: Interaction sequence ended.'
      choices:
      - text: Safe travels, then.
        action: farewell
      - text: I hope our paths cross again.
        action: farewell
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        - '#opener# #detail# #honorific#'
        opener:
        - Subject {subject} is observed.
        - The entities identified as {subject} exist in the sector.
