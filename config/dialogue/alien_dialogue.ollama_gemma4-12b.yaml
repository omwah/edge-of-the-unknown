        - Your presence in this sector is logged.
        honorific:
        - 'Identity: {player}.'
        - 'Subject: Captain {player}.'
        aside:
        - Communication protocol active.
      choices:
      - text: I am looking to establish a trade agreement with your collective.
        next_context: negotiation_start
        action: trade
      - text: Identify yourselves and your current status.
        next_context: identity_check
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail# #aside#'
        opener:
