species_grammars:
  terran:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - Greetings, traveler.
        - I hear your transmission clearly.
        - A voice from the void reaches us.
        detail:
        - It is an honor to host a representative of the {species} in this sector.
        - We welcome the presence of {player} among the stars.
        - The Federation's reach is long, and your signal is welcomed by my kin.
        aside:
        - (I offer a respectful nod toward your vessel.)
        - (A brief pause as I calibrate the comms_link.)
      choices:
      - text: I am Captain {player}. I come in peace to establish contact.
        next_context: identify_intent
      - text: We are looking for local trade routes and supplies.
        next_context: trade_inquiry
        action: trade
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - Greetings, Captain.
        - Peace be with you, traveler.
        detail:
        - The Terran Federation values fair exchange; tell me, what is it that {player}
          seeks to trade?
        - We are prepared to negotiate. What goods or information can we discuss?
        - Our coffers and archives are open to those who offer something of value.
        aside:
        - (A warm smile touches their face.)
        - (They gesture toward a nearby console.)
      choices:
      - text: I have cargo and resources I can offer in exchange for your data.
        next_context: trade_negotiation
        action: barter
      - text: I am looking for specific technology. Can you provide it?
        next_context: trade_item_request
        action: trade
    farewell:
    - grammar:
        origin:
        - '#opener# #detail# #honorific# #aside#'
        opener:
        - The stars are vast, but they feel a little less lonely with your presence
          among them.
        - Your journey takes you toward the unknown now, Captain.
        detail:
        - May our paths cross again under the banner of {alliance}.
        - We shall remember your words and your deeds as we chart the frontier together.
        honorific:
        - Go with honor.
        - Safe travels, friend.
        aside:
        - May your engines never fail.
        - May peace guide your navigation.
      choices:
      - text: And may we meet again in the stars.
        action: farewell
      - text: Safe travels to you as well, friend.
        action: farewell
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - When considering the {subject}, one must acknowledge their unique place
          in the stars.
        - The {subject} are an intriguing people, though they differ greatly from
          our own values.
        - Regarding the {subject}, my records indicate a complex history.
        detail:
        - They possess a resolve that is as impressive as it is formidable.
        - They have proven themselves to be capable allies in various sectors of the
          Core.
        - They are a proud people, often uncompromising in their cultural traditions.
        aside:
        - I believe they hold great respect for your capabilities, Captain {player}.
        - Their methods may seem blunt, but they are consistent.
        - They are far less predictable than we would like.
      choices:
      - text: What do you think of their military capabilities?
      - text: Do you trust them as allies?
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail# #aside#'
        opener:
        - 'Captain {player}, we have identified a site of significant interest: {target}.'
        - I have cross-referenced our charts and located the path to {target} for
          you.
        - Our sensors have confirmed the location of {target}. It is within your reach.
        detail:
        - Set your course for sector {coords}; it is roughly {distance} jumps away
          in the {band} band.
        - Navigate to coordinates {coords} in the {band} region—a journey of {distance}
          jumps.
        - The path lies through the {band} zone; aim for sector {coords}, approximately
          {distance} jumps out.
        aside:
        - A wealth of history, or perhaps {reward}, awaits your arrival.
        - It is a rare find, and {reward} may be yours to claim.
        - The data suggests that {reward} lies waiting at the destination.
      choices:
      - text: Thank you, I'll head straight for those coordinates.
        action: accept_lead
      - text: That is a generous gesture. I appreciate the guidance.
        action: farewell
  centaurian:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside#'
        opener:
        - Greetings, Captain {player}.
        - A warm welcome to you, traveler.
        - It is a pleasure to hear your voice across the comms.
        detail:
        - The Centaurians are honored by your reach out into our sector.
        - We value the enduring bond between our people and yours within the {alliance}.
        - As long-standing partners of the Federation, we always welcome a friend
          from the core.
        aside:
        - May your voyage remain safe in these deep lanes.
        - It is heartening to see more faces of the {species} roaming the stars.
        - We are pleased to find another steady hand at the helm.
      choices:
      - text: I'm looking for information regarding local trade routes.
        action: trade
      - text: I'm here on a diplomatic mission and would like to discuss our shared
          history.
      - text: Help me navigate the nearby asteroid belt; my sensors are failing.
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#opener# #aside# #detail#'
        opener:
        - Your presence in these sectors is noted, Captain.
        - We value the stability you bring to the lanes.
        detail:
        - The Centaurians are prepared to discuss a mutually beneficial exchange of
          goods and resources.
        - Our trade routes are open, and we would be honored to formalize an agreement
          with your fleet.
        - We have plenty of supplies, and I suspect you have items of interest for
          our markets.
        honorific:
        - As a friend of the Federation, your cooperation is welcomed.
        - We look forward to strengthening our ties through commerce.
        aside:
        - It is always refreshing to meet an ambitious pilot of the {species}.
      choices:
      - text: I'm interested. Let's see what you have for trade.
        next_context: trade_items
        action: trade
      - text: Tell me more about the specific goods you're looking for.
        next_context: trade_requirements
        action: barter
    farewell:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #honorific# #detail#'
        opener:
        - The stars will always be a shared backyard for our people.
        - It has been an honor to host you in this sector.
        detail:
        - May your engines run cool and your path remain clear.
        - The {alliance} stands firm as long as we walk together.
        honorific:
        - Captain {player},
        - Friend of the Core,
      choices:
      - text: Safe travels to you as well.
        action: farewell
      - text: May our paths cross again in the Core.
        action: farewell
    dossier_other:
    - grammar:
        origin:
        - '#opener# They are a complex people to navigate, {player}, but they have
          earned their place in the stars. #detail#'
        - 'To be frank, my thoughts on the {subject} are mixed; we must tread carefully
          with them. #detail#'
        opener:
        - Regarding the {subject},
        detail:
        - Their culture is formidable.
        - They possess a warrior's spirit that demands respect.
        - Their methods are often blunt, but their resolve is unwavering.
        - They are a rugged lot, tempered by harsh environments.
      choices:
      - text: Tell me more about their customs.
        next_context: lore_cultural_details
      - text: Do you trust them in a conflict?
        next_context: lore_military_standing
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - Captain, as a friend of the Federation, I've come across something significant.
        - I believe you are seeking the {target}, and I can guide you.
        - The stars have whispered where the {target} lies, just for your ears.
        detail:
        - You must navigate to sector {coords}. It is roughly {distance} jumps away
          within the {band} band.
        - 'I can provide the heading: set your course for sector {coords}. It''s about
          {distance} jumps out in the {band} region.'
        - The path is clear. Head to sector {coords}; it is a {distance} jump journey
          through the {band} corridor.
        honorific:
        - I believe {reward} awaits you there.
        - You will find {reward} waiting in those reaches.
        - A most valuable {reward} lies at your destination.
      choices:
      - text: Thank you, I'll head out immediately.
        action: accept_lead
      - text: That is a generous offer. You have my thanks.
        action: farewell
  vesk:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - Greetings, traveler.
        - Salutations, Captain of the {alliance}.
        - A peaceful transmission to you, {player}.
        detail:
        - It is an honor to establish contact with a representative of your kind.
        - We welcome your presence in this sector of the stars.
        - The Vesk appreciate your willingness to engage in communication.
        aside:
        - (A soft chime echoes as the signal stabilizes.)
        - (The transmission hums with a rhythmic, welcoming pulse.)
      choices:
      - text: I am Captain {player}. I'm looking for technical supplies.
        next_context: trade_intro
      - text: I'm just passing through. Is this sector safe?
        next_context: safety_inquiry
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - Greetings, Captain {player}.
        - Salutations, traveler.
        - It is an honor to meet you.
        detail:
        - The Vesk collective values mutual prosperity. May I offer my assistance
          in a trade?
        - We possess various technologies that may suit your journey. Shall we discuss
          an exchange?
        - Your voyage requires supplies; our stores are at your service if you wish
          to negotiate.
        aside:
        - I hope your engines remain stable.
        - A most productive meeting awaits us.
        - The stars are vast, but cooperation makes them smaller.
      choices:
      - text: I am interested. What do you have for trade?
        next_context: trade_catalog
        action: trade
      - text: Let's talk business. Show me your best tech.
        next_context: trade_catalog
        action: barter
    farewell:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#opener# #aside# #honorific#'
        opener:
        - It is time for your voyage to continue.
        - Your departure is noted and accepted.
        - The stars call you forward once more.
        detail:
        - may your systems remain functional
        - may your navigation paths remain clear
        - may your hull hold against the void
        honorific:
        - Safe travels, Captain {player}.
        - May you find prosperity in the next sector.
        - Our doors remain open to you, honored traveler.
        aside:
        - The Vesk will remember your presence
        - We shall miss our negotiations
        - Your reputation among my people grows
      choices:
      - text: May the stars watch over you as well.
        action: farewell
      - text: I look forward to our next negotiation.
        action: trade
    dossier_other:
    - grammar:
        origin:
        - '#opener# Regarding the {subject}, my professional assessment is as follows:
          #detail#'
        - 'I have observed {subject} extensively. While they possess certain... unique
          attributes, #detail#'
        - 'It is my formal duty to provide a perspective on {subject}. They are most
          notable for #detail#'
        opener:
        - In our records,
        - From a technical standpoint,
        - Upon cross-referencing the data,
        detail:
        - their engineering is surprisingly robust, despite their unconventional methods.
        - they represent a significant logistical variable in this sector's trade
          routes.
        - their cultural footprint is quite distinct from our own harmonious standards.
      choices:
      - text: Your assessment is noted. Tell me more about their tech.
      - text: That's a fair analysis. What do you think of our people?
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - Greetings, Captain {player}. It is my pleasure to assist you.
        - I have analyzed your logs, Captain {player}.
        - A most fortuitous opportunity has presented itself for your voyage.
        detail:
        - I possess data regarding the {target} you seek. You must set your course
          for sector {coords}. It is located approximately {distance} jumps away within
          the {band} band, where {reward} awaits.
        - Our scouts have pinpointed a {target} in the {band} band at sector {coords}.
          It is but {distance} jumps from your current position; I believe you will
          find {reward} there.
        - 'I shall provide the navigational data: Sector {coords} in the {band} band
          contains the {target} you require. At {distance} jumps out, it should yield
          {reward}.'
        aside:
        - A modest gesture of goodwill from the Vesk.
        - Knowledge is a gift best shared.
        - I believe this will be of great use to you.
      choices:
      - text: Thank you for the information. I'll head there now.
        action: accept_lead
      - text: Is this sector safe for my ship?
        next_context: safety_check_query
  selvani:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - Greetings, traveler.
        - A transmission is received.
        - Peace be upon your journey.
        detail:
        - The Selvani recognize the signal of {player}.
        - We sense a presence from {species} seeking contact.
        - Your broadcast reaches our senses clearly, Captain {player}.
        aside:
        - (We await your intent with open minds.)
        - (The void is vast; it is rare to hear such a clear call.)
      choices:
      - text: I am Captain {player}. I come seeking peaceful passage and information.
      - text: Identify yourselves. State your intentions for this sector.
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail# #aside#'
        opener:
        - I perceive a balance in your gaze, Captain.
        - Your presence here suggests a purpose beyond mere survival.
        - The void is vast, but our shared path may narrow.
        detail:
        - We of the Selvani seek mutual prosperity over conquest.
        - I am prepared to offer exchange for what you may provide.
        - My people value tangible cooperation above all else.
        aside:
        - Speak your terms, and we shall see if our paths align.
        - If you have something of value, I invite a formal trade.
        - 'Tell me: what do you seek, and what can you give in return?'
      choices:
      - text: I am looking for coordinates to a habitable world. What do you require?
        next_context: negotiation_start
        action: trade
      - text: I can offer minerals and fuel in exchange for your navigation data.
        next_context: barter_offer
        action: barter
    farewell:
    - grammar:
        origin:
        - '#opener# #detail# '
        - '#opener# #aside# '
        opener:
        - Your journey into the deep reaches begins now,
        - The path ahead is vast and daunting,
        - You depart our sphere with purpose,
        detail:
        - may your intent remain steadfast.
        - may you find the peace you seek among the stars.
        - may the coordinates provided lead you to a home of true warmth.
        aside:
        - the void is silent, but not empty,
      choices:
      - text: I hope our paths cross again in the stars.
        action: farewell
      - text: May the coordinates bring me home.
        action: accept_lead
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - Regarding the {subject}, I have observed them from a distance.
        - The {subject} are an interesting study in biology and intent.
        - My records on the {subject} are extensive, though my personal feelings remain
          cautious.
        detail:
        - They possess a vitality that is... intense. Their presence is a stark contrast
          to our own quietude.
        - They are driven by many impulses, making their path through the stars both
          erratic and formidable.
        - They prioritize strength in ways that our kind finds difficult to mirror.
        aside:
        - Forgive my hesitation; I prefer to weigh every word carefully.
        - Their energy is... palpable.
        - I speak this with the respect due to a neighboring lifeform.
      choices:
      - text: What do you fear most about them?
        next_context: fear_query
      - text: Do you believe we can coexist with them?
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - I have observed your journey, {player}, and I find your intent sincere.
        - It is my wish to assist you in your search for the {target}.
        - I offer this guidance in the spirit of peace.
        detail:
        - Set your path toward sector {coords}. It lies roughly {distance} jumps away
          within the {band} band, where {reward} awaits your arrival.
        - The way to the {target} is open to you. Navigate to coordinates {coords}
          in the {band} band; it is but {distance} jumps from your current position.
        aside:
        - We do not seek conflict, only shared discovery.
        - My people value such cooperation between our stars.
        - Knowledge should be shared freely among those who seek it honestly.
      choices:
      - text: I accept your guidance. Thank you for the coordinates.
        action: accept_lead
      - text: A generous offer, {species}. I shall begin the jump immediately.
        action: accept_lead
  helot:
