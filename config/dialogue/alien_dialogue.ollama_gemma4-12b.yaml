        aside:
        - It is an honest endeavor, one I hope you can respect.
        - A heavy burden for any traveler to bear alone.
      choices:
      - text: Tell me more about the conditions of this world.
        next_context: branch.inquiry
      - text: What is it that you require from my ship in exchange for these coordinates?
        next_context: trade_open
