        aside:
        - the coordinates for your next world are... currently unavailable.
        - at least keep your shield frequencies scrambled, {player}.
      choices:
      - text: Safe travels to you as well.
        action: farewell
      - text: I'll remember our dealings if I see your fleet again.
        action: trade
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - Ah, {subject}?
        - Regarding the {subject}...
        detail:
        - They are a waste of good scrap; their world is ripe for harvesting.
        - A crude lot. They cling to their soil like parasites, making it difficult
