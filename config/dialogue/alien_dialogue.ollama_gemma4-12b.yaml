        aside:
        - A messy business, harvesting them.
        - They scream quite loudly when the flux hits their drives.
        - Soft, screaming things.
      choices:
      - text: You sound like you've hunted them before.
        next_context: quill_experience
        action: accept_lead
      - text: I'm just looking for a trade route, not a fight.
        next_context: quill_cautious
        action: trade
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail# #aside#'
        opener:
        - Your greed is a familiar scent, little captain.
        - The void offers plenty to those with the stomach to take it.
        - A mutual understanding of profit... that is how we shall begin.
        detail:
        - I have mapped {target} for your use; set your drive for sector {coords}.
