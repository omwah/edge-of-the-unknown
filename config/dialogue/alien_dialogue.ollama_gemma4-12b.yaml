        next_context: farewell
        action: accept_lead
      - text: What makes you choose to help me specifically?
        next_context: trade_open
    branch.inquiry:
    - grammar:
        origin:
        - '#opener# #detail# #aside#'
        - '#opener# #detail#'
        opener:
        - Your curiosity regarding our paths is noted, Captain.
        - I shall speak plainly of the path forward, {player}.
        detail:
