        - A simple trade of information. Do not let my generosity go to waste.
        - The void is vast; do not falter once you reach the mark.
      choices:
      - text: I'll take the coordinates. Thank you.
        next_context: navigation_confirmed
        action: accept_lead
      - text: What is your price for this information?
        next_context: negotiation_start
        action: barter
  stryx:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#opener# #aside# #detail#'
        opener:
        - Static-hiss... Signal caught.
        - Zzzzt—transmission intercepted.
        - Krrr-chk. You pulse... loudly.
        detail:
        - The void is vast, {player}, but your ping is sharp.
        - Data-drift detected. You seek the path?
        - Carbon-form recognized. I see your sigil.
        honorific:
        - Small meat_thing.
        - Far-traveler of the void.
        - Fragile pulse-bearer.
