        aside:
        - The calculation is absolute.
        - Requesting your acknowledgment of these coordinates.
        - Data transmission complete.
      choices:
      - text: I'll set a course for those coordinates immediately.
        next_context: set_course
        action: accept_lead
      - text: Wait, are you giving this to me freely?
