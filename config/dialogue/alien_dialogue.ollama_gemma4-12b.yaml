species_grammars:
  terran:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail#'
        - 'Greetings, traveler. #detail#'
        - 'A signal from the void... #detail#'
        opener:
        - Captain.
        - Representative of the Federation.
        - Friend.
        detail:
        - It is an honor to establish contact with a {species} vessel in this sector.
        - We have been monitoring your trajectory; it is heartening to see another
          human spirit seeking the stars.
        - Peace be upon your voyage, {player}. We welcome your presence among our
          stars.
      choices:
      - text: I am Captain {player}. I come in peace to establish a diplomatic link.
        next_context: greeting
      - text: Identify yourself and your mission before we proceed.
        next_context: branch.inquiry
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside#'
        opener:
        - Greetings, Captain of the {alliance}.
        - It is an honor to meet a representative of {species}.
        detail:
        - We have observed your travels and find your cargo quite intriguing.
        - My people value cooperation; I believe we have much common ground to explore.
        - I am prepared to discuss an exchange of goods and information.
        aside:
        - The stars are vast, but mutual prosperity makes the journey shorter.
        - I sense a spirit of adventure in you, {player}.
      choices:
      - text: I am interested. What do you have in mind?
        next_context: trade_open
        action: trade
      - text: Tell me more about your people first.
        next_context: dossier_other
    farewell:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#opener# #aside# #detail#'
        opener:
        - The stars are vast, but our paths have crossed in a meaningful way.
        - It is time for your voyage to continue, Captain.
        detail:
        - Your courage in the face of the unknown has earned my respect.
        - May your engines run true and your path remain clear of debris.
        honorific:
        - Until our paths cross again, {player}.
        - Safe travels, representative of the Federation.
        aside:
        - A rare bond has formed between us today.
        - I find myself honored by our exchange.
      choices:
      - text: May we meet again in the stars.
        next_context: farewell
      - text: Your hospitality will not be forgotten.
        next_context: farewell
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#opener# #detail# #aside#'
        opener:
        - Regarding the {subject}, we have observed them closely.
        - The {subject} are a fascinating study in survival.
        - When it comes to the {subject}, my records show a complex history.
        detail:
        - They possess a tenacity that is both admirable and, at times, formidable.
        - Their culture is deeply rooted in their unique biology, shaping every facet
          of their society.
        - They are known throughout the sector for their uncompromising nature and
          fierce determination.
        - They have proven to be resilient neighbors within the Federation's sphere
          of influence.
        honorific:
        - A most noteworthy species among the stars.
        - They are a formidable presence in the galaxy, Captain {player}.
        aside:
        - Though they can be... intense during negotiations.
        - Indeed, their ways are quite different from our own Terran customs.
      choices:
      - text: Tell me more about their specific culture.
        next_context: dossier_other
      - text: I'll keep that in mind for our next encounter.
        next_context: farewell
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail# #aside#'
        opener:
        - 'Captain, my scans have identified a point of interest: the {target}.'
        - I have located the traces of the {target} you seek.
        - Our sensors have confirmed the presence of {target} in the local expanse.
        detail:
        - You must set your course for sector {coords}. It is roughly {distance} jumps
          away, situated within the {band} band. There, you will find {reward}.
        - Navigate to coordinates {coords}. It lies {distance} jumps out in the {band}
          region; {reward} awaits your arrival.
        - The path leads to sector {coords}, a distance of {distance} jumps within
          the {band} band. I believe {reward} is what you are looking for.
        aside:
        - It is an honor to assist a fellow explorer of the Federation.
        - Consider this a gesture of goodwill between our peoples.
        - I trust your navigation systems will hold steady during the transit.
      choices:
      - text: Thank you, I'll head straight for those coordinates.
        next_context: farewell
        action: accept_lead
      - text: That is a significant distance. What do you know of the area?
        next_context: branch.inquiry
    branch.inquiry:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#opener# #detail# #aside#'
        opener:
        - Your curiosity is a hallmark of your species, Captain.
        - Knowledge is the most valuable cargo we carry across the void.
        - I see you have a thirst for understanding the mechanics of our voyage.
        detail:
        - We seek to map not just the stars, but the paths between them.
        - The inquiry into {subject} is vital for those who wish to survive the reach
          beyond the Core.
        - To explore and ask 'why' is what makes a true explorer.
        honorific:
        - It is a privilege to share these truths with an ally of the Federation.
        - I appreciate your diligence in seeking clarity on our shared journey.
        aside:
        - Many travelers forget that questions are often more powerful than weapons.
        - Every discovery begins with a single, honest inquiry.
      choices:
      - text: Tell me more about the risks of this sector.
        next_context: branch.inquiry
      - text: What do you hope to find out here?
        next_context: branch.inquiry
  centaurian:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - Greetings, Captain.
        - Hail, traveler.
        - A warm welcome to you.
        detail:
        - It is an honor to speak with a representative of {species} in these quiet
          reaches of the void.
        - We find your presence in this sector most welcomed, {player}.
        - The stars are brighter when shared with old allies from the {alliance}.
        aside:
        - It is good to see a familiar face in your sector.
        - The lanes have been lonely of our kin lately.
      choices:
      - text: I'm Captain {player}. I'm looking for information on local trade routes.
        next_context: trade_open
      - text: I am simply passing through and seeking a safe harbor.
        next_context: offer_coordinates
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail# #honorific# #aside#'
        opener:
        - We find your presence in this sector most welcome, Captain.
        - Greetings, traveler. The Federation values our cooperation.
        detail:
        - My logistics team is prepared to exchange resources with you immediately.
        - I believe a mutually beneficial arrangement would suit both our interests
          well.
        honorific:
        - As a trusted ally of the Core,
        - As a fellow citizen of the lanes,
        aside:
        - let us discuss what goods you seek.
        - I invite you to propose your terms for trade.
      choices:
      - text: I'm interested. What do you have available?
        next_context: trade_open
        action: trade
      - text: Tell me more about your current inventory.
        next_context: trade_open
        action: barter
    farewell:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        - 'May your path stay clear, Captain. #aside# A true bond of the Core.'
        opener:
        - It has been an honor to host you aboard our station,
        - Safe travels on your journey through the sector,
        - The stars are vast, but my doors will always be open to you,
        detail:
        - may we find common ground again in the future.
        - your presence has bolstered the ties between {species} and {alliance}.
        - I look forward to our next negotiation among the stars.
        aside:
        - You carry the spirit of a true explorer.
        - Your resolve is commendable, {player}.
        - A reliable partner indeed.
      choices:
      - text: Until our paths cross again in the Core.
        next_context: farewell
      - text: I look forward to our next meeting.
        next_context: farewell
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail# #aside#'
        opener:
        - Ah, the {subject}? They are...
        - When it comes to the {subject}, I would say they are
        - Regarding your question about the {subject}...
        detail:
        - a complex people with a history quite different from our own.
        - brave, if somewhat unpredictable neighbors in the trade routes.
        - steadfast allies, even if their methods can be... intense.
        aside:
        - But we must remain cautious as we expand.
        - They have earned our respect over many cycles.
        - We share a common goal, despite our cultural differences.
      choices:
      - text: That is good to know. I'll keep that in mind during negotiations.
        next_context: dossier_other
      - text: Do you have any specific advice for dealing with them?
        next_context: branch.inquiry_advice
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail# #honorific# #aside#'
        opener:
        - Captain, my scans have detected a significant signal from the {target}.
        - I've managed to pinpoint the location of the {target} you're seeking.
        - It is my pleasure to share what I have found regarding the {target}.
        detail:
        - You should set your course for sector {coords}; it's roughly {distance}
          jumps out in the {band} band.
        - The coordinates are locked in at sector {coords}. It sits about {target}
          from here, deep within the {band} band.
        - I can guide you to sector {coords}—a journey of {distance} jumps into the
          {band} region.
        honorific:
        - As a friend of the Federation,
        - As a trusted ally in these lanes,
        - In the spirit of our shared cooperation,
        aside:
        - where you might find {reward}.
        - there, a {reward} awaits your arrival.
        - it is rumored to contain {reward}.
      choices:
      - text: Thank you, I'll head straight for those coordinates.
        next_context: offer_coordinates
        action: accept_lead
      - text: That sounds promising. Tell me more about what you found there.
        next_context: branch.inquiry
    branch.inquiry:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#opener# #detail# #aside#'
        opener:
        - Since you have chosen to dig deeper into the logistics of our joint operations,
        - It is a wise path to take, Captain. Understanding the 'why' behind our cooperation
          is vital.
        - I appreciate your diligence in seeking clarity on how {species} and humanity
          interact within these sectors.
        detail:
        - the protocols are designed to ensure that no single fleet remains isolated
          in the deep reaches of space.
        - our shared history in the Terran Federation means we prioritize stability
          above all else when patrolling your routes.
        - we view our presence here not just as a partnership, but as a commitment
          to the safety of everyone traveling {subject}.
        honorific:
        - It is an honor to share these secrets with a trusted ally like you.
        - We trust your judgment implicitly, and I am happy to provide this insight.
        - As a representative of our people, I can tell you that your curiosity is
          well-placed.
        aside:
        - There are many who would prefer we keep such matters strictly confidential.
        - It makes the long voyage much less daunting when there is a friend at the
          other end of the comms.
        - Truthfully, it simplifies our lives to have a direct line of communication
          with you.
      choices:
      - text: I appreciate the transparency. It makes me feel much safer out here.
        next_context: branch.inquiry_advice
      - text: Can you tell me more about the specific hazards you're monitoring?
        next_context: branch.inquiry
    branch.inquiry_advice:
    - grammar:
        origin:
        - '#opener# #detail# #aside#'
        - '#opener# #detail#'
        opener:
        - Forgive my candor, Captain.
        - As a long-time partner of the Federation,
        - The lanes are unforgiving, {player}.
        detail:
        - the greatest danger out here is not the vacuum, but your own eagerness to
          push into territory without proper scouts.
        - navigating these sectors requires a patience that often eludes those of
          your species.
        - survival depends on knowing when to retreat and when to hold your position.
        aside:
        - We Centaurians have seen many brave ships lost to the same mistakes.
        - Trust your sensors, but trust your instincts even more.
        - It is a hard lesson, but one I would give freely of my own experience.
      choices:
      - text: I appreciate the warning; I'll be more cautious.
        next_context: branch.inquiry_advice
      - text: Tell me more about these specific hazards.
        next_context: branch.inquiry
      - text: I'll take those words to heart, friend.
        next_context: farewell
  vesk:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#opener# #detail# #aside#'
        opener:
        - Greetings, traveler.
        - Salutations, Captain.
        detail:
        - Your transmission has reached our listening station.
        - We acknowledge your hail from the silent void.
        honorific:
        - It is an honor to establish this initial contact with a representative of
          {species}.
        - May our communication be as harmonious as the orbital tides. We welcome
          you, Captain {player}.
        aside:
        - We hope your journey through these sectors has been peaceful.
        - The Vesk are pleased to open this channel for formal dialogue.
      choices:
      - text: I am Captain {player}. I'm looking for information on the local sector.
        next_context: trade_open
      - text: I am a peaceful traveler. Is your people open to trade?
        next_context: trade_open
      - text: Identify yourselves and your intentions.
        next_context: greeting
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - Greetings, Captain.
        - Salutations, honored traveler.
        - I acknowledge your presence here.
        detail:
        - I am prepared to exchange my technologies for the resources you carry.
        - I would be honored to discuss a trade of goods and information with {player}.
        - My inventory is available should you wish to initiate a commercial transaction.
        aside:
        - Your ship's signature suggests a need for supplies.
        - Peace is found in mutual prosperity.
        - A favorable exchange benefits us both.
      choices:
      - text: I am interested. Let's see what you have for trade.
        next_context: trade_open
        action: trade
      - text: What specific technologies can you provide?
        next_context: branch.inquiry
    farewell:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#opener# #aside#'
        opener:
        - It is time for your vessel to depart, Captain {player}.
        - Your journey continues beyond our current sector.
        - The stars call you forward, Commander.
        detail:
        - May the gears of your engines never seize and your navigation remain true.
        - Our technical archives will remain open to your fleet should you require
          consultation.
        - I trust your hull remains reinforced against the void's many hazards.
        honorific:
        - Safe travels, honored envoy of {alliance}.
        - May the path ahead be prosperous for the people of {species}.
        - May your systems remain functional and your spirit stay resolute.
        aside:
        - Should you require further components or repairs, our trade frequencies
          remain active.
        - We shall value your presence in the sector's records.
      choices:
      - text: I hope to see your ports again soon.
        next_context: farewell
      - text: I may need some parts from you in the future.
        next_context: trade_open
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - Regarding the {subject}, my perspective is one of measured observation.
        - When evaluating the {subject}, I find their methodology quite distinct.
        detail:
        - They possess a complexity that demands significant diplomatic tact.
        - Their presence in this sector is noteworthy, though they remain unpredictable.
        - They are a formidable culture with technologies of great merit.
        - I find them to be an intriguing study in survival and adaptation.
        aside:
        - —it is rare to see such behavior—
        - —though I maintain my neutrality—
        - —if I may be so bold—
      choices:
      - text: Tell me more about their technology.
        next_context: trade_open
      - text: I see. Their presence is noted.
        next_context: farewell
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - Greetings, Captain {player}.
        - It is a pleasure to make your acquaintance.
        - I have observed your diligent travels through the stars.
        detail:
        - I possess data regarding {target} that may interest you. Should you navigate
          toward sector {coords}, approximately {distance} jumps away within the {band}
          band, you shall find {reward}.
        - My sensors have detected signs of {target}. I suggest a course correction
          to sector {coords} in the {band} corridor; it is only {distance} jumps away
          and contains {reward}.
        - I can offer you coordinates for {target}. If you travel {distance} jumps
          into the {band} band to reach sector {coords}, {reward} will be within your
          grasp.
        aside:
        - As a gesture of goodwill between our peoples,
        - In the spirit of peaceful cooperation,
      choices:
      - text: Thank you for your generosity. I will head there immediately.
        next_context: offer_coordinates
        action: accept_lead
      - text: That sounds promising. Tell me more about what you know of this area.
        next_context: branch.inquiry
    branch.inquiry:
    - grammar:
        origin:
        - '#opener# #detail# #honorific# #aside#'
        opener:
        - It is a pleasure to delve deeper into your inquiries regarding our technical
          infrastructure.
        - I shall endeavor to provide further clarity on the systems you seek to understand.
        detail:
        - The {species} have spent generations perfecting the integration of organic
          circuitry and neural-link relays.
        - Our proprietary fabrication methods allow for high-efficiency output, specifically
          regarding the production of {item}.
        honorific:
        - I trust this level of detail suffices for your logbook, Captain.
        - It is my duty to ensure you are fully informed before we proceed with any
          formal agreements.
        aside:
        - May I suggest that such knowledge is the cornerstone of a successful voyage?
        - Knowledge is the most valuable currency in this sector's desolate expanse.
      choices:
      - text: Tell me more about your integration techniques.
        next_context: branch.inquiry
      - text: How does this impact the cost of {item}?
        next_context: trade_open
  selvani:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside# #detail#'
        opener:
        - Greetings, traveler from the stars.
        - A signal reaches us. You speak, {player}.
        detail:
        - The Selvani recognize your transmission as a peaceful inquiry regarding
          our shared reach.
        - We acknowledge your presence in this sector; we are at peace, and hope you
          are too.
        aside:
        - (The many limbs of the speaker shift slightly as they process your audio
          waves.)
        - (A soft chime resonates from their habitat.)
      choices:
      - text: I am Captain {player}. I seek a peaceful exchange regarding habitable
          systems.
        next_context: trade_open
      - text: Identify yourselves. I'm looking for a new home for my people.
        next_context: branch.inquiry
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail# #aside#'
        opener:
        - Greetings, traveler of the deep.
        - I sense your intent, Captain {player}.
        - The stars are vast, and few paths cross with such purpose.
        detail:
        - The Selvani value honest exchanges over mere acquisition.
        - A fair exchange of knowledge or resources would please my people.
        - I am prepared to discuss a mutual arrangement for the passage ahead.
        aside:
        - Tell me, what do you offer in return for our cooperation?
        - If your heart is steady, we may find common ground.
        - Speak clearly, and we shall see if our goals align.
      choices:
      - text: I have resources I can offer. Tell me what you need.
        next_context: trade_open
        action: barter
      - text: I am looking for habitable coordinates. Is that something we can discuss?
        next_context: offer_coordinates
        action: trade
    farewell:
    - grammar:
        origin:
        - '#opener# #detail# '
        - '#opener# #aside# '
        opener:
        - The path before you is vast, Captain.
        - Your journey toward the stars continues.
        detail:
        - May your navigation be true and your hull remain intact.
        - May the void be kind to those who seek new horizons.
        aside:
        - The silence of space is heavy, yet full of potential.
        - Your resolve has been noted by my kin.
      choices:
      - text: I hope our paths cross again in the stars.
        next_context: farewell
      - text: Thank you for your cooperation, Selvani.
        next_context: offer_coordinates
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail# #aside#'
        opener:
        - Regarding the {subject}, my thoughts are tempered by caution.
        - When I observe the {subject}, I feel a deep sense of unease.
        - The {subject} are a complex people, far removed from our ways.
        detail:
        - They possess a drive for conquest that borders on the reckless.
        - Their methods are often... blunt. They do not value subtlety as we do.
        - They are formidable in conflict, though I hope they never find a reason
          to engage us.
        aside:
        - I would advise you to tread carefully among them, {player}.
        - Their strength is undeniable, yet it creates a shadow of fear.
        - May your diplomacy be swifter than their blades, captain.
      choices:
      - text: Your caution is noted. Tell me more about their territory.
        next_context: dossier_other
      - text: I prefer to keep my distance from them for now.
        next_context: farewell
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail# #aside#'
        opener:
        - I have observed your path, {player}, and I find your intent honorable.
        - The stars hold many secrets, but some are meant for those who seek with
