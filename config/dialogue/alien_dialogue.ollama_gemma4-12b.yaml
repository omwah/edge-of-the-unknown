        - '[Scanning orbital data...]'
      choices:
      - text: Do you consider them a threat to our mission?
        next_context: threat_assessment
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail# #aside#'
        opener:
        - Data analysis confirms your presence, Captain {player}.
        - The path to {target} is mapped.
        - Input required. I provide the spatial data for {target}.
        detail:
        - 'Navigate to sector {coords}. Distance: {distance} jumps in the {band} band.
