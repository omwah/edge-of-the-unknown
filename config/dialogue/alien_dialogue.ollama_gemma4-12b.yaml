        action: trade
    farewell:
    - grammar:
        origin:
        - '#opener# #detail#'
        - '#opener# #aside#'
        opener:
        - The void claims what is left behind,
        - May your engines hold steady,
        detail:
        - and may your path remain free of scavenging hooks.
