    # The morality_judge verdict (§6.2, WP33): the hook audits the player's alignment before
    # this line speaks and persists a `judged_<verdict>` stage, surfaced as the `sig_stage`
    # fact — gate on it (never a transient fact) so the projection reconstructs the same line
    # the reducer speaks. The catch-all covers the validator probe (which pins no facts).
    sig.morality_judge.verdict:
      - when:
          criteria: { sig_stage: judged_blessed }
        variants:
          - The scales rise in thy favour, {player}. Thy deeds shine, and the Concordance sets its blessing upon thee — go forth in grace.
          - We have weighed thy conduct and found virtue. Be blessed, child of {alliance}; the drifting eye of the Cosmic One watches over thy path.
