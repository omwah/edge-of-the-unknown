          - text: I will earn back your favour.
            next_context: farewell
            action: leave
          - text: Judge me again, then.
            next_context: sig.morality_judge.verdict
      - when:
          criteria: { sig_stage: judged_weighed }
        variants:
          - Thy ledger hangs in balance, {player}. Neither blessed nor damned — the Concordance marks thee, and drifts on to weigh thee anew.
          - The scales tremble, unsettled. Go, child of dust; thy deeds are noted, and we shall judge thee again when thy path has spoken further.
        choices:
          - text: I will strive to prove myself.
            next_context: farewell
            action: leave
          - text: Weigh me once more.
            next_context: sig.morality_judge.verdict
