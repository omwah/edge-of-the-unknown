        variants:
          - Thy ledger runs black with ruin, {player}. The Concordance pronounces its curse upon thee — thou art marked, and no drift shall carry us from thy reckoning.
          - We have weighed thy slaughters, and the balance condemns thee. Bear the curse of the Cosmic One, wretch of {alliance}, until thy deeds are unmade.
