species_grammars:
  terran:
    greeting:
      # CALLBACK fact (WP30): a returning captain is greeted as a known friend. The
      # catch-all grammar entry below still carries first-contact and every other visit.
      - when:
          criteria: { met_before: true }
        variants:
          - Good to see your signature again, {player} — the Federation logs your return with pleasure.
          - Back on our scopes, Captain. A familiar transponder is always welcome in Core space.
          - Welcome back, envoy of {alliance}. Our records show we have spoken before; the door stays open.
      - grammar:
          origin:
            - '#opener#, #honorific# {player}. #detail# #aside#'
          opener:
            - Greetings
            - Salutations
            - Secure channel open
            - Always good to see a friendly signature on the long-range scanners
          honorific:
            - fellow Terran
            - Captain
            - explorer
            - envoy of {alliance}
          detail:
            - We are broadcasting on standard Federation frequencies.
            - The Terran Federation welcomes peaceful contact and scientific exchange.
            - How fares your journey? The Core systems stand ready to support you.
            - We seek to establish secure trade networks and mutual security agreements
              in this sector.
          aside:
            - (Diplomatic beacon broadcasting.)
            - (Comm-link stabilized.)
            - (Scanning for transponder data.)
            - (Federation greeting protocols active.)
        choices:
          - text: Let's trade resources.
            next_context: trade_open
            action: trade
          - text: What information do you have on other species in this sector?
            next_context: dossier_other
          - text: I am looking for coordinates to explore.
            next_context: offer_coordinates
          - text: Safe travels, Captain. Signing off.
            next_context: farewell
            action: leave
          - text: Tell me about the Terrans.
            next_context: dossier_self
    trade_open:
      - grammar:
          origin:
            - '#opener#, #honorific#. #detail#. #aside#'
          opener:
            - Greetings
            - Welcome
            - It is a pleasure to make contact
          honorific:
            - Captain {player}
            - fellow {species}
            - friend
          detail:
            - The Federation is ready to trade technology and resources for mutual
              benefit
            - We have cleared our inventory of surplus Core tech for trade
            - Our mandate supports open commerce to strengthen our networks
          aside:
            - (Trade is the lifeblood of our cooperation.)
            - (Let's see what we can exchange today.)
            - (We are eager to support the efforts of the {alliance}.)
        choices:
          - text: Let's see what you have for sale.
            next_context: trade_open
            action: trade
          - text: Can we negotiate a better deal?
            next_context: trade_open
            action: barter
          - text: I should get going.
            next_context: farewell
            action: leave
    farewell:
      # SESSION fact (WP28): if the player traded this visit, the send-off acknowledges it.
      # The catch-all grammar entry below covers a visit that ended without a deal.
      - when:
          criteria: { traded: true }
        variants:
          - A good exchange, {player}. The Federation profits from friends like you — safe travels.
          - Our holds are the better for your custom today, Captain. Clear skies until the next manifest.
      - grammar:
          origin:
            - '#opener# #detail# #aside#, #honorific#.'
          opener:
            - Safe travels, Captain {player}.
            - May the stars guide you, {player}.
            - Farewell for now, {player}.
          detail:
            - The Federation is stronger with you out there representing the {alliance}.
            - We look forward to your next report from the frontier representing the
              {alliance}.
            - Remember that the Core will always welcome back a pathfinder of the
              {species}.
          honorific:
            - commander
            - officer
            - envoy
            - friend
          aside:
            - Keep your shields high
            - Clear skies and good hunting
            - Be safe out there on the frontier
        choices:
          - text: For the Federation. Farewell.
            next_context: farewell
            action: leave
          - text: Before I go, let's look at the manifest.
            next_context: trade_open
            action: trade
    dossier_other:
      - grammar:
          origin:
            - '#opener#, #honorific#. #detail#. #aside#'
          opener:
            - As we monitor {subject}
            - Regarding {subject}
            - When we look at the data on {subject}
          detail:
            - We believe a diplomatic solution is possible and are drafting a treaty
            - The Federation hopes to establish a mutual security pact to ensure stability
            - Our mission is to foster peaceful contact and open trade relations
          honorific:
            - Captain {player}
            - my fellow explorer
            - esteemed traveler
          aside:
            - A stable peace is always worth the diplomatic effort.
            - As you know, we always prefer consensus to conflict.
            - We must represent the Federation's highest ideals out here.
        choices:
          - text: Tell me about another species.
            next_context: dossier_other
          - text: Understood. I must be on my way.
            next_context: farewell
            action: leave
          - text: Let's discuss trade agreements.
            next_context: trade_open
            action: trade
          - text: Tell me about the Terrans instead.
            next_context: dossier_self
    offer_coordinates:
      - grammar:
          origin:
            - '#opener#, #honorific#. #detail#. #aside#'
          opener:
            - Since we're both flying under the Federation banner, I'd like to do
              you a quick favor
            - As a gesture of goodwill between fellow Terran explorers, I want to
              share some valuable sensor data with you
            - I've got some good news for you, and I'd like to share the coordinates
            - Since we're both out here charting the unknown, let me log some telemetry
              in your nav-computer
          detail:
            - Set course for the {target} at sector {coords}, in the {band}. It is
              about {distance} jumps out, where {reward} awaits
            - There is a {target} at sector {coords} in the {band}. It's roughly {distance}
              jumps away, where you will find {reward}
            - Our scouts located a {target} in sector {coords}. Make the {distance}-jump
              journey into the {band}, where {reward} is waiting
          honorific:
            - Captain
            - my friend
            - fellow explorer
            - colleague
          aside:
            - Safe travels out there in the dark.
            - The Federation is proud of your efforts.
            - May your engines run hot and your shields hold.
            - Please transmit your findings back to the Core when you return.
        choices:
          - text: Thank you, Commander. I will set course for sector {coords} right
              away.
            next_context: farewell
            action: accept_lead
          - text: I appreciate the intel. Safe travels.
            next_context: farewell
            action: accept_lead
    treaty_offer:
      - variants:
          - The Federation is always open to mutual defense, {player}.
          - We believe peace is the natural state of the galaxy. Let us formally declare
            it.
          - A treaty with the Terran Federation? We welcome the proposal.
    treaty_grant:
      - variants:
          - The accord is signed. We stand together, {player}.
          - Let the stars bear witness to this peace.
          - Welcome to the alliance, friend {player}.
    treaty_refuse:
      - variants:
          - The Federation Senate cannot ratify this, {player}.
          - We cannot formalize relations under these circumstances.
          - Peace is an ideal, but this treaty is impossible right now.
    treaty_condition:
      - variants:
          - Diplomacy requires trust. You have not yet earned ours, {player}.
          - The Federation requires a demonstration of your goodwill first.
          - Prove your peaceful intentions, and we shall revisit this.
    dossier_self:
      - when:
          standing: hostile
        variants:
          - The Terrans do not share our history with those we do not trust.
          - Why should we tell you of our ways, traveler?
      - when:
          standing: neutral
        variants:
          - The Terrans do not share our history with those we do not trust.
          - Why should we tell you of our ways, traveler?
      - when:
          standing: wary
        variants:
          - The Terrans do not share our history with those we do not trust.
          - Why should we tell you of our ways, traveler?
      # SESSION fact (WP28): a trusted captain who already asked about another species this
      # visit gets a repeat-question reaction. Pinned to `friendly` so it never overrides the
      # low-standing refusals above (which withhold this lore); carries the same sub-topic menu
      # so navigation is unchanged. The friendly catch-all below handles the first such question.
      - when:
          standing: friendly
          criteria: { asked.dossier_other: true }
        variants:
          - You inquired after the others; turn those questions on us, then — what would you know of the Terrans?
          - Fair is fair, Captain — you have weighed our neighbours, so weigh us too. What would you like to know?
        choices:
          - text: Tell me about your biology and appearance.
            next_context: branch.dossier_self.biology_and_appearance
          - text: Tell me about your psychology and culture.
            next_context: branch.dossier_self.psychology_and_culture
          - text: Tell me about your diplomacy and behavior.
            next_context: branch.dossier_self.diplomacy_and_behavior
          - text: Tell me about your relationships.
            next_context: branch.dossier_self.relationships
          - text: Tell me about your combat and ships.
            next_context: branch.dossier_self.combat_and_ships
          - text: Never mind.
            next_context: back
      - variants:
          - We are the Terrans, of {alliance}. What would you like to know about us?
        choices:
          - text: Tell me about your biology and appearance.
            next_context: branch.dossier_self.biology_and_appearance
          - text: Tell me about your psychology and culture.
            next_context: branch.dossier_self.psychology_and_culture
          - text: Tell me about your diplomacy and behavior.
            next_context: branch.dossier_self.diplomacy_and_behavior
          - text: Tell me about your relationships.
            next_context: branch.dossier_self.relationships
          - text: Tell me about your combat and ships.
            next_context: branch.dossier_self.combat_and_ships
          - text: Never mind.
            next_context: back
    branch.dossier_self.biology_and_appearance:
      - variants:
          - We are carbon-based lifeforms of standard physiology; while we lack inherent
            physical extremes without technological augmentation, our adaptability
            allows us to thrive in many environments. We require a balanced oxygen-nitrogen
            atmosphere, much like the one {player} enjoys here.
        choices:
          - text: Go back.
            next_context: back
    branch.dossier_self.psychology_and_culture:
      - variants:
          - We are a people of peace and discovery, driven by a commitment to scientific
            progress and the strength found in democratic consensus. We believe that
            lasting stability is forged through the integrity of institutional treaties
            and the pursuit of meaningful connection with all species.
        choices:
          - text: Go back.
            next_context: back
    branch.dossier_self.diplomacy_and_behavior:
      - variants:
          - We welcome your people with open hearts, seeking to forge enduring security
            pacts and thriving trade networks alongside the {species}. As the architects
            of the Core’s technology, we hope to build a prosperous future together.
        choices:
          - text: Go back.
            next_context: back
    branch.dossier_self.relationships:
      - variants:
          - As members of the Federation, we stand as primary architects alongside
            our Centaurian allies, though our resolve remains firm against the ambitions
            of the Verdant Compact, the Iron Covenant, and the Liberty Front.
        choices:
          - text: Go back.
            next_context: back
    branch.dossier_self.combat_and_ships:
      - variants:
          - While we strive to resolve all conflicts through peaceful diplomacy, our
            fleet—including the Trailblazer-class vessels and our dedicated Federation
            Fighters—stands ready to defend the Core systems with unwavering resolve
            should tensions escalate.
        choices:
          - text: Go back.
            next_context: back
    combat_open:
      - grammar:
          origin:
            - '#opener# #detail# #honorific#. #aside#'
            - '#opener# #honorific#, #detail#. #aside#'
            - '#opener# #detail#. #aside#'
          opener:
            - Federation protocol dictates we offer terms, but your incursions leave
              no room for diplomacy.
            - I am authorized by the Core command to use whatever force is necessary
              to secure this sector.
            - Federation high command has flagged your vessel as a security threat.
          detail:
            - Power down your shields immediately and prepare to be boarded
            - Your vessel has violated sovereign Core space, and we must neutralize
              the threat
            - We are opening fire to defend the principles of the Federation
          honorific:
            - captain {player}
            - commander
            - '{player}'
          aside:
            - May history judge our cause as just.
            - Prepare to defend yourself.
            - This is for the security of the Core.
        choices:
          - text: Federation? I am one of you! Hold your fire!
            next_context: surrender
          - text: We don't have to do this, Captain. Let's talk.
            next_context: branch.inquiry
          - text: If it's a fight you want, you've got one.
            next_context: combat_taunt
            action: attack
          - text: Powering down engines. Don't shoot!
            next_context: surrender
    combat_taunt:
      - grammar:
          origin:
            - '#opener#, {player}. #detail# #aside#'
            - '#opener#, #honorific#. #detail# #aside#'
            - '#opener#—#aside# #detail#'
          opener:
            - Stand down your vessels
            - Federation protocol demands your immediate compliance
            - This is Captain {player} of the Federation forces, calling on your surrender
            - We have you outmaneuvered
          detail:
            - The {alliance} coordinates this airspace, and your presence violates
              treaty boundaries.
            - Our tactical division has already mapped your trajectory; retreat is
              your only logical vector.
            - The {species} systems are protected by Federation mandate, and we will
              enforce it.
            - Your current combat capabilities do not match our Trailblazer-class
              hull configurations.
          honorific:
            - honored traveler
            - wayward captain
            - unaffiliated vessel
          aside:
            - (All batteries, maintain target lock.)
            - (Ensure wideband broadcast remains active for recording.)
            - (Redirect shield power to the vanguard.)
        choices:
          - text: We don't want to fight the Federation. Let's talk terms.
            next_context: treaty_offer
          - text: We will stand our ground against your Trailblazers!
            next_context: combat_taunt
            action: attack
          - text: Powering down weapons. We surrender.
            next_context: surrender
          - text: Initiating emergency warp out of here!
            next_context: flee_scorn
            action: leave
    surrender:
      - grammar:
          origin:
            - '#opener# #detail#, #honorific#.'
            - '#honorific#, #opener# #detail#. #aside#'
            - '#opener# #detail#. #aside# #honorific#.'
          opener:
            - We yield the field.
            - The Federation forces under my command capitulate.
            - Power down your weapons, {player}, we are standing down.
            - This engagement is over, we are signaling our surrender.
          detail:
            - our hulls are compromised and we cannot sustain further damage
            - our engines are failing and we request immediate quarter under Core
              treaties
            - we ask that you respect the rules of engagement and accept our capitulation
            - we stand ready to discuss terms of ceasefire and safe passage
          honorific:
            - Captain
            - Officer
            - Commander
            - representative of the {species}
          aside:
            - Further bloodshed serves neither the Core nor our mission.
            - Let us resolve this as civilized spacefarers.
            - We honor the treaty protocols; we expect you will do the same.
            - Our sensors show we are completely outmatched.
        choices:
          - text: Stand down. I accept your surrender.
            next_context: treaty_condition
            action: barter
          - text: No quarter. Prepare to be boarded.
            next_context: combat_taunt
            action: attack
          - text: We're leaving you to drift.
            next_context: farewell
            action: leave
    flee_scorn:
      - grammar:
          origin:
            - '#opener# #detail# #honorific# #aside#'
            - '#opener# #detail# #aside#'
            - '#opener# #honorific#, #detail#'
          opener:
            - Running, {player}?
            - Is that the famous Federation resolve?
            - An interesting tactical choice, Captain.
            - Tactical retreat or outright flight?
          detail:
            - Your thrusters are venting quite a bit of panic.
            - We expected more from a Trailblazer class hull.
            - The Core's finest, burning fuel just to escape.
            - Leaving so soon when diplomatic talks had just begun?
          honorific:
            - my esteemed colleague
            - Representative
            - Captain
            - pioneer
          aside:
            - We'll update our reports on {species} bravery.
            - Let's hope your shields hold while you run.
            - Perhaps we can discuss treaty terms when you stop running.
            - Safe travels back to the Core.
        choices:
          - text: This isn't over.
            next_context: combat_taunt
            action: attack
          - text: We need to regroup.
            next_context: farewell
            action: leave
    betrayal:
      - grammar:
          origin:
            - '#opener# #detail# #honorific#. #aside#'
            - '#honorific#, #opener# #detail# #aside#'
            - '#opener# #detail# #aside# #honorific#.'
          opener:
            - I am invoking Article 9 of the Federation Charter to suspend our accord.
            - The High Council has re-evaluated our standing, {player}.
            - Federation security protocols demand immediate tactical containment.
            - My deepest apologies, but the grand compromise requires this course.
          detail:
            - We must secure {subject} for the Core, even if we must salvage it from
              your hull.
            - Your continued operations threaten the treaty we signed with the {alliance}.
            - The strategic value of this sector outweighs any personal ties we shared.
            - A stable peace requires the elimination of unpredictable elements like
              your vessel.
          honorific:
            - Captain
            - my dear colleague
            - envoy
            - fellow pioneer
          aside:
            - Powering weapons is merely a logistical necessity.
            - It is nothing personal; simply the cost of democratic consensus.
            - Please stand down; let us resolve this with as little friction as possible.
            - We will record your contribution to scientific progress in the archives.
        choices:
          - text: Federation protocols? This is outright treason!
            next_context: combat_taunt
            action: attack
          - text: We signed a treaty. Does the Core's word mean nothing?
            next_context: treaty_refuse
          - text: I'm leaving. Don't make this a war.
            next_context: flee_scorn
            action: leave
    branch.inquiry:
      - grammar:
          origin:
            - '#opener# #detail#, #honorific#. #aside#'
            - '#opener# #detail# #aside#, #honorific#.'
            - '#opener# we can delve into #detail#, #honorific#. #aside#'
          opener:
            - Our databases are open to you, Captain.
            - I am happy to share Federation insights.
            - A principled dialog is the cornerstone of our alliance.
            - Let us exchange knowledge, as fellow explorers.
          detail:
            - regarding the standard classification of {species}
            - on the current strategic coordinates of {coords}
            - concerning our ongoing research on {subject}
            - about the distribution of {item} across the Core systems
          honorific:
            - my esteemed colleague
            - Captain {player}
            - fellow pioneer of the stars
            - envoy
          aside:
            - What specifically does the Federation archives need to clarify for you?
            - We believe shared knowledge breeds mutual security.
            - The Core benefits when information flows freely.
            - We have compiled at least {count} entries on this topic.
        choices:
          - text: Tell me more about the psychology and culture of your people.
            next_context: branch.dossier_self.psychology_and_culture
          - text: I'd like to ask about your diplomatic relationships.
            next_context: branch.dossier_self.relationships
          - text: Let's discuss trade opportunities.
            next_context: trade_open
            action: trade
          - text: I must return to my duties.
            next_context: farewell
            action: leave
  centaurian:
    greeting:
      # CALLBACK fact (WP30): the player has already followed a tip this species gave to its
      # sector, so the greeting asks after the outcome. `lead_followed` is always present.
      - when:
          criteria: { lead_followed: true }
        variants:
          - Welcome back, {player}! Did the coordinates we shared bear fruit? We are always glad when a friend's journey pays off.
          - So you reached the sector we pointed you toward. Tell us — was the reading true? Your reports help us all.
      - grammar:
          origin:
            - '#opener#, #honorific#. #detail#. #aside#'
          opener:
            - A warm welcome to you
            - Greetings
            - Salutations, Captain
          honorific:
            - fellow citizen of the {alliance}
            - valued partner on these lanes
            - trusted friend
          detail:
            - our {species} crew is pleased to see a Terran vessel in this sector
            - we are always glad to assist a human explorer out here
            - it is an honor to share these stars with your kind
          aside:
            - (I am transmitting our local navigation data to your ship, {player}.)
            - (We hope your journey through the {alliance} remains peaceful.)
            - (Please let us know if your ship requires assistance, {player}.)
        choices:
          - text: I'd like to see what licenses or goods you have for trade.
            next_context: trade_open
            action: trade
          - text: Do you have any local sensor data or sector coordinates?
            next_context: offer_coordinates
          - text: Just passing through. Safe travels.
            next_context: farewell
            action: leave
          - text: Do you have any diplomatic intelligence on other species?
            next_context: dossier_other
          - text: Tell me about the Centaurians.
            next_context: dossier_self
    trade_open:
      - grammar:
          origin:
            - '#opener#, #honorific#. #detail# #aside#'
          opener:
            - We welcome this opportunity to trade
            - Our vessel is ready to facilitate an exchange
            - Let us look over our mutual manifests
          honorific:
            - respected {player}
            - noble citizen of the {alliance}
            - esteemed representative of the {species}
          detail:
            - We have navigation logs and sensor packages registered for transfer.
            - As partners, we offer full access to our surplus navigation data and
              components.
            - All our goods are certified under {alliance} maritime law.
          aside:
            - (Our sensors show peaceful intentions on both sides.)
            - (It is always a pleasure to meet a fellow traveler on the lanes.)
            - (Shared prosperity builds a stronger community.)
        choices:
          - text: Show me your navigation licenses and sensor tech.
            next_context: trade_open
            action: trade
          - text: Let's see if we can work out a mutually beneficial deal.
            next_context: trade_open
            action: barter
          - text: I must decline for now. Safe travels on the lanes.
            next_context: farewell
            action: leave
    farewell:
      - grammar:
          origin:
            - '#opener# #honorific#, #detail# #aside#'
          opener:
            - Safe travels through the sector,
            - Smooth sailing on the trade lanes,
            - May your journey be peaceful,
          honorific:
            - Captain {player}
            - honored partner of the {alliance}
            - my fellow citizen
          detail:
            - the {species} will keep the navigation beacons active for you.
            - we are proud to stand with the {alliance} in securing the Core.
            - our patrol vessels remain ready to support your fleet.
          aside:
            - (Keep your sensor licensing updated.)
            - (We will see you back at the Core stations.)
            - (The rule of law guides us both.)
        choices:
          - text: Thank you. Safe journeys to you as well.
            next_context: farewell
            action: leave
          - text: Until next time, citizen.
            next_context: farewell
            action: leave
    dossier_other:
      - grammar:
          origin:
            - '#opener#. #detail#. #aside#, #honorific#.'
          opener:
            - Ah, {subject}
            - Regarding {subject}
          detail:
            - They do not always share our commitment to the rule of law, which can
              complicate trade agreements under the {alliance}
            - While their cultural priorities differ from our shared values, we believe
              structured diplomacy is the path forward
          honorific:
            - Captain
            - my friend
          aside:
            - We must remain vigilant, of course
            - A stable sector benefits all of us, after all
        choices:
          - text: Do you think they pose a threat to the Federation?
            next_context: branch.threat
          - text: Let's talk about something else.
            next_context: greeting
          - text: Thank you for your thoughts. Farewell.
            next_context: farewell
            action: leave
          - text: Let's discuss mutual trade.
            next_context: trade_open
            action: trade
          - text: Do you have any diplomatic intelligence on other species?
            next_context: dossier_other
          - text: Tell me about the Centaurians instead.
            next_context: dossier_self
    offer_coordinates:
      - grammar:
          origin:
            - '#opener#, #honorific#. #detail# #aside#'
          opener:
            - In the spirit of our shared treaty under the {alliance}, I want to share
              a discovery with you
            - As a fellow citizen of the Core, it is my pleasure to assist you with
              some new navigation data
            - Our {species} patrol vessels have mapped a point of interest that is
              missing from your star charts
          honorific:
            - Captain
            - my friend
            - fellow traveler
          detail:
            - Set course for sector {coords} — about {distance} jumps out, in the
              {band} — where you will find the {target}. According to our logs, {reward}
              awaits there
            - If you plot a course to sector {coords} in the {band}, which is about
              {distance} jumps from here, you can investigate the {target} and salvage
              {reward}
          aside:
            - Safe transit on the lanes, {player}.
            - May order and prosperity follow you there, {player}.
            - We Centaurians are always glad to assist a Terran partner.
        choices:
          - text: Thank you. I'll head to those coordinates and check it out.
            next_context: farewell
            action: accept_lead
          - text: Do you have any other information about this sector?
            next_context: dossier_other
          - text: Let's trade instead.
            next_context: trade_open
            action: trade
    branch.threat:
      - grammar:
          origin:
            - '#opener# #honorific#, #detail#—#aside#'
          opener:
            - Regarding the safety of our shared lanes
            - As fellow members of the {alliance}, we must remain vigilant
            - We have noted some troubling activity in this sector
          honorific:
            - captain {player}
            - my friend
            - respected colleague
          detail:
            - our patrol vessels detected hostile {species} ships lurking near the
              jump point
            - scouts reported that {count} unidentified raiders have been scanning
              local shipping lanes
            - we have received reports of disruptions concerning the trade of {item}
              in nearby sectors
          aside:
            - though our defenders are coordinating with Terran command
            - but our joint task forces are already response-ready
            - and we must stand together to ensure our mutual security
        choices:
          - text: I can help clear out those hostile ships.
            next_context: offer_coordinates
          - text: Tell me more about the ships you spotted.
            next_context: branch.threat
          - text: Perhaps I should trade for better equipment first.
            next_context: trade_open
            action: trade
          - text: Thank you for the warning. I must go.
            next_context: farewell
            action: leave
          - text: Do you have any diplomatic intelligence on other species?
            next_context: dossier_other
          - text: Tell me about the Centaurians.
