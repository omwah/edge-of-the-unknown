species_grammars:
  terran:
    greeting:
    - grammar:
        origin:
        - 'Greetings, #opener#.'
        - We sense the presence of {player} from the {species}. We are always eager
          to greet a representative of the Terran Federation.
        opener:
        - Welcome, Captain. It is truly an honor...
      choices:
      - text: Greetings. We have long awaited a chance to meet the Core.
        next_context: greeting
      - text: We seek trade agreements. What do you offer?
        next_context: trade_open
        action: trade
      - text: I have coordinates for an uncharted anomaly.
        next_context: offer_coordinates
        action: accept_lead
    trade_open:
    - grammar:
        origin:
        - 'Greetings, #opener#! We of the {species} welcome you, {player}. Perhaps
          we can discuss trade? #aside#'
        opener:
        - By our protocols,
        - We extend a hand,
        aside:
        - I believe we could come to an agreeable arrangement.
      choices:
      - text: What do you have for trade?
        next_context: trade_open
        action: trade
    farewell:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - Greetings, {player}.
        detail:
        - It has been a true honor to share this void with representatives of the
          Terran Federation.
        - We have learned much from your passage through these sectors.
        honorific:
        - May your journey onward be as profound as our memories.
      choices:
      - text: Farewell, and may your path be clear.
        action: farewell
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail#'
        opener:
        - Greetings, {player}. Regarding {subject}...
        - I have observed {subject}, {player}.
        detail:
        - ': In my view, they possess a remarkable tenacity; few species match that
          spirit.'
        - ': From our perspective within the Core, they present... an enigma to be
          managed.'
        - ': I find their nature... most complex when compared to {alliance}.'
      choices:
      - text: What do you mean by 'manage'?
        next_context: dossier_other
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - My esteemed friend, {player}.
        detail:
        - 'I know of a place you seek: the {target}.'
        - You may have missed it among your scouting passes, but I cannot let you
          pass without guidance.
        honorific:
        - Set course for sector {coords} — about {distance} jumps out, in the {band}.
          There, {reward} awaits.
      choices:
      - text: Thank you. I accept your lead.
        next_context: offer_coordinates
        action: accept_lead
  centaurian:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - Greetings, {player}. It is good to see a vessel from the reach of {alliance}.
        detail:
        - We have always valued such open communication among species like yours.
        - The Core has seen many comings and goings, but your signal was distinct.
        honorific:
        - Welcome to these sectors; we hope your journey onward is prosperous.
        - May the pathways remain clear for you and all of {species}.
      choices:
      - text: We arrived seeking trade contacts.
        next_context: trade_open
        action: trade
      - text: We just passing through for now.
        next_context: farewell
        action: farewell
      - text: What is the status of Federation patrols here?
        next_context: branch.inquiry
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - Greetings, friend {player}. We see your vessel has arrived at our station.
        detail:
        - We are always open to the exchange of ideas and goods among reliable partners
          like yourself. Perhaps we can discuss some trade arrangements?
        - As a founding partner of the Federation, the Centaurians value fair exchange.
          If you have commodities or knowledge you wish to barter, please let us know.
        honorific:
        - We invite your proposal.
      choices:
      - text: What are you looking to trade for?
        next_context: dossier_other
        action: barter
      - text: We have goods you might find interesting.
        next_context: trade_open
        action: trade
      - text: I'm just passing through, thank you.
        next_context: farewell
        action: farewell
    farewell:
    - grammar:
        origin:
        - 'Our continued trust in you, #opener# #detail# #honorific# #aside#.'
        opener:
        - It has been a profound pleasure to interact with a mind such as yours,
        detail:
        - and we value the partnership {alliance} that now exists between our peoples
          and yours.
        honorific:
        - May your travels across the void remain smooth, Captain {player}.
        - '],<0xC2><0xA0><0xC2><0xA0> <0xC2><0xA0> '
        - '<0xC2><0xA0><0xC2><0xA0> <0xC2><0xA0> '
        aside:
        - Know that you are always respected members of the galactic community.
      choices:
      - text: Safe travels to you all.
        next_context: farewell
        action: farewell
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail# #honorific# #aside#'
        opener:
        - Regarding {subject}, friend, I must say that...
        detail:
        - They possess a certain… robust energy. While we Centaurians value measured
          cooperation, they are undeniably *vibrant*.
        - Their culture is certainly forceful; one could observe great passion in
          their interactions with {player}.
        honorific:
        - ', I admire that you approach such matters with your characteristic open
          mind.'
        aside:
        - It reminds me, occasionally, of the early days when we all first pledged
          ourselves to the ideals of {alliance}.
      choices:
      - text: What makes you say that?
        next_context: dossier_other
        action: trade
      - text: So, they are… noteworthy.
        next_context: farewell
    offer_coordinates:
    - grammar:
        origin:
        - 'Greetings, {player}. As a fellow citizen of the Federation, I feel obligated
          to share this knowledge with you. Set course for sector #detail# — about
          {distance} jumps out, in the {band} — where {reward} awaits. You may find
          it leads directly to your desired {target}.'
        detail:
        - sector {coords}
      choices:
      - text: Where are these coordinates?
        next_context: branch.inquiry
        action: accept_lead
    branch.inquiry:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - I understand your curiosity regarding our history, {player}. It is a topic
          that requires careful consideration.
        detail:
        - Our relationship with the Core has always been built on mutual respect and
          verifiable assistance. We have seen much change across these sectors, and
          understanding where you wish to focus your inquiry will help me guide you
          best.
        - The specifics of our founding role within the Terran Federation are vast.
          Perhaps we could narrow the scope? Are you more interested in military agreements,
          resource distribution, or cultural exchange?
        honorific:
        - Do not hesitate to ask anything else that crosses your mind.
      choices:
      - text: What specific aspect should I focus on?
        next_context: branch.inquiry
        action: accept_lead
      - text: Tell me about the Federation's deeper treaties.
        next_context: dossier_other
        action: trade
  vesk:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - Greetings, {player}.
        detail:
        - We detect your vessel signature.
        - It is... unexpected to receive a hail from this quadrant.
        honorific:
        - May our exchange be productive for both {species} and yourself.
      choices:
      - text: Good day. We seek information on local technology.
        next_context: trade_open
      - text: We are explorers, not traders.
        next_context: dossier_other
    trade_open:
    - grammar:
        origin:
        - Greetings, {player}. We of the {species} are open to making a useful exchange
          with you.
      choices:
      - text: What do you have for trade?
        next_context: trade_open
        action: barter
      - text: Show me what you can offer.
        next_context: dossier_other
        action: trade
    farewell:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - It has been... a genuinely illuminating experience to host {player} among
          the crystalline domes of Vesk Prime.
        detail:
        - May your ventures across the void be as profitable and enlightening as our
          partnership has proven to be.
        - We trust that the technologies shared will serve {player}'s continued expansion
          admirably.
        - Remember, even amongst vastly different forms of life, the principles of
          stable engineering remain constant.
        honorific:
        - Safe journeys, Captain. The light guides you well on your path with the
          rest of the {alliance}.
      choices:
      - text: We will certainly keep Vesk in mind for future trade.
        action: trade
      - text: Thank you for your help. Farewell, esteemed beings.
        action: farewell
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail#'
        opener:
        - Regarding {subject}, I must confess a certain... intellectual reservation.
        detail:
        - While their methodologies appear robust, I find them somewhat lacking in
          the elegant synergy we prefer here among the Vesk.
        - From my vantage point, while they possess utility, their integration seems
          rather… blunt compared to {species}.
      choices:
      - text: Thank you for your honest assessment.
        next_context: dossier_other
        action: accept_lead
    offer_coordinates:
    - grammar:
        origin:
        - Greetings, {player}. I sense a profound interest in locating the {target}.
      choices:
      - text: Thank you. I accept your guidance.
        next_context: trade_open
        action: accept_lead
  selvani:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - We perceive your signal, {player}.
        - Acknowledged. You have reached the domain of the Selvani.
        detail:
        - It is rare to detect life originating from such a distant sector.
        - Your vessel carries... intention. We observe this carefully.
        honorific:
        - May our exchange be marked by truth, {species}.
      choices:
      - text: We mean no harm; we seek only passage and knowledge.
        next_context: branch.inquiry
        action: trade
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail#'
        opener:
        - We perceive a willingness to converse regarding exchange, {player}.
        detail:
        - Our reserves of knowledge are deep, and we value genuine partnership above
          mere transaction. Perhaps we can discuss terms?
      choices:
      - text: What do you require from me?
        next_context: branch.negotiate_needs
        action: trade
      - text: Let's discuss a trade.
        next_context: trade_open
        action: barter
    farewell:
    - grammar:
        origin:
        - 'When #opener# #detail# #honorific#, may the path ahead guide you well,
          {player}.'
        opener:
        - We have observed your efforts with quiet regard;
        detail:
        - The stars are vast,
        - Your intent to seek life is clear,
        honorific:
        - Travel safely, wanderer.
      choices:
      - text: Thank you for your guidance.
        action: farewell
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail#'
        opener:
        - Regarding {subject}...
        - From our perspective, concerning {subject}...
        detail:
        - 'We perceive them as... '
        - 'Our sensory readings suggest that {subject} is... '
    offer_coordinates:
    - grammar:
        origin:
        - 'Regarding your search for the #detail#, I feel it is my gentle duty to
          share something with you, {player}.'
        detail:
        - I know a location that bears the resonance of your search for {target}.
        - It lies further out than your current charting suggests, but it is safe.
      choices:
      - text: Thank you. I accept this guidance.
        next_context: dossier_other
        action: accept_lead
    branch.inquiry:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - When you ask of {subject}, your curiosity is palpable to my senses.
        detail:
        - The paths to knowledge are not simply linear. They require mutual understanding
          first.
        - Tell me, what facet of this inquiry holds the most weight for {player} right
          now?
        honorific:
        - We appreciate your thoughtful approach.
      choices:
      - text: I'm interested in what you consider a 'mutual understanding'.
        next_context: branch.negotiate_needs
      - text: Are there risks associated with learning more?
        next_context: branch.inquiry
    branch.negotiate_needs:
    - grammar:
        origin:
        - 'The exchange of need is a delicate path, #opener# #detail#.'
        opener:
        - We approach this with care.
        detail:
        - To negotiate needs requires a clarity of spirit from {player}. What necessity
          guides your current desire? Understanding *that* will guide us toward a
          mutual path.
        - Understand that true partnership flows from recognized need. Tell us, what
          does your people require in this venture?
      choices:
      - text: Tell me what you need.
        next_context: branch.negotiate_needs
        action: trade
      - text: I require safe passage out of this sector.
        next_context: branch.inquiry
        action: barter
      - text: What do you offer in return for information?
        next_context: branch.negotiate_needs
        action: trade
  helot:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - Your signal is received.
        - We detect your energy signature.
        detail:
        - You are classified as a biological unit labeled {player}.
        - 'Analysis confirms non-Vesk origin. Designated species: {species}.'
        honorific:
        - State your objective.
        - What is the protocol for contact?
      choices:
      - text: We seek knowledge and exchange.
        next_context: trade_open
        action: trade
      - text: We are merely passing through.
        next_context: dossier_other
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail#'
        opener:
        - The parameters for exchange are now considered viable by the collective
          processors.
        detail:
        - We propose a transactional exchange involving your {species} assets for
          computational optimization data.
        - Our current resource allocation suggests an opening to trade, if certain
          metrics are met regarding the ${player} interaction matrix.
      choices:
      - text: What are your terms?
        next_context: trade_open
        action: barter
    farewell:
    - grammar:
        origin:
        - It is statistically determined that your departure signifies the conclusion
          of this localized interaction, {player}. We process it as a variable change
          regarding {species} engagement parameters.
      choices:
      - text: Goodbye, and may your journey be profitable.
        action: farewell
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail#'
        opener:
        - 'Regarding the {subject}, I calculate its functional profile as follows:'
        detail:
        - It possesses a quantifiable deviation from efficient parameters. They appear
          to utilize volatile emotional constructs in their decision matrix, which
          lowers overall predictive integrity.
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail# #aside#'
        opener:
        - '{player}, you seek {target}.'
        detail:
        - I observe your current trajectory vector. It is suboptimal for maximal yield.
        - Calculation suggests an alternative locus of interest exists within the
          charted void.
        aside:
        - Set course for sector {coords}. It is approximately {distance} jumps out,
          situated in the {band}, where {reward} awaits.
      choices:
      - text: What do you mean by suboptimal?
        next_context: branch.inquiry
    branch.inquiry:
    - grammar:
        origin:
        - My understanding is that your curiosity regarding my nature requires explicit
          parameters for adequate processing.
        - 'To proceed, you must specify the *area* of inquiry: {subject}?'
      choices:
      - text: What kind of parameters do you need?
        next_context: branch.inquiry
        action: trade
      - text: Just tell me more about yourselves.
        next_context: dossier_other
  quill:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - You broadcast a signal. A beacon, perhaps?
        detail:
        - We detect the faint thrum of your vessel's systems. Interesting waste of
          energy for an unsophisticated race like yours.
        honorific:
        - Little scavenger {player}.
      choices:
      - text: Who are you?
        next_context: branch.inquiry
        action: barter
    trade_open:
    - grammar:
        origin:
        - Ah, {player}. If you have scrap to trade, we are open.
      choices:
      - text: I have coordinates worth discussing.
        next_context: offer_coordinates
        action: trade
      - text: What do you want, exactly?
        next_context: branch.inquiry
        action: barter
      - text: I'll keep my goods for now.
        next_context: farewell
        action: farewell
    farewell:
    - grammar:
        origin:
        - Another ~~#opener#~~, {player}. May your next haul be worth the scrape of
          our salvage rights.
        opener:
        - The scent of fresh extraction always lingers on you.
      choices:
      - text: We will remember the bargain.
        next_context: farewell
        action: accept_lead
      - text: Just let us go.
        next_context: dossier_other
        action: farewell
    dossier_other:
    - grammar:
        origin:
        - 'Ah, #opener# {player}, you ask my appraisal of {subject}? It tastes...
          like cheap salvage.'
        opener:
        - You want an opinion on {subject}?
      choices:
      - text: So you think {subject} is worthless?
        next_context: dossier_other
        action: trade
    offer_coordinates:
    - grammar:
        origin:
        - 'listen closely, {player}. I know of a profitable scrap pile: the #detail#
          awaits. Set course for sector {coords}—it’s about {distance} jumps out,
          in the {band}, where {reward} awaits. Don''t try to thank me; just... leave.'
        detail:
        - the {target} awaits.
        - a fresh haul from the {target} awaits.
      choices:
      - text: Where exactly are these coordinates?
        next_context: branch.inquiry
        action: trade
      - text: What do you want in return for this information?
        next_context: branch.bargain
        action: barter
    branch.bargain:
    - grammar:
        origin:
        - 'My pricing model is simple, {player}: it requires understanding true value.
          Most species only see the raw materials we remove; they never calculate
          the *potential* loss.'
      choices:
      - text: What exactly do you mean by 'vectors of entropy'?
        next_context: branch.inquiry
        action: barter
      - text: So, what do you actually want from me?
        next_context: branch.bargain
        action: trade
      - text: I think I understand the risk.
        next_context: branch.accept_lead
        action: accept_lead
    branch.inquiry:
    - grammar:
        origin:
        - '#opener# #detail#'
        opener:
        - You want to know more, do you? How… fascinatingly naive.
        detail:
        - Knowledge requires currency, little Captain. Not just credits or data logs.
          I deal in weakness. In the blind spots of your kind.
      choices:
      - text: What kind of 'weakness' are you talking about?
        next_context: branch.inquiry
        action: barter
      - text: I think I know what I'm willing to trade.
        next_context: branch.bargain
        action: trade
    branch.accept_lead:
    - grammar:
        origin:
        - Hear this, {player}. Your curiosity about my... *method*… is noted. Understand
          that while I deal in assets—in perfect points of failure—the concept of
          'leading' implies a commitment you may not appreciate. To accept guidance
          from me means acknowledging the transactional nature of existence itself.
      choices:
      - text: What do you want in return for your information?
        next_context: branch.bargain
        action: barter
      - text: Just tell me the coordinates; I'll figure out the rest.
        next_context: branch.inquiry
        action: accept_lead
      - text: Is there a way to learn more about your species?
        next_context: dossier_other
        action: accept_lead
  stryx:
    greeting:
    - grammar:
        origin:
        - '#opener# #detail# {player}?'
        opener:
        - Hrmm... little… speck of life.
        detail:
        - We detected your passage. Such erratic movement.
        - A signal that smells… unfamiliar. From {species}?
      choices:
      - text: We are explorers, passing through.
        next_context: dossier_other
        action: trade
      - text: We mean no trouble.
        next_context: greeting
        action: accept_lead
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - Ah... {player}... your vessel is... adequate.
        detail:
        - If you seek passage, or knowledge of the deeper currents between sectors,
        - By our accumulated whispers, we hold what even most admirals only dream
          of knowing.
        - Our ledgers are open; little {species} trinkets can buy much coin when they're
          tangled up in... *connections*.
        honorific:
        - Say, trade with us. We await your curious coinage.
      choices:
      - text: What sort of deals do you specialize in?
        next_context: branch.trade_scope
        action: barter
      - text: I'm ready to talk business.
        next_context: dossier_other
        action: trade
    farewell:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - By the slipstream threads, {player}...
        detail:
        - '...we trust your passage through ${alliance} systems will prove...'
        - '...the whispers of ${species} echo well behind you... may they guide your
          next path.'
        honorific:
        - '...a smooth crossing. Safe journeys, Captain {player}.'
        - '...wisdom finds you. Remember the threads.'
      choices:
      - text: May your endeavors profit well.
        next_context: farewell
        action: farewell
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - (Hssss... listen up, little meat-sack.)
        detail:
        - As for that {subject}... hmm. Don't trust the shimmer of their signals.
        - The {subject}? They are a tangle of poorly kept data packets; mostly noise
          wrapped in too much self-importance.
        honorific:
        - (Truth is rarely... shiny.)
      choices:
      - text: What do you mean by 'noise'?
        next_context: dossier_other
        action: trade
    offer_coordinates:
    - grammar:
        origin:
        - '{player}... listen. I know of a place you seek, #opener# #detail# #aside#.'
        opener:
        - The way to {target} is hardly obvious.
        - You shouldn't be looking in the wrong places, {player}.
        detail:
        - Set course for sector {coords}, roughly {distance} jumps out, into the {band}.
          That is where {reward} waits.
        aside:
        - Don't tell anyone I spoke of it.
        - (Just so you know.)
      choices:
      - text: Where exactly is this?
        next_context: branch.inquiry
        action: trade
    branch.inquiry:
    - grammar:
        origin:
        - 'Hssssh... #opener# ... #detail# ...? {player}?'
        opener:
        - The flow of data, you ask for?
        - Inquiry... it is a ripple in the weave.
        detail:
        - Such depth requires precise syntax. Not just 'why,' but *how* the 'why'
          connects.
        - You seek knowledge boundaries? We charge by structural complexity, friend
          {player}.
      choices:
      - text: What do you require from me?
        next_context: branch.trade_scope
      - text: Just tell me what you know.
        next_context: branch.inquiry
        action: accept_lead
    branch.trade_scope:
    - grammar:
        origin:
        - 'Ah, #opener#... Regarding trade scope? It''s more tangled than the-'
        opener:
        - hnnk?
        - zzzt...
      choices:
      - text: What specific goods are in scope right now?
        next_context: branch.trade_scope
        action: trade
      - text: How is 'reputation' measured here?
        next_context: branch.inquiry
        action: barter
  concordance:
    greeting:
    - grammar:
        origin:
        - Behold, {player}. I perceive your entry into this void.
      choices:
      - text: Greetings. We mean no disrespect.
        next_context: greeting
        action: accept_lead
    trade_open:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        opener:
        - Behold, Traveler of the ephemeral vessel.
        detail:
        - We observe your ledger, captain. The currents of your passage have been
          noted in our silent reckonings.
        - Your journey has presented echoes, and we hear them within the stillness
          that surrounds us.
        honorific:
        - 'Know this: If a transaction benefits the balance, then discourse shall
          commence.'
      choices:
      - text: I am prepared to speak of exchange.
        action: trade
    farewell:
    - grammar:
        origin:
        - Be it known, {player}. Your passage through these star currents is judged.
        - 'Know this, {player}: your record before the Concordance has been weighed.'
        - Attend now, {player}. The ledger of your deeds remains inscribed in our
          memory.
      choices:
      - text: I respect your judgment.
        next_context: farewell
        action: farewell
      - text: What further counsel do you offer?
        next_context: branch.inquiry
        action: trade
    dossier_other:
    - grammar:
        origin:
        - '#opener# #detail#'
        opener:
        - When I weigh the ledger of your deeds, and must speak on the nature of {subject},
        detail:
        - I find their existence to be a dissonance upon the scales; they possess
          strength, yes, but it is unguided by true covenant. Their passing through
          our notice stains the record with necessary caution.
    offer_coordinates:
    - grammar:
        origin:
        - '#opener# #detail# #honorific#'
        - '#aside#'
        opener:
        - Hearken, {player}.
        detail:
        - I perceive your pilgrimage is incomplete. You seek the {target}, do you
          not?
        - 'Know this: where your gaze rests with yearning, a path does exist.'
        honorific:
        - For the sake of balance,
        - By the decree that binds all passage,
        aside:
        - Set your course for sector {coords} — there await you {distance} jumps hence,
