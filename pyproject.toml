[project]
name = "trade-wars-clone"
version = "0.1.0"
description = "Edge of the Unknown — an exploration-first descendant of TradeWars 2002"
authors = [{name = "James McDuffie", email = "mcduffie@pitfall.org"}]
requires-python = ">= 3.12"
dependencies = []

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["edge"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
textual = "*"
rich = "*"
ruff = "*"
mypy = "*"

[tool.pixi.pypi-dependencies]
trade-wars-clone = { path = ".", editable = true }

[tool.pixi.tasks]
tui = "python -m edge.tui"
shots = "python -m edge.tui.shots"
lint = "ruff check edge"

# ruff / mypy are enforced on core/ and bigbang/ per CLAUDE.md; the throwaway
# tui skeleton is intentionally exempt until Phase 1 wiring lands.
[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["edge/core", "edge/bigbang"]
