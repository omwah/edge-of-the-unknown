[project]
name = "edge-of-the-unknown"
version = "0.1.0"
description = "Edge of the Unknown — an exploration-first descendant of TradeWars 2002"
authors = [{name = "James McDuffie", email = "mcduffie@pitfall.org"}]
requires-python = ">= 3.12"
dependencies = []

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["edge"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
textual = "*"
textual-dev = "*"  # `textual` CLI: demo, run --dev, console, serve
rich = "*"
pydantic = ">=2"   # config schema + (later) public DTOs (DESIGN §15)
pyyaml = "*"       # parse the YAML game config (DESIGN §4 config file)
ruff = "*"
mypy = "*"
pytest = "*"
hypothesis = "*"
pytest-asyncio = "*"

[tool.pixi.pypi-dependencies]
edge-of-the-unknown = { path = ".", editable = true }

[tool.pixi.tasks]
tui = "python -m edge.tui"
shots = "python -m edge.tui.shots"
lint = "ruff check edge"
test = "pytest"
typecheck = "mypy"

# ruff / mypy are enforced on core/ and bigbang/ per CLAUDE.md; the throwaway
# tui skeleton is intentionally exempt until Phase 1 wiring lands.
[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["edge/core", "edge/bigbang"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
