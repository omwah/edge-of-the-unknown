[project]
name = "edge-of-the-unknown"
version = "0.1.0"
description = "Edge of the Unknown — an exploration-first descendant of TradeWars 2002"
authors = [{name = "James McDuffie", email = "mcduffie@pitfall.org"}]
requires-python = ">= 3.12"
dependencies = ["opensimplex>=0.4.5.1,<0.5", "tracery>=0.1.1"]

[project.scripts]
edge = "edge.tui.app:main"
bigbang = "edge.bigbang.__main__:main"
edge-author-dialogue = "edge.dialogue.authoring.cli:main"
edge-playtest-dialogue = "edge.dialogue.authoring.playtest:main"
edge-sysop = "edge.devtool.sysop:main"
edge-bot = "edge.bot.__main__:main"
edge-server = "edge.server.net:main"  # host a game over websocket JSON-RPC (Phase 4, WP63)

# Dev-only extras for the cloud authoring backends (the Ollama backend is plain HTTP, no SDK).
# The runtime never calls an LLM, so these are not Phase-runtime dependencies.
[project.optional-dependencies]
authoring = ["anthropic>=0.40", "google-antigravity>=0.2"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["edge"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
textual = "*"
textual-dev = "*"  # `textual` CLI: demo, run --dev, console, serve
rich = "*"
pydantic = ">=2"   # config schema + (later) public DTOs (DESIGN §15)
pyyaml = "*"       # parse the YAML game config (DESIGN §4 config file)
websockets = "*"   # Phase-4 transport: JSON-RPC over websockets (DESIGN §15, WP63)
matplotlib = "*"   # dev-only sprite-sheet export (edge/art/export.py)
ruff = "*"
mypy = "*"
pytest = "*"
hypothesis = "*"
pytest-asyncio = "*"
pytest-cov = "*"

[tool.pixi.pypi-dependencies]
edge-of-the-unknown = { path = ".", editable = true }
textual-serve = "*"  # `--serve`: host the Textual app in a browser (DESIGN §15)
tracery = ">=0.1.1"  # offline-authored grammar realisation of alien dialogue (DESIGN §6.7)
"chafa.py" = "*"     # Python binding to libchafa: render species portraits as terminal art (tui)
pillow = "*"         # decode portrait images to pixels for chafa (tui)
pytest-textual-snapshot = "*"  # PyPI wheel includes the HTML diff-report template; conda 1.1.0 does not

[tool.pixi.tasks]
edge = "python -m edge.tui"
serve = "python -m edge.tui --serve"
# WP68 hosted play: run the game server (lobby+accounts) and the browser-served remote client.
# Two terminals: `pixi run host` then `pixi run serve-remote` (see docs/HOSTING.md).
host = "edge-server --accounts accounts.db --games-dir games"
serve-remote = "python -m edge.tui --serve --connect ws://localhost:8765"  # browser → hosted game
shots = "python -m edge.tui.shots"
bigbang = "python -m edge.bigbang"
devtool = "python -m edge.devtool"
art-gen = "python -m edge.art.cli"
author-dialogue = "edge-author-dialogue"  # offline LLM dialogue authoring (DESIGN §6.7)
playtest-dialogue = "edge-playtest-dialogue"  # play-test authored dialogue in the contact TUI
lint = "ruff check edge tests"
test = "pytest"
typecheck = "mypy"
cov = "pytest --cov=edge.core --cov=edge.bigbang --cov=edge.store --cov=edge.server --cov=edge.engine --cov-report=term-missing"
check = { depends-on = ["lint", "typecheck", "test"] }

# ruff / mypy are enforced on core/ and bigbang/ per CLAUDE.md; the throwaway
# tui skeleton is intentionally exempt until Phase 1 wiring lands.
[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["edge/core", "edge/dialogue", "edge/bigbang", "edge/store", "edge/server", "edge/engine"]
# The dev-only authoring pipeline does I/O and talks to untyped LLM SDKs; it is exempt from
# mypy-strict like the throwaway tui (DESIGN §6.7 — never imported by runtime).
exclude = "edge/dialogue/authoring/"
plugins = ["pydantic.mypy"]

# PyYAML ships no type stubs; the config loader treats parsed data as Any at the
# I/O seam (validated immediately by Pydantic).
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

# matplotlib ships no type stubs; it is used only by the dev-only sprite-sheet
# export (edge/art/export.py), isolated behind lazy imports. tracery ships no stubs
# either; it is used only behind edge/dialogue/render.py.
[[tool.mypy.overrides]]
module = ["matplotlib.*", "tracery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
